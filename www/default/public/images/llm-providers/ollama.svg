<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Ollama llama icon - simplified mark -->
  <rect width="200" height="200" rx="40" fill="#1a1a2e"/>
  <g transform="translate(100,105) scale(0.85)">
    <!-- Head outline -->
    <path d="M-8,-75 C-30,-75 -50,-60 -55,-35 C-60,-10 -55,10 -50,25 C-48,30 -45,35 -43,40 L-40,55 C-38,65 -30,72 -20,72 L20,72 C30,72 38,65 40,55 L43,40 C45,35 48,30 50,25 C55,10 60,-10 55,-35 C50,-60 30,-75 8,-75 Z" fill="#ffffff"/>
    <!-- Left ear -->
    <path d="M-40,-55 C-50,-80 -60,-90 -55,-95 C-50,-100 -40,-85 -35,-65" fill="#ffffff" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
    <!-- Right ear -->
    <path d="M40,-55 C50,-80 60,-90 55,-95 C50,-100 40,-85 35,-65" fill="#ffffff" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
    <!-- Left eye -->
    <ellipse cx="-20" cy="-15" rx="8" ry="10" fill="#1a1a2e"/>
    <!-- Right eye -->
    <ellipse cx="20" cy="-15" rx="8" ry="10" fill="#1a1a2e"/>
    <!-- Nose / snout -->
    <ellipse cx="0" cy="20" rx="18" ry="14" fill="#e0e0e0"/>
    <!-- Nostrils -->
    <ellipse cx="-7" cy="20" rx="3.5" ry="4" fill="#1a1a2e"/>
    <ellipse cx="7" cy="20" rx="3.5" ry="4" fill="#1a1a2e"/>
    <!-- Mouth -->
    <path d="M-5,30 Q0,35 5,30" fill="none" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
