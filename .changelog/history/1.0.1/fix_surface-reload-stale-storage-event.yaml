  fixed:
    - timestamp: '2026-10-23T10:00:00Z'
      title: Apply configuration reloads and surface changes one at a time
      description: >-
        A configuration reload re-reads Agent Surfaces from disk, and each surface that changed is
        then applied again as a single-surface change. That change could run while the reload was
        still applying its own, so a surface edited by hand and reloaded could keep serving the A2A
        versions it had before the reload. Explicit reloads, the reload a node runs when it becomes
        Active, API surface changes and changes from storage are now applied one at a time, and a
        change from storage applies the surface as currently stored rather than an older copy.
