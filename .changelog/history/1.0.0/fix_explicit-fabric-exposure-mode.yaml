---
branch: fix/explicit-fabric-exposure-mode
changes:
  added:
  - timestamp: '2026-10-09T00:00:00.000Z'
    title: Add an explicit Fabric exposure mode for Remote gateways
    description: 'A Remote gateway record now has `exposure_mode` (`all`, `none` or
      `list`), replacing the rule that an empty exposure list means every surface.
      The management API (`PUT /v1/gateways/{id}/exposed-surfaces`) and the dashboard
      Publishing tab show and edit it. On boot, records without a mode are migrated
      and persisted: an empty list becomes `all` and a non-empty list `list`, so existing
      peers keep their access.'
  changed: []
  fixed: []
  removed: []
  security: []
  breaking:
  - timestamp: '2026-10-09T00:00:00.000Z'
    title: "⭐ Newly paired Remote gateways reach no surface until one is exposed"
    description: Every pairing path, including the inbound handshake, now creates
      the peer with exposure mode `none`, so it can neither forward to nor list any
      local surface until an operator exposes one. An exposure update without `exposure_mode`
      and with an empty list now means `none`, not every surface. The capability query
      now filters on the authenticated sender's exposure and returns nothing when
      that lookup fails, instead of every surface.
