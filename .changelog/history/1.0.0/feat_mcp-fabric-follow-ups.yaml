branch: feat/mcp-fabric-follow-ups
changes:
  added: []
  changed:
  - timestamp: '2026-10-09T15:00:00.000Z'
    title: Document the shared pepper and per-node OAuth state checks for multiple
      nodes
    description: The deployment docs say to set the same AG_IDENTITY_HASH_PEPPER on
      every node of a multi-node gateway, and that used OAuth state nonces are checked
      per node, not across nodes.
  fixed:
  - timestamp: '2026-10-09T10:40:00.000Z'
    title: Reconnect a Connection Point whose account the mediator has lost
    description: A mediator can lose accounts while connections stay open, for example
      when its store is flushed or fails over. It recreates an account only when that
      account sends and refuses delivery to a missing one, so a gateway that only
      received stayed unreachable until it sent, restarted or was reconnected by hand.
      Every connected Connection Point now checks its own mediator account every 30
      seconds, four at a time, reauthenticates and reregisters when the account is
      gone, and re-opens the receive list, within 10 seconds, when it was closed.
      An account that cannot be read on consecutive checks is logged at warn, and
      a Connection Point stopped or removed while it is checked is not started again.
      The Gateway Ping timeout uses the same check.
  - timestamp: '2026-10-09T12:30:00.000Z'
    title: Keep concurrent first Fabric stream requests to one peer from failing
    description: When several first requests to a peer negotiated stream capabilities
      at once, a later disclosure replaced the earlier agreement and the request still
      waiting for it failed, and a burst of first requests could use up the peer's
      share of the receiver's offer table. Concurrent first requests to a peer now
      share one capability query and all get its answer for up to 5 seconds, after
      which the next request sends a new query; a query that cannot be sent fails
      them at once, and a request keeps the agreement negotiated for its own query
      when a later one replaces it.
  removed: []
  security:
  - timestamp: '2026-10-09T12:30:00.000Z'
    title: "⭐ Give each Fabric peer and tenant its own share of the shared stream
      tables"
    description: One peer could fill the capability offer, capability probe or Open
      replay table and get every other peer refused. Once a table is half full, each
      peer may hold an eighth of it and the peers of one tenant half, so a second
      peer is still served after one peer sends hundreds of refused requests, while
      a single busy peer is not capped while the table has room. The tenant share
      applies only while other tenants' or untenanted peers hold entries, and the
      values are fixed. A full capability probe table or share on the sending gateway
      now answers the caller 429 with Retry-After 5 instead of 502. The listener also
      admits Opens off its reader loop, at most 16 at a time, holding up to 8 early
      frames per stream until its Open is admitted or its admission ends, so a slow
      admission no longer stalls every other message.
  - timestamp: '2026-10-09T17:00:00.000Z'
    title: End running Fabric streams when a peer's access is revoked
    description: Running framed streams kept going after a peer left active or was
      removed, a surface was un-exposed, or a Connection Point was disabled, and a
      disabled Connection Point still admitted new streams until its listener restarted.
      A gateway or Connection Point write through this node now ends, at once, only
      the streams a narrowing change no longer allows. A change picked up from shared
      storage, or a write that cannot read the record it replaces, ends the running
      streams the stored records no longer admit. An Open admitted while a revocation
      runs is refused, and admission reads the Connection Point's current record.
  breaking:
  - timestamp: '2026-10-09T12:30:00.000Z'
    title: Answer full Fabric stream caps on the receiving gateway with capacity_reached
    description: A full framed-stream cap, Open replay table or table share, a full
      admission pool, or a peer past its Open rate, is now refused with capacity_reached
      instead of unavailable, so the sending gateway's caller gets 429 with Retry-After
      instead of 502. A 1.0.0 sender cannot parse capacity_reached, so while a pair
      runs mixed versions its callers wait for their response deadline, holding its
      stream slots, whenever the upgraded receiver is out of room. Normal traffic
      is unaffected. Upgrade both gateways of a pair together, or the sending gateway
      first, as an upgraded sender understands both codes.
