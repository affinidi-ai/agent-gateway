branch: feat/a2a-support-followup-changes
changes:
  added:
    - timestamp: '2026-10-08T00:00:00.000Z'
      title: ⭐ Choose accepted A2A versions and message validation per A2A surface
      description: >-
        The Access Point of an A2A or AP2 surface has an A2A Protocol section with a
        checkbox for each A2A version (0.3 and 1.0, both on by default) and a Message
        validation dropdown: Off, JSON-RPC envelope (the default) or Envelope + A2A
        fields, stored as access_point.a2a.accepted_versions and access_point.a2a.validation
        (off, envelope, full). Version negotiation and the -32009 supported list follow the
        surface's accepted versions. When the surface's own Target is an A2A proxy, the
        versions are fixed and shown locked, in every variant view, and the Managed Agent
        panel explains why; a Target in view that is an A2A proxy shows the JSON-RPC
        envelope, locked, while a variant that points the Target at a URL keeps Message
        validation editable. The
        surface API refuses the block on a surface that is not A2A or AP2, and only an
        appliance-wide administrator can set validation to off; an access token with a
        tenant or a resource scope, a resource pattern or required headers alone, is
        refused with 403.
  changed:
    - timestamp: '2026-10-10T00:00:00.000Z'
      title: Check the A2A request shape against the A2A version of its method
      description: >-
        With full validation (Envelope + A2A fields), the spelling of the method now picks
        the rules: message/send is checked against what A2A 0.3 defines (role user or
        agent, parts of text, file or data, kind when present) and SendMessage against
        what A2A 1.0 defines (role ROLE_USER or ROLE_AGENT, parts of text, raw, url or
        data), and the task-listing status filter likewise. A value the method's version
        does not allow, such as role user on SendMessage, is refused with -32602, naming
        the field; before, either version's values passed on any method. Fields a version
        does not define, such as kind on a 1.0 request, are ignored, as A2A 1.0 says
        implementations should. The negotiated A2A-Version is not consulted.
    - timestamp: '2026-10-09T00:00:00.000Z'
      title: ⭐ Start new A2A proxy surfaces at A2A 1.0 only
      description: >-
        An A2A proxy surface accepts fixed A2A versions, and its generated agent card lists
        them. A new one, or one whose Target moves to an A2A proxy, accepts 1.0 only, so its
        callers send A2A-Version 1.0. A surface stored before this release is given its
        versions when it is loaded, 0.3 and 1.0 (1.0 only if the retired
        a2a_legacy_compatibility flag was off), so its callers, including those that send
        no A2A-Version header, keep working unchanged, provided they send a well-formed
        JSON-RPC request: an A2A proxy Target always checks the JSON-RPC envelope, even
        where [a2a] validate_messages is false, and a startup warning names those
        surfaces. The surface API refuses a change to an A2A proxy surface's versions; a
        block that names no versions takes the fixed ones, and a warning is logged when
        moving a Target to an A2A proxy narrows a surface's versions.
    - timestamp: '2026-10-09T00:00:00.000Z'
      title: List both A2A versions on the onboarding agent card
      description: >-
        The onboarding agent card belongs to no surface, so it now always lists A2A 0.3 and
        1.0 and carries the v0.3 fields. It no longer follows the retired
        a2a_legacy_compatibility flag. What the onboarding agent serves is unchanged.
    - timestamp: '2026-10-09T00:00:00.000Z'
      title: Apply A2A version negotiation and validation to fabric:// surfaces
      description: >-
        An A2A surface whose Target is fabric:// now applies its accepted versions and
        validation level on the sending gateway, before the request is paid for or sent
        over the fabric, as a surface with a managed-agent Target does. Previously these
        checks were skipped, so the A2A Protocol settings saved on such a surface had no
        effect. With the default settings, only unsupported A2A versions and requests that
        are not a single, well-formed JSON-RPC request are newly refused, which a
        conformant agent refuses too. A fabric surface given settings on upgrade where the
        retired a2a_legacy_compatibility flag was off accepts A2A 1.0 only, as other
        surfaces already did. The receiving gateway does not run the checks again, and the
        version metric counts fabric traffic on the sending gateway.
    - timestamp: '2026-10-08T00:00:00.000Z'
      title: Deprecate [a2a] validate_messages in favour of per-surface validation levels
      description: >-
        Validation is now set per A2A surface: off, envelope (valid JSON, jsonrpc 2.0 and a
        string method, which refuses batches) or full (also the A2A request shape). When
        surfaces are loaded, one stored without its own settings takes envelope, or off
        when [a2a] validate_messages is false; it never takes full. A startup warning asks
        for the key to be removed, and it is removed from the example configuration. With
        the DynamoDB configuration source the retired switches are not applied, and the
        startup warning says so. A configuration reload that gives surfaces settings
        serves them at once, reads each surface again before storing its block, so it keeps
        a block saved through the API before then, and does not bring back a surface
        deleted meanwhile. Only an Active node stores the
        settings; a Standby node stores them when it is promoted.
    - timestamp: '2026-10-08T00:00:00.000Z'
      title: Explain A2A version and validation refusals in the gateway log
      description: >-
        A -32009 refusal now logs what the surface accepts, whether the caller sent no
        A2A-Version header (read as 0.3), and the header the caller must send; an A2A
        proxy target is named as such. Request-shape refusals say the surface's validation
        is full, and the negotiation debug line shows the surface's settings. The
        A2A proxy now logs a warning when it refuses an unsupported method, a request
        without params.message, or a message without text parts. Caller-supplied values in
        these lines (the A2A-Version header and the JSON-RPC method) are cut to 64
        characters and escaped, and no message content is logged.
  fixed:
    - timestamp: '2026-10-09T00:00:00.000Z'
      title: Answer A2A proxy SendMessage requests with A2A 1.0 replies
      description: >-
        The A2A proxy answered every request in the A2A 0.3 shape, which A2A 1.0 clients
        cannot read. It now picks the shape from the send method: SendMessage gets the 1.0
        SendMessageResponse (result.message, role ROLE_AGENT, parts without kind), and
        message/send keeps the 0.3 reply (the message itself, kind message, role agent),
        whatever A2A-Version the caller sends.
  removed:
    - timestamp: '2026-10-08T00:00:00.000Z'
      title: Remove the global A2A legacy compatibility flag in favour of surface settings
      description: >-
        The a2a_legacy_compatibility Settings flag is replaced by each A2A surface's
        accepted versions. When surfaces are loaded, an A2A surface stored without its own
        settings is given them from the previous gateway-wide switches and they are written
        to storage: A2A 1.0 only if the flag was off, both versions otherwise. Versions
        before this change cannot read a surface with access_point.a2a, so rolling back
        needs the block removed from each stored surface first.
  security:
    - timestamp: '2026-10-09T00:00:00.000Z'
      title: Charge A2A requests that payment method filters cannot match
      description: >-
        An x402 or MPP payment with A2A method filters used to be skipped for a request body
        that is not JSON, is a JSON-RPC batch, or has no string method, because the filters
        could not be matched. Such a request is now charged; a request without a body is
        still not. On the inbound path it only reaches payment when the surface's A2A
        validation is off; on the fabric receiving gateway, which checks payment without
        the envelope check, it can at any validation level.
    - timestamp: '2026-10-19T00:00:00Z'
      title: Stop logging A2A message text and escape caller values in payment logs
      description: >-
        The x402 A2A method filter logged the caller's message text, up to 200 characters
        and in full when a message pattern matched; it now logs only its length. x402 and
        MPP log lines quote, escape and cut to 64 characters the JSON-RPC method, the MCP
        tool name, the payment method, network, amount and reference a caller sends, and
        escape payment verification and settlement errors, which can quote the caller's
        payment proof, so a request cannot write extra lines into the gateway log.
  breaking:
    - timestamp: '2026-10-08T00:00:00.000Z'
      title: ⭐ Stop checking the A2A request shape by default
      description: >-
        The A2A request-shape check (messageId, role, parts, params.id) used to run on
        every managed-agent A2A surface by default. A surface stored without its own
        settings now gets envelope validation (or off when [a2a] validate_messages is
        false), never the request-shape check, so malformed A2A messages are forwarded
        for the agent to decide. To keep refusing them, set Message validation to
        Envelope + A2A fields (access_point.a2a.validation = full) on those surfaces. On the
        first start after the upgrade, a warning names the surfaces that lost the check.
