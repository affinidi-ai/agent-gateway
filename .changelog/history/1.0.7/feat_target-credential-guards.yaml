branch: feat/target-credential-guards
changes:
  added:
    - timestamp: '2026-11-02T11:09:38Z'
      title: Add credential policy rules for https Targets and Target source authentication
      description: >-
        The [credential_policy] bootstrap section gains target_https and target_source_auth,
        each warn (the default) or enforce. The startup and reload report lists surfaces whose
        Target or Transit Point sends a Target credential to an endpoint that is not https
        (http://, fabric:// and a2a-proxy:// count as not https; a proxy:// Target counts as its
        MCP proxy's base_url) or from a leg that
        does not check its callers. An A2A or AP2 surface whose a2a-proxy:// Target sends its A2A
        proxy's Direct Line credential is listed under target_source_auth only, when its Access
        Point has no source authentication.
    - timestamp: '2026-11-02T12:23:24Z'
      title: Record Target credential failures in the VP Audit Log
      description: >-
        Each target.auth or Transit Point target_auth credential that cannot be obtained or is
        withheld under enforce writes one request_rejected record with reason
        target_auth_failed, carrying the surface, the Transit Point when it was a Transit
        Point's credential, provider id, trace id, outcome (rejected or passthrough) and the
        token endpoint's OAuth error code. A card fetch that serves a caller's request carries
        that request's trace id; the dashboard's card preview has none. A request refused because it would carry the
        credential outside the Target base path, or because a Transit Point's credential cannot
        be sent as a header, is recorded too, as rejected whatever the fallback. Records never carry a token, secret, token endpoint
        body or error_description. The OAuth error code is kept only when it is a registered
        RFC 6749 or RFC 6750 code; any other value is recorded as other.
        Rollback: a gateway version without this change cannot read these records. It skips
        each one without an error, so the VP Audit Log page and its totals omit them. Each one in
        the audit journal is counted as corrupt and logged in one warning per batch, and an
        unreadable record at the end of the newest journal segment is cut off at startup. The
        records stay in the file and show again after the upgrade.
    - timestamp: '2026-11-05T12:03:36Z'
      title: Record Target authentication changes in the VP Audit Log
      description: >-
        A surface create, update, patch, variant write or delete through the management API
        records a target_auth_changed event for each leg whose Target authentication it added,
        changed or removed: the Target or a Transit Point, of the base surface or a variant. The
        record names the management caller, the method and credential provider id before and
        after, and the parts a change replaced, never a secret id, header or value, so the VP
        Audit Log shows who changed the credential a surface sends.
    - timestamp: '2026-11-05T13:25:41Z'
      title: Record a forced secret delete in the VP Audit Log
      description: >-
        DELETE /secrets/{id}?force=true that deletes a secret records a secret_force_deleted
        event, whether or not records still used it. The record names the management caller
        as actor, the secret id, force, and each record that used the secret by kind (surface,
        credential_provider, a2a_proxy or sts_client) and id, so the VP Audit Log shows who
        broke the credentials that depended on it. It never carries the secret value or a
        record's name. A delete without force, and a delete the gateway refuses, record nothing.
  changed:
    - timestamp: '2026-11-05T09:00:00Z'
      title: Document which Fabric agent card read carries the remote Target credential
      description: >-
        A Fabric card read of a Transit Point target reads /.well-known/agent-card.json with the
        remote Target credential and falls back to /.well-known/agent.json as a public discovery
        read without it, so a remote Target that serves its card only at the legacy path and
        requires its credential there is reported as AGENT_CARD_UNAVAILABLE.
    - timestamp: '2026-11-02T12:23:25Z'
      title: Request a new service token after a Target rejects the stored one
      description: >-
        When a Target, including the REST backend of an MCP proxy (proxy://) tool call, answers
        401 with a Bearer challenge whose error is invalid_token to a service token sent as
        Authorization Bearer, the gateway deletes the stored token, so the next request gets a
        new one. The request is not retried. Any other 401, a 403, static or
        API key credentials, and a token sent in another header leave the stored token
        unchanged. A refused token is dropped only while the vault still holds that same token,
        no renewal is running and the token is at least 30 seconds old, and the retry backoff is
        kept, so a misbehaving Target cannot make the gateway request a token on every call.
        Dropping it removes only that token: staged consents and open MCP subscriptions are kept.
        A Transit Point's target endpoint and the Fabric send leg do not drop the token.
  fixed:
    - timestamp: '2026-11-05T13:00:00Z'
      title: Accept a surface save that repairs a variant that cannot be resolved
      description: >-
        A save of a stored surface with a variant that cannot be resolved, such as two variants
        with one alias, was refused while the Target authentication rules listed the stored
        surface's breaches. The stored surface now keeps no breach, so a save that repairs the
        variant is accepted and its Target authentication is held to every rule.
    - timestamp: '2026-11-04T09:00:00Z'
      title: Send only A2A and AP2 requests received over Fabric to an A2A proxy
      description: >-
        A request received over Fabric for an MCP or DIDComm surface whose Target is a2a-proxy:// was sent
        to the A2A proxy, with its Direct Line credential, although the direct path never
        dispatches such a surface to it and surface saves and the startup report check only A2A
        and AP2 surfaces for it. Fabric receive now dispatches to the A2A proxy only for an A2A
        or AP2 surface, as the direct path does; any other surface's request fails without
        reaching the proxy.
    - timestamp: '2026-11-05T11:00:00Z'
      title: Answer a Fabric-received MCP proxy Target credential failure with problem+json
      description: >-
        A tool call of an MCP proxy received over Fabric whose Target credential cannot be
        resolved, with fallback reject, now answers a 502 application/problem+json like the
        other legs. It answered a bare error and status body before.
    - timestamp: '2026-11-05T12:00:00Z'
      title: Send the Target credential over Fabric only for the card fetch, not discovery
      description: >-
        The receiving gateway of a Fabric route treated every public discovery GET or HEAD,
        /discovery included, as the sending gateway's own agent card fetch, so it sent the
        surface's Target credential for an unvetted caller, even under target_source_auth
        enforce. Only a GET of exactly /.well-known/agent-card.json or the surface's configured
        card location now counts as that fetch; any other discovery read gets no credential.
    - timestamp: '2026-11-05T14:00:00Z'
      title: Judge an MCP proxy Target by its proxy's base_url under target_https
      description: >-
        A proxy:// Target never met target_https, so under enforce its credential was withheld
        and its save refused however secure the MCP proxy's backend was. The credential goes to
        the MCP proxy's base_url, so the save check, the credential policy report and every
        MCP proxy request now judge that URL; a missing MCP proxy still counts as not https.
  removed: []
  security:
    - timestamp: '2026-11-05T14:00:00Z'
      title: Pin credentialed legacy MCP proxy tool calls to the vetted backend address
      description: >-
        A legacy MCP proxy tool call that carries the Target credential, direct or over Fabric,
        now vets its REST backend at call time with the policy the proxy's base_url was saved
        under and connects only to the vetted address, as a 2026-07-28 tool call does. A
        backend host that later resolves to loopback or cloud metadata, as a DNS rebinding host
        would, fails the call with "REST tool target is not permitted" and gets no request and
        no credential. Calls without a credential are unchanged. Upgrade note: a stored legacy
        MCP proxy whose base_url resolves to loopback no longer receives credentialed tool calls.
    - timestamp: '2026-11-05T12:00:00Z'
      title: Fail a caller who sends a second token under another spelling of its header
      description: >-
        JWT Bearer caller authentication now treats `_` and `-` in the token header name as the
        same header, as some servers do: a second token under another spelling, such as
        X_User_Token beside X-User-Token, fails the caller, and every spelling but the verified
        header is stripped before forwarding, directly and over Fabric, so an unverified token no
        longer reaches the Target.
    - timestamp: '2026-11-02T11:09:40Z'
      title: ⭐ Refuse Target authentication settings that could leak or inject headers
      description: >-
        A surface save is refused with 400, naming the field, when a new or changed Target
        authentication on a Target or Transit Point uses an invalid or reserved header name
        (including headers the gateway sets itself, such as the transit token and caller
        identity headers), a header another credential on the same leg already sends, or a
        format without exactly one {value} or with CR, LF or NUL. Header names are compared
        without regard to case or to _ against -, as the request path compares them. A
        credential sent to a Target or Transit Point endpoint that is not https, or from a leg
        that does not check its callers, is refused only while target_https or
        target_source_auth is enforce; in warn it is saved, logged and answered with a Warning
        header. The same caller rule holds an A2A or AP2 surface whose a2a-proxy:// Target sends
        its A2A proxy's Direct Line credential. A stored setting that already broke a rule still
        saves while that leg is unchanged, and a surface may not have two Transit Points with
        the same id. Upgrade note: API clients that create or change a setting with a bad header
        name or format now get 400.
    - timestamp: '2026-11-02T11:09:41Z'
      title: Drop caller headers that spell the Target credential header with _ for -
      description: >-
        A caller header named like the Target authentication header was already withheld on
        the direct Target path, Fabric receive and Transit Points when the names matched
        without regard to case. It is now also withheld when it spells the name with _ for -,
        which some servers read as the same header, and on two more legs: an Access Point's
        Fabric send and the agent card fetch that sends no credential. So a caller cannot
        supply or override the Target credential on any leg. Upgrade note: a client that sent
        its own value under such a name with fallback passthrough now reaches the Target
        without it.
    - timestamp: '2026-11-04T09:00:00Z'
      title: Drop caller headers named like a delegated credential header
      description: >-
        An Access Point, including its Fabric send and its agent card fetch, and the Fabric
        receiving gateway no longer forward a caller header named like the bearer_header (Authorization) or custom_header of
        a credential binding in the surface's outbound_credentials, compared without regard to
        case or to _ against -, whether or not the binding adds a value to that request, as a
        Transit Point already did. So a caller cannot send X_Vendor_Token next to the gateway's
        X-Vendor-Token.
        Upgrade note: a caller value under such a name, including an Authorization header kept
        by forward_header on a surface with a bearer_header binding, no longer reaches the
        Target.
    - timestamp: '2026-11-02T11:57:06Z'
      title: 'Keep the Target credential under the Target''s base path'
      description: >-
        The gateway sends a Target credential only to URLs with the Target's scheme, host and
        port whose path equals the Target path or lies below it, compared after decoding
        percent-encoded unreserved characters and removing dot segments (an encoded slash is
        never decoded). A request that would leave the base path, such as /route/%2e%2e/admin,
        gets 502 Target authentication failed and is not forwarded. This covers direct forwards,
        an Access Point's Fabric send, the Fabric receiving gateway and MCP proxy tool calls; a
        GET or HEAD of the surface's configured agent card location stays allowed. Upgrade note:
        clients that relied on paths leaving the Target base path on a surface with Target
        authentication now get 502. Paths a server could still resolve outside the base, such as
        ..;/, ..%2F, ..%5C, ..%3B and their double-encoded forms, are refused as well, and a
        2026-07-28 MCP proxy tool call refuses a path parameter that would form one.
    - timestamp: '2026-11-02T12:19:18Z'
      title: Never follow an MCP proxy redirect with the Target credential
      description: >-
        A legacy MCP proxy tool call that carries the Target credential is now sent by the
        gateway's own REST client, which does not follow redirects; the previous client followed
        them and could carry a credential header to another host. A redirect now fails the tool
        call. Calls without a credential are unchanged. Upgrade note: credentialed legacy tool
        calls now take the gateway's REST client instead of rmcp-openapi's, and return the same
        tool result for a JSON response, failure statuses included. They apply the mcp_http size
        limits, encode each path parameter as one segment, refuse a base_url with user info, and
        turn a 2xx response the tool's output schema does not admit into a tool error. A non-JSON
        result's text leaves out the response headers, a non-UTF-8 body other than an image fails,
        and a refused call names its cause in different words. They reach the same URL as
        before: a base_url without a trailing slash keeps its last path segment.
    - timestamp: '2026-11-02T12:23:22Z'
      title: Withhold Target credentials from non-https or unchecked legs when enforced
      description: >-
        Each forwarded request checks its Target credential against the target_https and
        target_source_auth rules. With warn (the default) the credential is still sent and a
        warning naming the surface, its surface variant, and the Transit Point on its leg, is
        logged once per leg (the base surface and each variant are separate legs) and rule until
        restart, and only when the credential is sent. With enforce the credential is
        withheld and its fallback decides:
        reject answers 502, passthrough forwards without it. A Transit Point is judged by its
        own endpoint and caller check. An Access Point with at least one caller_authentication
        method checks its callers, however many methods it has; a caller carrying credentials for
        more than one method fails authentication and gets no Target credential. The gateway's
        own agent card fetch has no caller, so only
        target_https can withhold its credential. The Direct Line credential of an a2a-proxy://
        Target's A2A proxy is held to target_source_auth only: with enforce, on a surface whose
        Access Point checks no callers, it is withheld and the request goes on without it.
        Upgrade note: with enforce, stored http, fabric:// or proxy:// Targets and Transit
        Points lose their credential under target_https, and legs without caller
        authentication, including A2A proxy Targets, lose it under target_source_auth.
    - timestamp: '2026-11-02T13:41:37Z'
      title: 'Keep a Transit Point''s credential under its destination''s base path'
      description: >-
        A Transit Point request that carries the Transit Point's Target authentication
        credential is refused with 502, and not sent, when its path would leave the
        destination's base path after unreserved percent-encodings are decoded and dot segments
        removed. This applies to http(s) and fabric:// destinations. Upgrade note: Transit Point
        requests whose path climbs out of the destination's base path now get 502 instead of
        being forwarded with the credential.
  breaking:
    - timestamp: '2026-11-02T11:45:35Z'
      title: Refuse retyping a credential provider or deleting a secret that is in use
      description: >-
        Changing a credential provider's type to one that needs a user's consent while a surface
        uses it for Target authentication is refused with 409; a surface save that overlaps the
        type change is checked again under the same lock, so one of the two is refused. Deleting a secret that a surface,
        credential provider, A2A proxy or STS client uses is refused with 409 unless the request
        adds force=true; a save of one of those records that overlaps the delete and names the
        secret is either refused or seen by the delete, which then answers 409. The 409 body names the referencing records the caller may view (by
        tenant, resource scope and view permission) and counts the rest. Deleting a provider in
        use keeps its existing provider_in_use answer. Upgrade note: remove the references first,
        or delete a secret with force=true.
    - timestamp: '2026-11-05T13:58:34Z'
      title: Refuse and stop sending stored Target credentials that break a header rule
      description: >-
        A surface save no longer keeps a stored Target or Transit Point Target authentication
        that breaks a header rule; only target_https and target_source_auth breaches the stored
        surface already had are kept. On every request the gateway checks the same header rules
        before it reads a secret or requests a token, on the direct path, a proxy:// MCP Target,
        Fabric send and receive, a Transit Point and the agent card fetch: a breaking credential
        is never sent, fallback reject answers 502 Target authentication failed, passthrough
        forwards the request without it, and either way a target_auth_failed record is written.
        The agent card preview reports it as invalid_header. The startup and reload credential
        policy report lists such surfaces under rule target_auth_header. Upgrade note: a stored
        Target authentication with an invalid or reserved header name (such as X-Transit-Token or
        Host), a header another credential on the leg sends, or a header format without exactly
        one {value} or with CR, LF or NUL is refused on its next save and no longer sent; check
        the startup report for target_auth_header and fix the header_name or header_format.
