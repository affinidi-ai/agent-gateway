branch: fix/redact-secrets-in-logs
changes:
  added: []
  changed:
    - timestamp: '2026-10-27T00:00:00.000Z'
      title: Turn log redaction on by default for every configuration source
      description: >-
        logging.redaction in gateway.json now applies a built-in rule set for credentials, private
        keys, personal access tokens and email addresses unless it sets enabled to false, and rules
        written by the operator replace the built-in set. It is read from gateway.json for every
        configuration source, including DynamoDB, where it was never loaded. Span and log
        attributes named like a credential, such as authorization, cookie, token or session_id,
        become <redacted>, and the built-in rules also match JSON-quoted values
        such as "authorization": "Bearer ...". With the built-in rules the access log's mcp_sid field
        is masked in full. See docs/CONFIGURATION_REFERENCE.md.
    - timestamp: '2026-10-27T00:00:00.000Z'
      title: Name the field and rule, not the value, in extension validation errors
      description: >-
        Identity extension, rules engine and schema validation errors, which are returned to callers,
        logged and shown on the dashboard, no longer quote the rejected value or the payload. They
        name the field path, the rule and its configured constraint, and the JSON type for a type
        mismatch.
  fixed:
    - timestamp: '2026-10-27T00:00:00.000Z'
      title: Store DID Auth sessions apart from dashboard sessions
      description: >-
        DID Auth sessions are now kept in the didauth subdirectory of storage_paths.sessions, and
        each start moves DID Auth session files left in the sessions directory there. Both session
        stores used to read the same directory, so every start logged an error for each file of the
        other kind, naming the session token in the file path. See docs/SOURCE_AUTH.md.
    - timestamp: '2026-10-27T00:00:00.000Z'
      title: Send the service resource with OTLP logs and flush them on shutdown and reload
      description: >-
        Log records exported over OTLP now carry service.name, version and environment, and pending
        records are flushed when the gateway stops or the OpenTelemetry settings are saved.
  removed:
    - timestamp: '2026-10-27T00:00:00.000Z'
      title: Remove the DEBUG and CONFIG-LOAD lines printed at startup
      description: >-
        Startup no longer prints DEBUG, [CONFIG-LOAD] and [V8] lines to standard output and standard
        error, which bypassed log levels and redaction.
  security:
    - timestamp: '2026-10-27T00:00:00.000Z'
      title: ⭐ Stop logging the startup configuration and the secrets it holds
      description: >-
        On every start the gateway logged its whole bootstrap and gateway configuration at info
        level, including backup encryption keys, MPP and Stripe secret keys and x402 facilitator
        private keys whenever they were configured as values instead of env:// references.
        Startup now logs one summary line (configuration source, server and auth mode, secrets
        backend, redaction state and surface counts), and these settings print as <redacted>
        wherever the configuration is formatted. Rotate every secret that was configured as a value,
        because logs from earlier versions contain it.
    - timestamp: '2026-10-27T00:00:00.000Z'
      title: ⭐ Log session tokens and DID Auth session ids as an 8-character prefix
      description: >-
        Dashboard session tokens and DID Auth session ids were written in full by storage log lines
        and errors on every save, delete and start, when a DID Auth session was issued, when a
        session delete failed, and by the local encryption trace, and a request with a personal
        access token logged part of the token. A session token now appears only as its first 8
        characters, access tokens are no longer looked up as dashboard sessions, storage parse errors
        give the error kind and position instead of the record content, and the encryption check,
        encryption migration and backups name only the directory of a file they cannot read. If logs
        from earlier versions were kept or shared, end all dashboard and DID Auth sessions after
        upgrading.
    - timestamp: '2026-10-27T00:00:00.000Z'
      title: Redact query values, URLs and MCP session ids in logs and traces
      description: >-
        The access log and the http.request span's http.uri attribute held full query strings,
        including OAuth codes and tokens sent as query parameters, and the http.url span attribute
        and the forwarding, endpoint, mirror and facilitator logs held full Target URLs, including
        credentials and query keys. Query values now become <redacted> with parameter names kept,
        URLs lose credentials and query values, transport errors are logged without the URL, RPC
        endpoints are logged by scheme, host and port only, and MCP session ids appear only as their
        first 8 characters. Rotate any provider key embedded in an RPC, Target or mirror URL, and
        purge or truncate log files and OTLP trace data kept from earlier versions.
    - timestamp: '2026-10-27T00:00:00.000Z'
      title: Stop returning Target URLs and transport errors in gateway error responses
      description: >-
        502 and 503 responses for an unreachable Target, a failed agent card fetch or a failed
        synchronous Fabric mirror included the configured Target or mirror URL and the HTTP client
        error text, so any caller could read endpoint URLs and any keys in them, and a gateway that
        failed to forward a Fabric request sent its Target URL and error details back to the
        calling gateway, which returned them to its caller. A failed MCP Proxy tool call returned the
        REST request URL, including query keys, the argument values and the backend's reply to the
        MCP client, and wrote the same text to the log and the dashboard. These responses now name
        only the kind of failure, such as the HTTP status or network error, and the detail stays in
        the server log without the URL.
    - timestamp: '2026-10-27T00:00:00.000Z'
      title: Stop logging policy input, request headers and request bodies
      description: >-
        Every policy-checked request logged the whole policy input at info level ([OPA-INPUT]),
        including the caller's message, MCP tool arguments, JWT claims and forwarded headers. The
        /onboard/ endpoints, which need no sign-in, logged every request header and body and listed
        every live onboarding session when given an unknown id. The Legacy SSE fallback logged the
        MCP request after delegated credentials and the identity VP were added to it, and the
        upstream's reply, and MCP clients could write any notifications/message data to the gateway
        log at a level they chose. These lines now log ids, status codes, sizes and decisions only,
        REST tool failures are logged by kind, and onboarding sessions appear as an 8-character
        prefix, in the access log too. Revoke delegated credentials that may have been logged, and
        purge or truncate log files and OTLP log and trace data kept from earlier versions.
    - timestamp: '2026-10-27T00:00:00.000Z'
      title: Stop logging payment signatures, authorizations and mandates
      description: >-
        PAYMENT-SIGNATURE values, signed x402 authorizations and their signature components,
        facilitator requests and responses, AP2 mandates and KB-JWT transaction data were logged at
        info level, and the embedded facilitator recorded each whole verify and settle request on its
        trace span. These values are no longer logged, and the facilitator spans record the
        payment scheme and network instead of the request.
    - timestamp: '2026-10-27T00:00:00.000Z'
      title: Stop logging DIDComm message content and decrypted requests
      description: >-
        Basic message text, problem report comments and decrypted forward requests, which include
        the credentials the gateway adds for the Target, were logged. These lines now log the
        message type, id and size.
    - timestamp: '2026-10-27T00:00:00.000Z'
      title: Log user ids instead of usernames, email addresses and token subjects
      description: >-
        Sign-in, session, auth check, WebSocket, user management, Microsoft Graph avatar and source
        authentication log lines named the user by username, which in SAML mode is the email
        address, or by the token's subject, email integrations logged their recipients, and
        dashboard WebSocket frames were logged as text. They now log the user id, a count or a
        length. OAuth token endpoint errors are logged and reported by their error and
        error_description fields instead of the whole response body.
    - timestamp: '2026-10-27T00:00:00.000Z'
      title: Apply log redaction to OpenTelemetry log export
      description: >-
        Log records exported over OTLP never passed through the redaction rules, unlike the console,
        the log file and exported traces. Their bodies and attributes are now redacted, and the new
        opentelemetry.logs.targets setting in metrics.json limits which log targets are exported, by
        exact target or module path prefix; the default, "*", keeps exporting every target. If OTLP
        log or trace export was enabled, purge records from earlier versions in those backends.
    - timestamp: '2026-10-27T00:00:00.000Z'
      title: Stop the dashboard writing DIDs and policy settings to the browser console
      description: >-
        The identity policy dialog and other dashboard pages logged identity DIDs, policy settings,
        permission values, version details and WebSocket update summaries to the browser console.
        These console messages are removed.
  breaking:
    - timestamp: '2026-10-29T00:00:00.000Z'
      title: Ignore log redaction set in config.toml
      description: >-
        With the local configuration source and no logging block in gateway.json, the gateway used
        to apply a [logging.redaction] table from config.toml. That table is now ignored, because
        earlier bootstrap generation wrote it with enabled = false, and the built-in rules apply
        instead; startup logs a warning when the table is present. To keep custom rules, move them
        to rules in gateway.json logging.redaction before upgrading. Rules set there replace the
        built-in rules, so also copy any built-in rules you still want from
        config/examples/gateway.example.json. See docs/CONFIGURATION_REFERENCE.md.
