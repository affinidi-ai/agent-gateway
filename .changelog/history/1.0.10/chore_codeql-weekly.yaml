    - timestamp: '2026-11-13T00:00:00Z'
      title: Scan main with CodeQL every week
      description: >-
        CodeQL scans Rust, JavaScript/TypeScript, Python and GitHub Actions
        workflows. It now runs once a week (Mondays 02:00 UTC) against main and can be
        started on demand from the Actions tab. It does not run on pull requests
        or pushes, so the slow Rust analysis adds no time to PR CI.
        Repo-level CodeQL default setup stays disabled.
