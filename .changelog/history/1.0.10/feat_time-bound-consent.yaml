branch: feat/time-bound-consent
changes:
  added:
    - timestamp: '2026-11-12T12:00:00Z'
      title: ⭐ End a delegated consent at a configurable time limit
      description: >-
        A person's consent to a credential provider can now have an end. `max_consent_age_secs`
        on an `oauth2_authorization_code` credential provider limits every consent given to it,
        the same field on a binding (`outbound_credentials[]`, a Transit Point's
        `transit_credentials`) limits the consents used through that binding, and
        `[credential_policy]` in config.toml takes `default_max_consent_age_secs`, for providers
        that set none, and `max_consent_age_ceiling_secs`, which no limit reaches past. Each is
        from 60 seconds to 365 days. The end is fixed when the person consents and stored with
        the credential, so a shortened limit also ends older consents and a lengthened one never
        extends a consent already given. From its end a credential is never injected and never
        refreshed, even when the vendor would still refresh it: the gateway removes it, records
        `consent_expired`, which is not a revocation, and answers the existing `consent_required`
        or `connect_required` with the reason, so the person is asked again. A
        `subscriptions/listen` stream opened under a consent ends no later than that consent. A
        binding with a
        shorter limit than the consent it finds asks again with `consent_too_old` and leaves the
        credential for other bindings. The consent start page, the elicitation message and the
        `consent_required` entries say how long the new consent lasts. `consent_expired` is also
        recorded wherever `consent_granted` is selected, so an audit selection or an integration
        event set made before this release receives it without being changed. Without a limit
        nothing changes, and revocation works as before.
    - timestamp: '2026-11-13T09:00:00Z'
      title: Remove ended consents hourly and show when a consent ends
      description: >-
        A consent past its time limit is now removed even when no request needs it again. Once
        an hour, while the node is active, the gateway deletes every ended agent-keyed token and
        every ended grant by binding, revokes those grants at the vendor in the background, and
        records each as
        `consent_expired` with `source:sweep`, so a refresh token does not stay in the vault
        long after its consent ended. `GET /api/v1/delegation-vault`, `GET
        /api/v1/delegation-vault/{id}` and the grants report now show `consent_expires_at`, the
        end as the limits set now make it, and a `DelegationCredential` issued for a consent
        under a time limit carries it as `validUntil`.
    - timestamp: '2026-11-13T12:00:00Z'
      title: Set a provider's consent time limit in the dashboard
      description: >-
        The credential provider editor has a Consent time limit field on Authorization Code
        providers, external consent ones included: a number and a unit (minutes, hours or days),
        from one minute to 365 days. An empty field sets no limit on the provider, and the
        gateway's own default and ceiling still apply. A limit outside that range is reported
        under the field, which is marked invalid and takes the focus. On such a provider the
        help under "Enable automatic token refresh" says tokens are refreshed for as long as the
        consent lasts and that the person approves again when it ends. A stored limit that is
        not a whole number of minutes, which only the API can set, loads in seconds and saves
        unchanged. The Surface Builder now shows a binding's own limit, which is set through the
        API, and keeps it when the surface is saved, so a dashboard save never removes it.
    - timestamp: '2026-11-16T15:30:00Z'
      title: Warn how many active consents a shorter consent time limit ends
      description: >-
        When an admin shortens a stored provider's consent time limit, sets one where none was,
        or removes a stored one, since the gateway's default may then be the shorter, the provider
        form now asks the gateway how many active consents saving would end and, when that is at
        least one, says so under the field, naming the provider, for example "Saving ends 2
        active GitHub consents now". It asks once the field has stopped changing, and shows
        nothing when no consent ends or the gateway cannot say.
    - timestamp: '2026-11-16T17:30:00Z'
      title: Count the consents a shorter consent time limit would end before saving it
      description: >-
        GET /api/v1/credential-providers/{id}/consent-impact?max_consent_age_secs=<seconds>
        answers {"active_consents", "ending_consents"}: the provider's consents that have not
        ended, which are its agent-keyed tokens and the grants by binding their surface still
        serves, and how many of them saving the limit asked about would end. A consent given on
        the 2026-07-28 MCP path is bound to the provider's record and ends with any save of it,
        so it always counts as ending. 0 asks about a provider with no limit of its own. It
        changes nothing, needs credential_providers.edit, and is refused as the save would be.
        The provider form's warning reads it.
    - timestamp: '2026-11-13T16:00:00Z'
      title: Add a Delegated Access tab that lists active delegated access
      description: >-
        The Credentials page has a Delegated Access tab beside Credential Tokens. It lists only
        the access a person gave that an agent can still use: the user, the system by its
        provider's name, the agent, the scopes, whether it ends within a day, when it ends with
        the limit that applies, such as "6-hour limit", and when it was last used. A "Revoke"
        text button turns on its first click into a danger button that names what it ends, such
        as "Revoke Salesforce access?", with a Cancel beside it; the second click revokes, in
        place and with no dialog. Service tokens, ended consents and tokens that can no longer
        be refreshed are left out, and a History button opens the Audit Log on the records of
        access that ended or was revoked. The tab shows the same read of the vault as
        Credential Tokens, so a revoke or a limit on one shows on the other.
    - timestamp: '2026-11-13T20:00:00Z'
      title: Deactivate a credential provider instead of deleting it
      description: >-
        A credential provider a person consents to can be deactivated with `POST
        /api/v1/credential-providers/{id}/deactivate` and activated again with `.../activate`. A
        deactivated provider takes no new consent: a caller without a stored credential is refused
        instead of being asked, earlier consent links and consents under way are refused with
        `provider_deactivated`, and the connect API answers `409 provider_deactivated`. Nothing
        else changes: the provider's record stays, and the credentials people already consented
        to are used and refreshed until they end or are revoked. The dashboard offers Deactivate
        and Activate, to users with credential_providers.edit, in place of Delete for these
        providers and keeps a deactivated one in the list, whose new Status column says
        "Active", or "Deactivated" with "No new consent" under it; Delegated Access marks the
        access of a deactivated provider "No new consent" as soon as it is deactivated. Other
        provider types, and `DELETE` through the API, are unchanged.
    - timestamp: '2026-11-17T14:30:00Z'
      title: ⭐ Limit one stored consent with PUT /delegation-vault/{id}/consent-limit
      description: >-
        An operator can bring the end of one stored consent forward without changing the
        provider's limit: PUT /api/v1/delegation-vault/{id}/consent-limit with
        max_consent_age_secs makes that consent end that long after it was given. A limit only
        shortens: one that would extend the consent, or that the consent is already older than,
        is refused with 400 and a code (limit_not_sooner, consent_older_than_limit), as is a
        value outside one minute to 365 days (invalid_limit) and an entry nobody consented to
        (not_a_consent). A consent that changed while it was being limited, because the person
        consented again or another limit got there first, is left as it is and answered with
        409 consent_changed. The credential is used and refreshed until the new end and then
        removed as any ended consent. The route needs delegation_vault.delete and an
        appliance-wide caller, as a revoke does, and is audited as the new consent_limited
        event, which names who set the limit, whose consent it is, its new end and the end it
        had. consent_limited is listed by GET /v1/settings/audit-events and the integration
        event catalog, and is also recorded wherever token_revoked is selected, so an audit
        selection or an integration event set made before this release receives it without
        being changed.
    - timestamp: '2026-11-17T14:40:00Z'
      title: Add a Limit duration button to each consent on Credential Tokens
      description: >-
        Each consent an agent can still act under has a Limit duration button above Revoke on
        the Credentials page's Credential Tokens tab. It opens a panel in place under the row,
        with no dialog, to set how long after its consent that one delegation may be used. The
        panel says when the consent would end before anything is saved, and offers Save only
        for a limit that brings the end forward. It takes the keyboard focus when it opens and
        gives it back to the button when it closes, and a refusal is shown under the field in
        the gateway's words. The button is shown to users with delegation_vault.delete. The
        Audit Log offers the new Consent Limited category and says in each record when the
        consent now ends and when it ended before.
  changed:
    - timestamp: '2026-11-13T15:00:00Z'
      title: Show when each consent ends on the Credential Tokens tab
      description: >-
        Each entry of the Credentials page's Credential Tokens tab shows when its consent ends
        and how long is left, or that it has no time limit, and is marked Ending soon within a
        day of its end and Consent ended after it. The expanded row links to that user's
        delegation records in the Audit Log.
    - timestamp: '2026-11-16T15:00:00Z'
      title: Confirm a revoke on the Credential Tokens tab in place, by name
      description: >-
        Revoking one delegation now uses a "Revoke" text button instead of a bin icon: its first
        click turns it into a danger button that names what it ends, such as "Revoke GitHub
        access?", with a Cancel beside it, and the second click revokes. Revoking every
        delegation of a user is confirmed the same way, with a danger button that says how many
        delegations it ends, such as "Revoke all 2 for this user?", instead of a browser dialog.
    - timestamp: '2026-11-13T18:00:00Z'
      title: Read the credential delegation audit in the Audit Log
      description: >-
        The credential delegation records are now read on the Audit page, with the rest of the
        audit, instead of in a separate list on the Credentials page. The Audit Log's category
        filter offers the audited delegation events (a consent granted, expired or limited, a
        token revoked, a user's tokens revoked) and no longer offers Token Injected, which the
        gateway now only logs; records of such events written before keep their labels. It
        describes an expired consent apart from a revocation, and shows a caller's Principal
        beside Subject. The Credentials page opens it from History on Delegated Access and from
        a token's expanded row on Credential Tokens.
    - timestamp: '2026-11-13T17:00:00Z'
      title: Name whose access a vault revoke ended in its audit record
      description: >-
        The `token_revoked` audit record of `DELETE /api/v1/delegation-vault/{id}` now names the
        agent, the user identity hash, the credential provider, by id and by name, and the scopes
        of the entry that was revoked, beside who revoked it. Before, it carried only the entry's
        id, so a search of
        the delegation audit for a user did not find the revokes of that user's access.
    - timestamp: '2026-11-14T10:00:00Z'
      title: Name a consent's end in its consent_granted audit record
      description: >-
        The `consent_granted` audit record of a consent given under a time limit now says when
        the consent ends: its `detail` holds `consent_expires_at:<time>`, after
        `grant_by_binding:external_consent,` for a grant by binding. Before, the audit named the
        end only in `consent_expired`, once the consent had ended. The Audit Log says it in the
        record's description: "It ends <date>." A consent under no limit is recorded as before.
    - timestamp: '2026-11-16T17:10:00Z'
      title: Drop the names of now-logged events from stored audit selections
      description: >-
        A VP Audit selection (audit_events) or an integration event set saved before may still
        name a delegation event the gateway now only writes to its log. The gateway drops such a
        name when it loads its settings and from any audit_events or event set it is asked to
        save, where any other unknown name is still refused with 400, so an upgraded gateway keeps
        saving its settings, and logs a warning that names the events it dropped and the
        credential_delegation log target, where they are written now. An event set left with no
        other event is refused as empty, and the startup check of stored definitions reports it
        until it is changed or deleted.
    - timestamp: '2026-11-16T15:50:00Z'
      title: Show an agent by its whole did:web host name on the credential tabs
      description: >-
        Credential Tokens cut an agent's DID in the middle, which hid the agent's name. On it and
        on Delegated Access a did:web agent now shows its whole web address, such as
        "pr-reviewer.example.com", without "did:web:", wrapping after a dot or a slash when
        long; other DID methods stay shortened, and the full DID is in the tooltip. A did:web
        DID with a percent escape other than its port's, or with an invisible character, stays
        shortened too, so a DID cannot show a name it does not spell. The page search finds a
        delegation by the name shown.
    - timestamp: '2026-11-16T16:00:00Z'
      title: Say when an access token renews by itself on Credential Tokens
      description: >-
        On Credential Tokens the "Expires" column is now "Access Token" and says "Renews
        automatically" under the date while the provider refreshes tokens and the consent has
        not ended, so it no longer reads as the end of the access.
    - timestamp: '2026-11-17T13:30:00Z'
      title: Show the title alone in the Credential Tokens header
      description: >-
        The header of the Credential Tokens tab showed the number of tokens and counts of
        active, refreshable and expired ones beside its title. It now shows the title alone;
        each row still shows its own status.
    - timestamp: '2026-11-16T16:30:00Z'
      title: Name the provider on Credential Tokens by its name, not its id
      description: >-
        The Provider column of Credential Tokens showed the provider's id, such as "github". It
        now shows the name, such as "GitHub", as Delegated Access does, falling back to the id
        when the provider is unknown, and the search finds a token by that name too.
    - timestamp: '2026-11-17T21:30:00Z'
      title: Name the page links of the Credentials tabs and the Secrets page
      description: >-
        The page links under Credential Tokens, Delegated Access and the Secrets page's lists
        were read out as bare angle quotes, stayed focusable while they could do nothing, and
        did not say which page is shown. They are now one shared control: Previous page and
        Next page are named and disabled at the ends, and the page shown is marked as current.
  fixed:
    - timestamp: '2026-11-17T21:35:00Z'
      title: Wrap a long scope on Credential Tokens instead of scrolling the table
      description: >-
        A scope that is a long URL, such as a Google API scope, made the Credential Tokens
        table wider than a laptop screen. Scope badges there and on Delegated Access now wrap.
    - timestamp: '2026-11-17T18:00:00Z'
      title: Show a failed read of the delegation vault as an error, not an empty list
      description: >-
        When the gateway refused the list of delegations, or could not be reached, Credential
        Tokens said "No delegation tokens yet", as if nobody had delegated anything. It and
        Delegated Access now show why the read failed, with a Retry, and say there are none only
        when the gateway lists none.
    - timestamp: '2026-11-17T18:10:00Z'
      title: Show the page before when the last delegation of a page is revoked
      description: >-
        Revoking the only delegation on the last page of Credential Tokens, or all of a user's
        there, left a table with headers, no rows and no page links. The tab now shows the last
        page that still has entries.
    - timestamp: '2026-11-17T18:15:00Z'
      title: Offer Revoke on Credential Tokens by the permission the gateway checks
      description: >-
        Credential Tokens showed Revoke to users with settings.edit, while the gateway asks for
        delegation_vault.delete, so a role with one and not the other saw a button that was
        refused or no button for something it may do. Credential Tokens and Delegated Access
        show Revoke, Revoke all and Limit duration with delegation_vault.delete, and no Actions
        column without it.
    - timestamp: '2026-11-17T18:20:00Z'
      title: Say why a revoke on Credential Tokens was refused
      description: >-
        A refused revoke toasted "Failed to revoke: Revoke failed:" and the HTTP status text,
        which is empty on some connections, and dropped what the gateway answered. The toast
        now reads "Not revoked:" with the gateway's own words, its status where it gave none,
        or that the gateway could not be reached. When the gateway answers that the delegation
        is gone or has changed (404, 409), the page also reads the vault again, so an entry that
        was already removed leaves the list.
    - timestamp: '2026-11-17T18:25:00Z'
      title: Open a token's details and cancel a confirm from the keyboard
      description: >-
        A row of Credential Tokens opened its details only on a mouse click, so the keyboard
        could not reach a token's details; the row now has a button for it. Escape now cancels
        a two-step confirm, such as Revoke, Revoke all,
        Deactivate or a delete, which only a click elsewhere did before.
  removed:
    - timestamp: '2026-11-17T13:20:00Z'
      title: Remove the Credential Delegation Audit tab from the Credentials page
      description: >-
        The Credentials page's tab row no longer has a Credential Delegation Audit tab, and
        nothing takes its place there. The delegation records are read in the Audit Log: open
        it from the menu, from History on Delegated Access, or from a token's expanded row on
        Credential Tokens. A stored /credentials?tab=credential-audit address now opens the
        page's first tab.
  security:
    - timestamp: '2026-11-17T18:30:00Z'
      title: Show gateway log lines on the dashboard to appliance-wide callers only
      description: >-
        GET /v1/dashboard/delta and GET /v1/dashboard/stats returned the gateway's log lines to
        any caller with logs.view, including an access token scoped to one tenant, to a
        resource pattern or by required headers alone. The log holds every tenant's lines, and
        now the per-call delegation events too, so such a token is answered without log lines,
        as GET /v1/logs/download already refused it. Sessions and appliance-wide access tokens
        are unaffected.
  breaking:
    - timestamp: '2026-11-16T17:00:00Z'
      title: ⭐ Write per-call delegation events to the gateway log, not the audit
      description: >-
        Ten delegation events are no longer audit events: token_injected, token_refreshed,
        refresh_failed, consent_required, token_not_found, elicitation_sent, elicitation_accepted,
        elicitation_declined, elicitation_cancelled and elicitation_timed_out. The VP Audit Log
        and integrations are offered none of them, and GET /v1/settings/audit-events and the
        integration event catalog no longer list them. Each is now one INFO line of the gateway
        log, "Delegation event event=<name> ...", naming the agent, the caller's identity hash,
        how the caller authenticated, the paired gateway that sent the request when one did,
        the provider, the surface, the token or grant, its scopes and the MCP tool, and no
        credential or personal detail: the Target URL is logged without its user name and
        password and with every query value redacted, and what a caller, a paired gateway or a
        vendor chooses (the tool name, the scopes, the sending gateway, the agent's DID, the
        detail) as quoted tokens that cannot start a log line of their own. What was decided
        about delegated access stays audited: consent_granted, consent_expired, consent_limited,
        token_revoked, user_tokens_revoked, delegation_failed, connector_call and
        mcp_proxy_pin_changed. Upgrade note: the lines are written at the default log level,
        INFO, to stderr and, when a log directory is set, to agent-gateway.log, which the
        gateway neither rotates nor removes by age. How long they are kept is therefore the
        deployment's log retention, and a gateway set to log less than INFO writes none. An
        integration or SIEM that received these events receives them no longer; ship the
        gateway log, or export the credential_delegation log target over OTLP, to keep them.
        An access token scoped to one tenant, which read these records for its own tenant's
        providers on the audit routes, reads them no longer either: the gateway log is given to
        appliance-wide callers only, so an operator who has to hand a tenant its events exports
        the log target and filters it by provider_id.
        Records of these events written before stay in the VP Audit Log and stay readable.
