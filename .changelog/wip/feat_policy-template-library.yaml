branch: feat/policy-template-library
changes:
  added:
    - timestamp: '2026-11-18T12:38:12Z'
      title: Start and build policies from templates in the policy editor
      description: >-
        Creating a policy starts from a gallery of templates for common policies: deny by
        default, require an authenticated caller, allow by JWT claim or role, allow by JWT
        issuer and audience, restrict MCP tools by role, require Trust Registry recognition,
        require a verified credential subject, allowlist outbound destinations, allow during
        business hours, a monitor-only baseline, all or at least N trust checks pass, and HTTP
        method, path, surface and subject allowlists, plus MCP tool policies for tool bindings
        on the MCP Proxy hop. Templates follow the Apply Policies guides and link to their own
        docs section. The gallery offers templates of either type; choosing one shows its
        settings, its Rego, how it decides on sample inputs, and its docs link in place, and Use this
        template fills Name, Description, Type and Rego with settings that are checked first;
        when the policy already has rules or hand edits, Use asks in place before it replaces
        them. Every template is labelled Whole policy or Adds rules. Add rules from a template
        lists only templates that add rules, says how many whole policies and templates for the
        other Type it leaves out, and appends a template's rules to a new or saved policy, so
        several can be combined, and on a saved policy checks the template's examples with the
        existing dry-run; a whole policy is used from Start from only.
        A Rules | Rego toggle shows the policy, opening on Rules. The Rules view lists the
        policy's rules grouped by the template they came from, with an empty state that offers
        templates or Rego, labelling only deny_reason as a Deny reason, removes a template's rules or a
        single rule, and switches an allow-all policy to deny by default; while the default is
        ALLOW each group with allow rules is marked as having no effect, and on a new policy a
        group written for the other Type is marked and blocks Create until it is removed. Remove is refused, with
        the reason shown under the rule or template, while the allow rule still reads that rule,
        directly or through other rules; a read from deny_reason alone doesn't count, and an
        identical copy left by the same template added twice can go, and the reason names the
        rule that reads it. Deny by default, Require authenticated caller and Allow by JWT claim
        or role are marked Recommended. Once rules are added, Start from still names the template
        the policy started from and counts the templates added, and says Custom Rego only after
        a hand edit. The Add to policy preview says allow rules combine with OR. On a saved
        policy the template examples say which rows match, explain a row that differs, and load
        its input into Test (dry-run), with Undo. A default decision shows as a grey Default
        DENY with a shield or an amber Default ALLOW with a warning icon. Save as template keeps
        a policy as an organization
        template for the current browser tab, marked This tab only, and says to save your
        changes first while it is disabled. Default templates ship with the dashboard; no
        gateway API changes.
  changed:
    - timestamp: '2026-11-18T22:00:00Z'
      title: Show the policy editor read-only to users who can't edit policies
      description: >-
        Without the policies.edit permission the policy editor shows the policy read-only: the
        Rego and Details can't be changed, there is no Create or Save button, Ctrl+S does
        nothing, a package mismatch offers no Fix it, there is no Test (dry-run) panel, and a
        note says the policy can be viewed but not changed. Saving and the dry-run already
        needed that permission, so the page no longer offers actions the gateway refuses.
    - timestamp: '2026-11-18T20:00:00Z'
      title: Start new policies as deny by default
      description: >-
        A new policy definition starts as default allow := false, the deny-by-default practice
        the policy docs recommend, instead of allowing all traffic. Deny by default is
        preselected in the Start from gallery, and Allow all (blank) is a card there.
    - timestamp: '2026-11-18T18:00:00Z'
      title: Redesign the policy editor into Details and Policy sections
      description: >-
        The policy create and edit pages group Name, Description, Type and an Enabled switch
        into one Details section, keep the templates in a column beside the editor so opening
        one never resizes the form, show a saved policy's ID and SHA on one line with copy
        buttons, and show the Rego with line numbers and a banner when it doesn't compile.
  fixed:
    - timestamp: '2026-11-18T18:00:00Z'
      title: Describe the policy input the gateway sends in the policy editor
      description: >-
        The policy editor's Rego reference and the dry-run sample input used input.jwt, which
        gateway and surface policies never get, so policies copied from them never matched.
        They now use input.source_auth, list the other caller fields, and describe the separate
        input of policies bound to MCP tools, which does carry input.jwt.
  removed: []
  security: []
  breaking: []
