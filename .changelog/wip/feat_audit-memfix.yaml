branch: feat/audit-memfix
changes:
  added: []
  changed: []
  fixed:
    - timestamp: '2026-11-05T14:29:50Z'
      title: ⭐ Keep the Audit page from running the gateway out of memory
      description: >-
        Opening the Audit page read and parsed the whole VP Audit Log on every request, so the
        gateway could be killed for using too much memory once the log had grown. A read now
        takes only the newest 8 MiB of the log, back through its rotated files, on a blocking
        thread and one read at a time, and the response says when the history held more than
        that window. The log itself is now rotated at 8 MiB with the 8 most recent files kept,
        so it no longer grows without limit.
  removed: []
  security: []
  breaking: []
