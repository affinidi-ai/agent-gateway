branch: feat/did-lifecycle-webhook
changes:
  added:
    - timestamp: '2026-10-20T00:00:00.000Z'
      title: Notify a receiver of Connection Point events through an event hook
      description: When AG_EVENT_HOOK_URL is set, the gateway POSTs JSON events to that endpoint for each Connection Point - connection_point.creation_started (DID minted, before the first mediator contact), created, creation_failed (also when the request is cancelled), connected (first mediator connection of each listener start) and deleted (when a record is deleted through the store, which covers the API delete and expiry cleanup; deleting a gateway does not delete its User Connection Points, so nothing is sent for them). Each event is delivered from its own background task and never delays or fails the request; it is retried like an integration publish (five retries after about 1, 2, 4, 8 and 16 seconds, including on 401 and 403) and then dropped, and a permanent 4xx or a 3xx redirect (never followed) is logged and dropped. Lifecycle events and connected use separate delivery pools so a restart burst of connected cannot starve them. Nothing is persisted, so events not yet delivered are lost on restart. AG_EVENT_HOOK_SECRET (at least 32 characters, plain or an env://, file:// or aws_secrets:// reference) signs calls with X-Webhook-Timestamp and X-Webhook-Signature-256 when it is set, and AG_EVENT_HOOK_TIMEOUT_MS (default 5000) bounds one attempt. The hook URL must be https with AG_EVENT_HOOK_SECRET set; http is accepted only for a loopback host (localhost, 127.0.0.0/8 or ::1), and only a loopback receiver may go without a secret, otherwise the hook is disabled with an error log. Only Connection Points created through the management API are announced. creation_started and creation_failed exist only once the DID is minted, and creation_failed carries no reason. connected fires on a listener's first connection after each start, and every restart re-announces live Connection Points. Delivery order across events is not guaranteed, so receivers must order by the clock-seeded sequence (best-effort across restarts, since a backwards clock step can lower it) and be idempotent. sequence is for ordering only, because the clock reseed after a restart can skip numbers, so receivers must not treat gaps as errors. connected is built from the stored record at the time it is sent and is skipped when the record was deleted meanwhile. A stored Connection Point now records the mediator_did it was created on. See docs/INTEGRATIONS.md.
  changed:
    - timestamp: '2026-10-20T00:00:00.000Z'
      title: Share webhook signing between integrations and the event hook
      description: Real webhook integration deliveries, the dashboard's Test notifier action and the event hook now compute the X-Webhook-Signature-256 value through one shared function. Signatures are unchanged.
  fixed:
    - timestamp: '2026-10-20T00:00:00.000Z'
      title: Stop a deleted Connection Point from reappearing after deletion
      description: A listener shutting down while its Connection Point was being deleted could write its runtime status back and recreate the record, which then counted against the appliance limit and was reloaded at restart. The listener's status write now happens only while the record still exists, and the store's create, update and delete calls for one Connection Point id are serialised against each other.
  removed: []
  security: []
  breaking: []
