branch: feat/jwt-client-auth
changes:
  added:
    - timestamp: '2026-11-09T11:22:00Z'
      title: Let a JWT Bearer provider identify its OAuth client to the token endpoint
      description: >-
        A JWT Bearer credential provider can set client_authentication to none (a public client),
        client_secret_basic or client_secret_post, and its grant then carries the client ID, or the
        client ID and secret, by HTTP Basic or in the form body, and its scopes in the scope form
        field, which Hydra grants scopes from. Servers such as Ory Hydra refuse a grant that names
        no client. A provider that sets no client authentication sends the same client-less grant as
        before, whatever client references it stores, so stored providers behave as they did. Create
        and update refuse a method without the client references it sends and a client
        authentication on any other provider type. An empty client ID reference clears it on a JWT
        Bearer provider, so the dashboard's Not sent leaves no reference that blocks deleting its
        secret. The provider list shows each provider's client authentication, and the dashboard's
        credential provider editor offers the choice.
  changed: []
  fixed: []
  removed: []
  security:
    - timestamp: '2026-11-09T17:00:00Z'
      title: Refuse a new client secret or a retype on a stored http token endpoint
      description: >-
        In warn mode a stored credential provider keeps a plain http token endpoint that
        insecure_token_endpoints does not list. An update that sets a JWT Bearer provider's
        client_authentication to client_secret_basic or client_secret_post, when it sent no client
        secret before, or that changes the provider's type to an OAuth type, is now refused with
        "token_endpoint must be an https URL", so neither a new client authentication nor a retype
        starts sending a client secret in clear text. Setting none, clearing the setting, or
        switching between the two secret methods is still saved, and listing the endpoint allows
        it.
  breaking: []
