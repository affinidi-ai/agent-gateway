branch: fix/security-findings
changes:
  added: []
  changed: []
  fixed:
    - timestamp: '2026-10-09T00:00:05.000Z'
      title: Refuse secret updates and deletes when the secret cannot be loaded
      description: Updating or deleting a secret now returns 404 when it does not exist and 500 when it cannot be read, before any write. Previously the ownership check was skipped when the lookup failed, and a missing secret returned 400.
  removed: []
  security:
    - timestamp: '2026-10-09T00:00:00.000Z'
      title: ⭐ Withhold target credentials from callers whose source auth failed
      description: A caller whose source authentication failed is now forwarded without the stored target credential on `proxy://` MCP Targets, Fabric send, Fabric receive (direct and MCP proxy Targets) and the `a2a-proxy://` Direct Line secret, as the direct inbound path already did. Previously these paths decided from the request path alone or assumed the caller was authenticated, so an anonymous caller on a surface without a denying policy reached the backend with the operator's credential. Agent-card fetches between gateways still carry the receiving gateway's credential.
    - timestamp: '2026-10-09T00:00:03.000Z'
      title: ⭐ Refuse tenant token writes to appliance-wide management records
      description: A tenant access token can still read records that belong to no tenant, but now gets 403 when it updates, deletes or otherwise changes them in JWT verification strategies, secrets, STS clients, mediators, credential providers, certificates, trust authorities, issuers, trust registries, surface templates and integrations (including triggering an appliance-wide integration), and on the appliance Gateway's Connection Points, which tenant tokens can therefore no longer create. Previously these write paths used the read rule, so a tenant could, for example, replace a global JWT strategy's keys. Tenant automations that edited untenanted records need an appliance-wide token, or an operator can assign the record with `PUT /v1/tenant-ownership/...`.
  breaking:
    - timestamp: '2026-10-09T00:00:01.000Z'
      title: Stop sending target credentials for failed callers over MCP proxy and Fabric
      description: Backends behind `proxy://` MCP, `a2a-proxy://` or Fabric surfaces with source authentication now receive requests from failed callers without the target credential, and will usually reject them. Two Fabric gateways that both require source authentication on the same header no longer reach the backend, because the sending gateway strips that header; require caller authentication on one side of the hop or use a different header on each side (see docs/POLICY.md).
    - timestamp: '2026-10-09T00:00:07.000Z'
      title: Refuse tenant token edits to records that belong to no tenant
      description: Tenant automations that updated, deleted or triggered appliance-wide records, including records created before tenant stamping, now get 403, and tenant tokens can no longer create Connection Points. Use an appliance-wide token, or have an operator assign the record with `PUT /v1/tenant-ownership/...`.
  internal: []
