branch: fix/strict-egress-jwks-and-token-endpoints
changes:
  added: []
  changed: []
  fixed: []
  removed: []
  security:
    - timestamp: '2026-11-05T15:12:32Z'
      title: Close SSRF and DNS rebinding gaps in JWKS fetches and provider token calls
      description: >-
        A JWT verification strategy's JWKS fetch allowed loopback hosts, credential provider token
        requests honoured an HTTP proxy that resolved the host again, and the credential provider
        validation probe sent its request through a client that resolved the host again after it
        was checked. JWKS fetches, token requests and both probes now go through a pinned client
        that refuses cloud metadata, loopback and unspecified addresses, connects only to the
        address it checked so a host cannot rebind to a refused one, and follows no redirects.
        Private networks stay allowed, so an identity provider inside the operator's network keeps
        working. The JWKS answer is read up to 256 KiB. The JWKS probe and the provider probe now
        answer fixed error messages instead of the upstream error, and log the detail.
  breaking:
    - timestamp: '2026-11-05T15:12:32Z'
      title: Refuse JWKS URIs resolving to loopback and send JWKS and token calls direct
      description: >-
        Saving a JWT verification strategy already refused a jwks_uri naming a loopback address or
        localhost. Creating or updating one whose host resolves to loopback, an unspecified address
        or cloud metadata now answers 400 too, and a stored one fails its JWKS fetches; credential
        provider token endpoints were already held to that rule. JWKS fetches
        and token requests also ignore HTTPS_PROXY, HTTP_PROXY and ALL_PROXY, since a proxy would
        resolve the host again, so a host that reaches the internet only through a proxy must allow
        direct egress to its identity providers; a startup warning names them.
    - timestamp: '2026-11-05T15:12:32Z'
      title: Require the JWT verification strategy edit permission for the JWKS URI probe
      description: >-
        POST /api/v1/jwt-verification-strategies/validate-jwks-uri needed only
        jwt_verification_strategies.view, which let a read-only user make the gateway fetch
        arbitrary URLs. It now needs jwt_verification_strategies.edit, the permission a save
        needs, and a personal access token needs that scope.
