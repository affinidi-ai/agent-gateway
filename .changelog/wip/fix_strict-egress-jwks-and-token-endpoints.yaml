branch: fix/strict-egress-jwks-and-token-endpoints
changes:
  added: []
  changed: []
  fixed: []
  removed: []
  security:
    - timestamp: '2026-11-05T15:12:32Z'
      title: Close SSRF and DNS rebinding gaps in JWKS fetches and provider token calls
      description: >-
        A JWT verification strategy's JWKS fetch allowed loopback and private-network hosts, and
        the credential provider validation probe sent its request through a client that resolved
        the host again after it was checked. Both now go through a pinned client under the Strict
        egress policy, which refuses cloud metadata, loopback, RFC 1918, link-local and IPv6
        unique-local addresses and connects only to the address it checked, so a host cannot
        rebind to an internal address. The JWKS answer is read up to 256 KiB. The JWKS probe and
        the provider probe now answer fixed error messages instead of the upstream error, and log
        the detail.
  breaking:
    - timestamp: '2026-11-05T15:12:32Z'
      title: Refuse JWKS and token endpoints that do not resolve to public addresses
      description: >-
        Creating or updating a JWT verification strategy whose jwks_uri, or a credential provider
        whose token_endpoint, resolves to a loopback, private-network, link-local or unique-local
        address now answers 400, and strategies and providers stored with such an address fail
        their JWKS fetches and token requests. An identity provider or token endpoint inside a
        private network must be reachable on a public address. These calls also ignore
        HTTPS_PROXY, HTTP_PROXY and ALL_PROXY, so a host that reaches the internet only through a
        proxy must allow direct egress to its identity providers; a startup warning names them.
    - timestamp: '2026-11-05T15:12:32Z'
      title: Require the JWT verification strategy edit permission for the JWKS URI probe
      description: >-
        POST /api/v1/jwt-verification-strategies/validate-jwks-uri needed only
        jwt_verification_strategies.view, which let a read-only user make the gateway fetch
        arbitrary URLs. It now needs jwt_verification_strategies.edit, the permission a save
        needs, and a personal access token needs that scope.
