  security:
    - timestamp: '2026-10-09T00:00:00.000Z'
      title: Stop logging forwarded header values on Fabric receive
      description: >-
        When a gateway forwarded a Fabric request to its Target, it logged every forwarded header
        with its value at info level, including a delegated access token in `Authorization` or in
        a custom credential header. It now logs only the names of forwarded headers, so no
        credential value reaches the logs whatever header carries it.
