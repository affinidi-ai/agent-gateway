---
branch: fix/fabric-credential-follow-ups
changes:
  added: []
  changed:
  - timestamp: '2026-10-12T01:00:00.000Z'
    title: Refuse JSON-RPC batches explicitly at MCP admission
    description: Access Points, Transit Points and Fabric receive already refused
      a legacy JSON-RPC batch sent as a POST, but only because MCP identity verification
      could not read a non-object body. They now refuse it at admission, before any
      tool-level control, still with 422. The detail changes from "Invalid MCP identity
      presentation" to "JSON-RPC batches are not supported".
  - timestamp: '2026-10-12T07:00:00.000Z'
    title: Document MCP admission refusals and where credential bindings apply
    description: The MCP metadata, tool gating and protocol references describe the
      single-object admission check, the 405 and 400 method rules and the fail-closed
      unreadable tool name. The credential delegation and Fabric guides say tool-scoped
      bindings never apply on Transit Points, that `all` bindings reach every Transit
      Point, and that Fabric receive applies tool-scoped bindings. The configuration
      reference gets its Related section heading back.
  - timestamp: '2026-10-12T03:00:00.000Z'
    title: Document the exposure-mode upgrade order and the 400 for non-Remote gateways
    description: The Fabric guide notes that `PUT /v1/gateways/{id}/exposed-surfaces`
      on a gateway that is not Remote returns 400. It also warns that every node sharing
      gateway storage, such as both nodes of an active/standby pair, must be upgraded
      before failing back to an earlier version, and that peers must not be paired
      or have their exposure changed until every node runs a version with exposure
      modes. An earlier version reads a Remote record with mode `none` and an empty
      list as every surface, and drops the mode when it saves the record.
  fixed:
  - timestamp: '2026-10-09T14:00:00.000Z'
    title: Apply tool-scoped credential bindings only to tools/call on Access Points
    description: An Access Point matched `required_for.tools` against `params.name`
      of any legacy MCP method, so a `prompts/get` whose name equalled a listed tool
      picked up the tool-scoped credential. Only a `tools/call` now names a called
      tool; the `input.mcp.tool_name` policy input is unchanged.
  - timestamp: '2026-10-12T06:00:00.000Z'
    title: Apply tool-scoped credential bindings on Fabric receive
    description: 'Fabric receive passed no tool name to credential delegation, so
      a binding with `required_for.tools` on the receiving surface never applied.
      It now matches `params.name` of a `tools/call`, read after admission has refused
      batches and ambiguous keys, because Fabric receive forwards only to its own
      Target. Upgrade note: such a binding now sends the delegated credential to that
      Target for the listed tools, or asks for consent when no credential is stored.'
  removed: []
  security:
  - timestamp: '2026-10-09T00:00:00.000Z'
    title: Stop logging forwarded header values and bodies on Fabric requests
    description: When a gateway forwarded a Fabric request to its Target, it logged
      every forwarded header with its value at info level, including a delegated access
      token in `Authorization` or in a custom credential header. The sending gateway
      did the same for the response headers it received back from its Fabric peer,
      such as `Set-Cookie` or `WWW-Authenticate`, and also logged the whole `ForwardResponse`,
      header values and body included, at debug level. The info logs now carry only
      header names, and the debug log only the response status, header names and body
      size, so no credential value reaches these logs.
  - timestamp: '2026-10-12T00:00:00.000Z'
    title: Block tools/call without a readable tool name on every MCP tool gate
    description: Only Transit Point gating refused a `tools/call` with no `params.name`,
      or one whose name was not a string. Every other gate checked it as an empty
      name, which a deny-pattern gate passes, so an upstream that accepted such a
      call could reach a hidden tool. The direct Access Point, the `fabric://` send
      leg, the `proxy://` MCP proxy path, Fabric receive and Transit Points now all
      deny it when tool gating is configured and record a deny decision. Surfaces
      and Transit Points without gating are unchanged.
  - timestamp: '2026-10-12T02:00:00.000Z'
    title: Refuse MCP POST bodies that are not one JSON object
    description: 'A legacy MCP POST whose body the gateway could not parse as JSON,
      such as a JSON-RPC batch preceded by a UTF-8 byte order mark, was forwarded
      without tool gating or tool-scoped credential checks, because the gateway found
      no tool call in it. An upstream with a lenient parser strips the mark and runs
      every call in the batch, including a tool the gating hides. Access Points, Transit
      Points, Fabric receive and the standalone MCP Proxy now refuse, before any tool-level
      control, an MCP POST body that is not one JSON object. They answer with the
      JSON-RPC errors the Access Point already returned for malformed bodies: `-32700`
      for a body that is not valid JSON and `-32600` for JSON that is not an object.
      Other methods cannot carry a body; see "Refuse MCP requests that skip POST admission
      by method".'
  - timestamp: '2026-10-12T05:00:00.000Z'
    title: Refuse MCP POST bodies with duplicate or case-variant keys
    description: 'The gateway kept the last of two duplicate JSON keys but forwarded
      the original body, so an upstream parser that keeps the first could run a different
      method or tool from the one tool gating and tool-scoped credentials checked.
      Go''s `encoding/json` also matches field names case-insensitively, so `Name`
      next to `name`, or a lone `Method` or `params.Name`, had the same effect. Access
      Points, Transit Points, Fabric receive and the standalone MCP Proxy now refuse
      with JSON-RPC `-32600` an MCP POST body with two keys of one object, at any
      depth, that are equal or differ only in case. They also refuse a lone case variant
      of a field the gateway reads: `jsonrpc`, `id`, `method`, `params`, `params._meta`,
      `params.name` and `params.arguments` of a `tools/call` or `prompts/get`, and
      `params.uri` of a `resources/read`. Keys inside tool arguments are not case-checked.
      A legacy request gets HTTP 200 with `id` null. A `2026-07-28` request gets HTTP
      400 with the same code, as for any other malformed modern request, and its `id`
      echoed unless the `id` key itself is duplicated or a case variant.'
  breaking:
  - timestamp: '2026-10-09T12:00:00.000Z'
    title: "⭐ Never apply tool-scoped credential bindings on Transit Points"
    description: 'A legacy MCP request through a Transit Point matched `required_for.tools`
      against the JSON-RPC method, so a binding that listed a tool never applied there,
      while one that listed a method such as `tools/call` or `message/send` did. A
      `2026-07-28` `tools/call` matched on the tool name. Transit Points now apply
      only `all` bindings. Bindings carry no destination, and a partner upstream names
      its own tools, so a tool name that collided with one of the Target''s tools
      would hand the partner a credential meant for the Target. `all` bindings still
      reach every Transit Point of the surface, including the `transit_credentials`
      that a surface without `outbound_credentials` reads as `all`. Access Points
      are unchanged. Upgrade note: a binding that lists a JSON-RPC method, or a tool
      called through a Transit Point with `2026-07-28`, no longer sends its credential
      to the Transit upstream. Use an `all` binding only if every Transit Point''s
      upstream should receive it.'
  - timestamp: '2026-10-12T04:00:00.000Z'
    title: Refuse MCP requests that skip POST admission by method
    description: 'MCP admission, including the batch and single-object checks, ran
      only for POST. A PUT or PATCH, or a GET or DELETE with a body, reached the upstream
      without them, so an upstream that routes by path whatever the method could run
      a batch or a gated tool. Access Points, Transit Points and Fabric receive now
      answer 405 with `Allow: POST, GET, DELETE, HEAD, OPTIONS` to any method but
      those five, and 400 with JSON-RPC `-32600` to any non-POST request with a body.
      A standalone MCP Proxy answers DELETE with 405 and `Allow: POST, GET, HEAD`.
      GET and DELETE without a body behave as before. Upgrade note: an MCP client
      that sends PUT, PATCH or a body on GET or DELETE is now refused, as is an MCP
      POST whose body is not valid JSON or is JSON but not an object, on Access Points,
      Transit Points, Fabric receive and the standalone MCP Proxy.'
