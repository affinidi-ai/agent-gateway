branch: fix/fabric-credential-follow-ups
changes:
  added: []
  changed:
    - timestamp: '2026-10-12T01:00:00.000Z'
      title: Refuse JSON-RPC batches explicitly at MCP admission
      description: >-
        Access Points, Transit Points and Fabric receive already refused a legacy JSON-RPC batch
        sent as a POST, but only because MCP identity verification could not read a non-object
        body. They now refuse it at admission, before any tool-level control, still with 422.
        The detail changes from "Invalid MCP identity presentation" to "JSON-RPC batches are not
        supported".
  fixed:
    - timestamp: '2026-10-09T12:00:00.000Z'
      title: Apply tool-scoped credential bindings to tool calls on Transit Points
      description: >-
        A legacy MCP `tools/call` sent through a Transit Point matched credential bindings against
        the JSON-RPC method instead of the tool name, so a binding with `required_for.tools` never
        applied: the upstream got no credential and no consent was requested. The Transit Point
        now matches on `params.name`, so the binding applies to the listed tools only, and the
        delegation audit records the tool name instead of the method. Upgrade note: if a surface
        has bindings with `required_for.tools`, its Transit Points start sending the delegated
        credential to the Transit upstream for the listed tools, or asking the user for consent
        when no credential is stored. Before this change no credential was ever sent there. Check
        that each such upstream should receive the credential before upgrading.
    - timestamp: '2026-10-09T14:00:00.000Z'
      title: Apply tool-scoped credential bindings only to tools/call on Access Points
      description: >-
        An Access Point matched `required_for.tools` against `params.name` of any legacy MCP
        method, so a `prompts/get` whose name equalled a listed tool picked up the tool-scoped
        credential. Only a `tools/call` now names a called tool; the `input.mcp.tool_name` policy
        input is unchanged.
    - timestamp: '2026-10-12T03:00:00.000Z'
      title: Document the exposure-mode upgrade risk and the 400 for non-Remote gateways
      description: >-
        The Fabric guide now warns that every node sharing gateway storage, such as both nodes of
        an active/standby pair, must be upgraded before failing back to an earlier version, and
        that peers must not be paired or have their exposure changed until every node runs a
        version with exposure modes. An earlier version reads a Remote record with mode `none`
        and an empty list as every surface, and drops the mode when it saves the record. The
        guide also notes that `PUT /v1/gateways/{id}/exposed-surfaces` on a gateway that is not
        Remote returns 400. The configuration reference gets its Related section heading back.
  removed: []
  security:
    - timestamp: '2026-10-09T00:00:00.000Z'
      title: Stop logging forwarded header values on Fabric requests and responses
      description: >-
        When a gateway forwarded a Fabric request to its Target, it logged every forwarded header
        with its value at info level, including a delegated access token in `Authorization` or in
        a custom credential header. The sending gateway did the same for the response headers it
        received back from its Fabric peer, such as `Set-Cookie` or `WWW-Authenticate`. Both now
        log only header names, so no credential value reaches the logs whatever header carries it.
    - timestamp: '2026-10-12T00:00:00.000Z'
      title: Block tools/call without a readable tool name on gated Transit Points
      description: >-
        When a Transit Point had MCP tool gating, a `tools/call` with no `params.name`, or one
        whose name was not a string, was forwarded to the upstream without being checked, so an
        upstream that accepted such a call could reach a hidden tool. The Transit Point now
        refuses it with 403 and records a deny decision. Transit Points without gating are
        unchanged.
    - timestamp: '2026-10-12T02:00:00.000Z'
      title: Refuse MCP POST bodies that are not one JSON object
      description: >-
        A legacy MCP POST whose body the gateway could not parse as JSON, such as a JSON-RPC
        batch preceded by a UTF-8 byte order mark, was forwarded without tool gating or
        tool-scoped credential checks, because the gateway found no tool call in it. An upstream
        with a lenient parser strips the mark and runs every call in the batch, including a tool
        the gating hides. Access Points, Transit Points and Fabric receive now refuse, before any
        tool-level control, an MCP POST body that is not one JSON object. They answer with the
        JSON-RPC errors the Access Point already returned for malformed bodies: `-32700` for a
        body that is not valid JSON and `-32600` for JSON that is not an object. Other methods
        cannot carry a body; see the next entry.
    - timestamp: '2026-10-12T04:00:00.000Z'
      title: Refuse MCP requests that skip POST admission by method
      description: >-
        MCP admission, including the batch and single-object checks, ran only for POST. A PUT or
        PATCH, or a GET or DELETE with a body, reached the upstream without them, so an upstream
        that routes by path whatever the method could run a batch or a gated tool. Access Points,
        Transit Points and Fabric receive now answer 405 with `Allow: POST, GET, DELETE` to any
        method but POST, GET, DELETE, HEAD and OPTIONS, and 400 to any non-POST request with a
        body. Upgrade note: an MCP client that sends PUT, PATCH or a body on GET or DELETE is now
        refused.
    - timestamp: '2026-10-12T05:00:00.000Z'
      title: Refuse MCP POST bodies with duplicate or case-variant keys
      description: >-
        The gateway kept the last of two duplicate JSON keys but forwarded the original body, so
        an upstream parser that keeps the first could run a different method or tool from the
        one tool gating and tool-scoped credentials checked. Go's `encoding/json` also matches
        field names case-insensitively, so `Name` next to `name` had the same effect. Access
        Points, Transit Points and Fabric receive now refuse with JSON-RPC `-32600` an MCP POST
        body with a duplicate key at any depth, or two keys of the envelope or its `params` that
        differ only in case.
  breaking: []
  internal:
    - timestamp: '2026-10-09T14:00:00.000Z'
      title: Share one called-tool rule across Transit Point gating and credentials
      description: >-
        Transit Point MCP tool gating and credential injection both read the called tool through
        `called_tool_name`, instead of separate body parses. Regression tests pin that a legacy
        JSON-RPC batch containing a `tools/call` is refused with 422 before tool gating or
        tool-scoped credentials on Access Points, Transit Points and Fabric receive, and that a
        Transit Point refuses a batch preceded by a UTF-8 byte order mark without forwarding it.
