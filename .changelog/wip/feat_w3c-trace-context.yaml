branch: feat/w3c-trace-context
changes:
  added:
    - timestamp: '2026-11-20T16:20:00Z'
      title: Record span, parent span and trace source on audit records
      description: >-
        Every audit record of a request now carries span_id, the request's span in W3C Trace
        Context with the same value as request_id. A record of an Access Point request also
        carries trace_source (header or minted) and parent_span_id, the span the caller's
        traceparent named, so Agent Watch can follow a request across appliances.
    - timestamp: '2026-11-20T16:45:00Z'
      title: Continue the caller's traceparent at an Access Point
      description: >-
        An Access Point now reads the caller's traceparent as well as X-Gateway-Trace-Id and
        continues the trace they name, with the caller's span as the parent. When both arrive
        and name different traces, X-Gateway-Trace-Id is continued and a warning names both
        trace ids. A header that is not valid, or that arrived more than once, is ignored and a
        new trace is started.
    - timestamp: '2026-11-21T00:20:00Z'
      title: Record each request an Access Point forwards as request_forwarded
      description: >-
        A new audit event, request_forwarded in the Requests group (audit.request_forwarded for
        integrations), records each Access Point request at the moment it is handed to its
        target, with its trace, span and parent span, the surface, the target without
        credentials and, for an authenticated caller, the same caller fields a policy decision
        records. It lets Agent Watch name the original caller of a request whether or not a
        policy ran. No body, header value, token or identity hash is recorded.
    - timestamp: '2026-11-21T06:30:00Z'
      title: Offer span, parent span and trace source to audit integrations
      description: >-
        Audit integration templates can now use AUDIT_SPAN_ID, AUDIT_PARENT_SPAN_ID and
        AUDIT_TRACE_SOURCE for every audit record, so a receiver such as Agent Watch can follow a
        request across appliances without parsing the whole record.
  changed:
    - timestamp: '2026-11-23T14:00:00Z'
      title: Send the Managed Agent one set of trace headers
      description: >-
        An Access Point now sends its Managed Agent exactly one traceparent, naming the trace and
        the Access Point's own span, and exactly one X-Gateway-Trace-Id. It no longer passes on
        the caller's own traceparent or appends its X-Gateway-Trace-Id beside the caller's. The
        caller's tracestate goes on only when the caller's traceparent is continued. A Target
        bound by external consent still receives X-Gateway-Trace-Id alone.
    - timestamp: '2026-11-23T16:00:00Z'
      title: Pay under the request's own traceparent
      description: >-
        The agent-pay payment call of an Access Point request now carries the traceparent the
        request is forwarded with: the Access Point's span, sampled only when the caller's
        continued trace was. It carried a fresh span, always sampled. A payment made by a
        gateway that received the request over the Fabric is unchanged.
  fixed: []
  removed: []
  security: []
  breaking:
    - timestamp: '2026-11-20T14:02:20Z'
      title: Start trace ids as 32 lowercase hexadecimal digits
      description: >-
        A trace id an Access Point starts, and the fresh one a surface with terminate_trace_id
        sends downstream, is now 32 lowercase hexadecimal digits with no hyphens, the W3C Trace
        Context form. It was a hyphenated UUID. The new form appears in X-Gateway-Trace-Id, in the
        transit token, in audit records and in logs. A Managed Agent or a log pipeline that reads
        the value as a hyphenated UUID must accept the new form; a parser that accepts a UUID
        without hyphens, as earlier gateways do, needs no change. An Access Point also writes a
        trace id it continues from X-Gateway-Trace-Id in this form, and no longer continues a
        braced or urn: one. A Transit Point request with neither a transit token nor that header
        still starts a hyphenated UUID, and a gateway that receives a request over a Fabric stream
        still records its trace id hyphenated.
