branch: feat/w3c-trace-context
changes:
  added:
    - timestamp: '2026-11-20T16:20:00Z'
      title: Record span, parent span and trace source on audit records
      description: >-
        Every audit record of a request now carries span_id, the request's span in W3C Trace
        Context with the same value as request_id. A record of an Access Point request also
        carries trace_source (header or minted) and parent_span_id, the span the caller's
        traceparent named, so Agent Watch can follow a request across appliances.
    - timestamp: '2026-11-20T16:45:00Z'
      title: Continue the caller's traceparent at an Access Point
      description: >-
        An Access Point now reads the caller's traceparent as well as X-Gateway-Trace-Id and
        continues the trace they name, with the caller's span as the parent. When both arrive
        and name different traces, X-Gateway-Trace-Id is continued and a warning names both
        trace ids. A header that is not valid, or that arrived more than once, is ignored and a
        new trace is started.
    - timestamp: '2026-11-21T00:20:00Z'
      title: Record each request an Access Point forwards as request_forwarded
      description: >-
        A new audit event, request_forwarded in the Requests group (audit.request_forwarded for
        integrations), records each Access Point request at the moment it is handed to its
        target, with its trace, span and parent span, the surface, the target without
        credentials and, for an authenticated caller, the same caller fields a policy decision
        records. It lets Agent Watch name the original caller of a request whether or not a
        policy ran. No body, header value, token or identity hash is recorded.
    - timestamp: '2026-11-21T06:30:00Z'
      title: Offer span, parent span and trace source to audit integrations
      description: >-
        Audit integration templates can now use AUDIT_SPAN_ID, AUDIT_PARENT_SPAN_ID and
        AUDIT_TRACE_SOURCE for every audit record, so a receiver such as Agent Watch can follow a
        request across appliances without parsing the whole record.
    - timestamp: '2026-11-23T19:00:00Z'
      title: Record each request a Transit Point forwards as transit_request_forwarded
      description: >-
        A new audit event, transit_request_forwarded in the Requests group
        (audit.transit_request_forwarded for integrations), records each Transit Point request at
        the moment it is handed to its target, over HTTP, to its MCP Proxy or over the Fabric, with
        its trace, span, parent span and trace source, the Transit Point, the target without
        credentials and whether it crossed the Fabric. It names no caller: Agent Watch reaches the
        original caller through the Access Point's request_forwarded of the same trace. A refused
        request writes none.
    - timestamp: '2026-11-24T10:00:00Z'
      title: Show forwarded requests in the Audit Log
      description: >-
        The Audit Log now describes request_forwarded records as Request forwarded, naming the
        surface, the target and the verified caller, with the caller grouped as on a policy
        decision, and transit_request_forwarded records as Transit request forwarded, naming the
        Transit Point and no caller. They were shown as generic events.
    - timestamp: '2026-11-24T14:00:00Z'
      title: Add EVENT_ID and OCCURRED_AT to every integration event
      description: >-
        Every integration event now has an event id, given when the gateway creates the event and
        the same on every delivery and retry of it, and an occurrence time, when it happened.
        Templates can use them as ${EVENT_ID} and ${OCCURRED_AT}. Gateway, user, connection point
        and payment events had no id before; an audit record's id is its own event_id, and an
        audit record stored before records had one has none. A non-audit event's id is kept in
        memory only, while the gateway delivers it.
    - timestamp: '2026-11-24T14:00:00Z'
      title: Add occurred_at to the event hook body beside timestamp
      description: >-
        The event hook's body now carries occurred_at, when the Connection Point event happened.
        timestamp stays, with the same value, for receivers that read it; occurred_at is the field
        to use. Both are the same on every retry, as event_id is.
  changed:
    - timestamp: '2026-11-24T14:00:00Z'
      title: Place connection_point.connected at the time its message arrived
      description: >-
        A connection_point.connected event now happened when its connection-setup message was
        received: its occurrence time, and its DATE, TIME and DATETIME, are that time, the same as
        RECEIVED_AT. They were the time the gateway raised the event, and DATE, TIME and DATETIME
        were described as delivery times.
    - timestamp: '2026-11-24T14:00:00Z'
      title: Deprecate the TIMESTAMP template variable for OCCURRED_AT
      description: >-
        ${TIMESTAMP} now renders the event's occurrence time, the same value as ${OCCURRED_AT},
        for every event and on every retry, and is marked deprecated in the variable catalogue.
        Saved templates that use it keep working. At startup the gateway warns once for each
        integration whose template uses ${TIMESTAMP} or writes a top-level timestamp key, naming
        the integration and what to change. The startup warning for a stored definition that
        fails its checks no longer says its deliveries will fail.
    - timestamp: '2026-11-23T14:00:00Z'
      title: Send the Managed Agent one set of trace headers
      description: >-
        An Access Point now sends its Managed Agent exactly one traceparent, naming the trace and
        the Access Point's own span, and exactly one X-Gateway-Trace-Id. It no longer passes on
        the caller's own traceparent or appends its X-Gateway-Trace-Id beside the caller's. The
        caller's tracestate goes on only when the caller's traceparent is continued. A Target
        bound by external consent still receives X-Gateway-Trace-Id alone.
    - timestamp: '2026-11-23T16:00:00Z'
      title: Pay under the request's own traceparent
      description: >-
        The agent-pay payment call of an Access Point request now carries the traceparent the
        request is forwarded with: the Access Point's span, sampled only when the caller's
        continued trace was. It carried a fresh span, always sampled. A payment made by a
        gateway that received the request over the Fabric is unchanged.
    - timestamp: '2026-11-23T20:00:00Z'
      title: Send a Transit Point's target its trace by the target's class
      description: >-
        A Transit Point no longer passes the managed agent's traceparent, tracestate and
        X-Gateway-Trace-Id on. A fabric:// target's gateway receives the Transit Point's own
        traceparent of the request's trace, with tracestate only when the agent's traceparent was
        continued, and the trace id in the Fabric message, from which it writes X-Gateway-Trace-Id
        for its Managed Agent; an MCP body's params._meta traceparent is replaced by the one sent.
        Any other target, a third party, receives no trace header, and traceparent and tracestate
        are removed from an MCP body's params._meta, so a vendor never learns the trace.
    - timestamp: '2026-11-24T09:00:00Z'
      title: Write the Access Point's traceparent into MCP metadata
      description: >-
        An Access Point now replaces a traceparent an MCP request carries in params._meta with
        the traceparent it sends its Managed Agent in the header, so both name the Access Point's
        span. A body without one gains none, and every other _meta key stays. A Target bound by
        external consent, and a fabric:// Target, receive the body as the caller sent it.
  fixed: []
  removed: []
  security: []
  breaking:
    - timestamp: '2026-11-20T14:02:20Z'
      title: Start trace ids as 32 lowercase hexadecimal digits
      description: >-
        A trace id an Access Point starts, and the fresh one a surface with terminate_trace_id
        sends downstream, is now 32 lowercase hexadecimal digits with no hyphens, the W3C Trace
        Context form. It was a hyphenated UUID. The new form appears in X-Gateway-Trace-Id, in the
        transit token, in audit records and in logs. A Managed Agent or a log pipeline that reads
        the value as a hyphenated UUID must accept the new form; a parser that accepts a UUID
        without hyphens, as earlier gateways do, needs no change. An Access Point and a Transit
        Point also write a trace id they continue from X-Gateway-Trace-Id in this form, and no
        longer continue a braced or urn: one. A gateway that receives a request over a Fabric
        stream still records its trace id hyphenated.
    - timestamp: '2026-11-23T18:00:00Z'
      title: Resolve a Transit Point's trace from its transit token, then its headers
      description: >-
        A Transit Point now continues the trace of the transit token it verified, also where it
        does not require one, and records it with trace_source transit_token and, when the
        managed agent's traceparent names that trace, its span as parent_span_id. Without a
        verified token it reads traceparent and X-Gateway-Trace-Id as an Access Point does, and
        otherwise starts a 32 hex trace. The records it writes before its transit token is checked
        for the last time (a refused caller, a rate limit, a refused body) no longer carry a
        trace id, only their span, so a token refused later never names their trace.
    - timestamp: '2026-11-24T14:00:00Z'
      title: ⭐ Deliver webhook and stream events with event_id and occurred_at
      description: >-
        Every webhook and stream delivery now carries the event's event_id and occurred_at at its
        top level, set by the gateway whatever the integration's template wrote there, and no
        top-level timestamp: a template's top-level timestamp key is removed. The default envelope
        sends event_id and occurred_at in place of timestamp. A receiver that read timestamp must
        read occurred_at. A key named timestamp inside the message, such as the audit record's own
        field, is unchanged. Slack and email messages are sent as before, and no Kafka record
        carries a header.
