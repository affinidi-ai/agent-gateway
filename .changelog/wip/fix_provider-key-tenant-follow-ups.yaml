branch: fix/provider-key-tenant-follow-ups
changes:
  added:
    - timestamp: '2026-11-05T18:00:00Z'
      title: Report the status of each API key a surface names in surface responses
      description: >-
        A surface read and the create, update and patch responses of a surface that names an
        API Key Provider key id now carry a read-only api_key_references list, one key_id and
        status per id in the base and every variant: active or revoked for a key of the
        surface, missing when no key has the id, unavailable for another surface's key, whose
        status is never reported, and unknown when the API key store cannot be read. It is
        computed by the gateway, so a tenant caller who cannot list API keys sees it too, and
        a write body that sends it back has it dropped. It lets a client flag an Identity whose
        key was revoked or deleted.
    - timestamp: '2026-11-05T19:00:00Z'
      title: Flag an Identity whose API key was revoked or deleted in the Surface Builder
      description: >-
        The Surface Builder draws a red dashed ring and a short reason under a protected,
        external or Transit Point Identity whose stored API key was revoked, deleted, or belongs
        to another surface, in the base and every variant, and the Identity panel names that
        state in the key picker with a warning. The stored key stays selected, by name when it
        was revoked, as a disabled option that cannot be picked again once changed. Save shows
        that warning as an error and does not save until the Identity names an active key. The API key detail page says
        "This API key is no longer in use because the associated surface has been deleted."
        for a key whose surface was deleted.
    - timestamp: '2026-11-06T10:00:00Z'
      title: Mark an identity Archived when every surface it is linked to is deleted
      description: >-
        The dashboard identity list, on the stats response and the websocket update alike, now
        carries archived, true when an identity is linked to at least one surface and none of
        them exists, and false when the surfaces cannot be listed. The Identities page shows an
        Archived badge on the identity and its surface id as plain text with a Deleted badge
        instead of a link to a surface that is gone, and selecting the identity, there or in the Dashboard's identity
        details, says "This identity is no longer in use because the associated surface has been
        deleted." A surface delete re-sends the identities it archived in the next update. An
        identity whose own surface was deleted while another surface it used is live shows that
        live surface, the most recently used one, so a deleted surface is never linked.
  changed:
    - timestamp: '2026-11-05T18:00:00Z'
      title: Let an unrestricted admin read an API key whose surface was deleted
      description: >-
        GET /v1/api-keys/{agent_id}/{key_id} now answers an unrestricted caller for a key whose
        surface no longer exists, instead of 404, and every 200 answer carries surface_deleted,
        true when the key's surface was deleted, so the dashboard can say the key is no longer
        in use. Tenant-, resource- and header-gated callers still get 404 for such a key.
    - timestamp: '2026-11-05T21:00:00Z'
      title: Delete an API key a surface uses after confirming it in the dashboard
      description: >-
        Deleting an API key that a stored surface uses is allowed. The Secrets page and the API
        key page open a confirmation dialog before every API key delete, saying that callers
        presenting the key are refused and that surfaces using it become Unconfigured and stop
        serving, and delete only after Delete API key is clicked in that dialog. DELETE
        /v1/api-keys/{agent_id}/{key_id} removes the key, also one whose owning surface is gone,
        and a key that is not under the surface named in the path answers 404. Every surface
        naming a deleted key answers 503 until it names another key.
  fixed:
    - timestamp: '2026-11-05T09:35:33Z'
      title: Read the API key store once per boot or reload for the provider key check
      description: >-
        Boot and a configuration reload now check every surface that derives a DID from an API
        key against one listing of the API key store, instead of listing the whole store once
        per surface, and their credential policy report judges from the same listing. When that
        listing fails, the report logs it once and lists each surface naming a key id as
        store_unavailable instead of missing_key.
    - timestamp: '2026-11-05T09:35:33Z'
      title: Stop re-reading an unreadable API key store on every request
      description: >-
        While the API key store cannot be read, a surface naming an API key id keeps its 503
        verdict until the recheck interval passes, as a missing key's verdict is kept, so a
        failing disk or share is read at most once per interval per surface.
  removed: []
  security:
    - timestamp: '2026-11-06T15:30:00Z'
      title: Update actix-web and actix-http to releases with published fixes
      description: >-
        actix-web moves from 4.14.0 to 4.18.2 and actix-http from 3.13.1 to 3.20.3, pulled in
        through the MCP OpenAPI dependency, so the dependency audit no longer reports their
        advisories on chunked request trailers and on compressed request bodies.
    - timestamp: '2026-11-05T09:35:33Z'
      title: Stop Identities serving the API key DID of a deleted surface under enforce
      description: >-
        Under tenant_credential_isolation enforce, a surface whose Identity slot, identity
        injection or Transit Point identity names an API key whose owning surface no longer
        exists is not ready, as the key's tenant cannot be told. In either
        mode, creating a surface with an id whose API key folder holds any key record, readable
        or not and whatever owner it names, such as the kept keys of a deleted surface, answers
        400, and answers 503 when that folder cannot be read, so a new surface cannot take over
        those keys and the DIDs derived from them.
    - timestamp: '2026-11-05T09:35:33Z'
      title: Revoke a surface's API keys when the surface is deleted
      description: >-
        Deleting a surface now revokes its active API keys and keeps their records, so they
        no longer authenticate callers and the deleted surface's id stays tied to them. The
        surface's key folder is read from disk, so keys another node created are revoked too.
    - timestamp: '2026-11-05T09:35:33Z'
      title: Treat an API key folder that fails to load as a key store outage
      description: >-
        The provider key tenant check run when a surface goes live no longer reads the keys of
        a folder it could not load as missing. Surfaces naming an API key id answer 503 until
        the folder can be read, so a surface cannot keep serving another tenant's key DID
        because that key failed to load. Surface saves, tenant reassignment and the API key
        listing still answer without the folder's keys.
    - timestamp: '2026-11-05T10:40:17Z'
      title: Keep API key usage apart from the key record so it cannot undo a revoke
      description: >-
        An API key's last use is now written to its own file beside the key record, at most
        once a minute per key and node, and never into the record, so recording a key's use
        on one node can no longer write a revoked key back as active on any node. A failed
        usage write is logged and the caller is still accepted. The API key list and detail
        show the usage file's time, or a record's own last use from before this change. A key
        revoked on another node stops authenticating here at this node's next cache refresh, or
        with cache_refresh_interval_secs at its default of 0, at restart or promotion to
        Active. A rotation re-reads the key from disk and refuses one another node revoked, and
        key records are replaced atomically so concurrent writes cannot leave a partial record.
    - timestamp: '2026-11-05T12:30:00Z'
      title: Let a surface name only its own API keys in an Identity
      description: >-
        A from_api_key Identity, identity injection or Transit Point identity now saves only an
        API key of the surface itself, as does a Caller Context API Key secret named like a key on
        a surface whose inbound Identity is From API Key. A new reference to another surface's key,
        of any tenant, answers 400, so no Identity can derive another surface's key DID. A reference
        the stored surface already had is kept on save under warn. The provider key check reports
        such a key as other_surface, and the Surface Builder key picker lists only the surface's
        own active keys. A surface template drops every API key id it would carry, including an
        API key shaped Caller Context secret and the Identity nodes of variant canvases.
    - timestamp: '2026-11-05T15:41:02Z'
      title: ⭐ Refuse requests to a surface that derives its DID from a revoked API key
      description: >-
        A surface whose Identity slot, target identity injection, Transit Point or legacy Caller
        Context secret names a revoked API Key Provider key is now not ready in both
        tenant_credential_isolation modes
        and answers every request with 503, on the direct path, over Fabric and on its Transit
        Points, and gets no agent card preview. The DID is derived from the key id with no key
        lookup, so before this change a revoked key kept its surface's DID. The node that revokes
        the key, or deletes its surface, refuses the next request; other nodes reread the status
        of the keys a surface names from disk on the first request after
        cache_refresh_interval_secs, or after 30 seconds when it is 0. The refusal is logged with reason api_key_revoked and the
        credential policy report lists the key as revoked_key. Rotating a key keeps its surface
        serving.
    - timestamp: '2026-11-05T16:30:00Z'
      title: Refuse a surface save that adds a new reference to a revoked API key
      description: >-
        A create or save that adds a revoked API Key Provider key to an Identity slot, the
        target identity injection, a Transit Point or a legacy Caller Context secret now answers 400 "API key '<key id>' is revoked;
        name an active API key of this surface", so a save no longer accepts a surface that
        would not serve. A key the surface may not name for another reason keeps that rule's
        message, so the status of another surface's key is not disclosed. A reference the stored surface
        already named is kept on save, and the surface stays not ready until it names an
        active key.
    - timestamp: '2026-11-05T22:00:00Z'
      title: Revoke the API keys of surfaces deleted before the upgrade when going Active
      description: >-
        When the gateway boots Active or a Standby node becomes Active, it revokes every active
        API key whose owning surface no longer exists, under the actor surface-delete, and logs
        how many it revoked. Keys of surfaces deleted by an earlier release stayed active, so a
        surface deriving its DID from one kept serving it under warn; it now answers 503 as
        revoked_key until it names an active key. A surface counts as existing when its file is
        in the agent surface folder, readable or not, or when the surface store, the static
        configuration or the DynamoDB source holds it; a key owner an API Key Provider of a
        surface names keeps its keys too, unlike a surface delete, and so does an owner whose
        newest key was created within cache_refresh_interval_secs (30 seconds when it is 0).
        When the API keys, the surface folder or the DynamoDB source cannot all be read, or no
        surface is found at all, nothing is revoked. A Standby node revokes nothing.
  breaking:
    - timestamp: '2026-11-05T12:30:00Z'
      title: Take surfaces naming another surface's API key out of service under enforce
      description: >-
        Under tenant_credential_isolation enforce, a stored surface whose Identity names another
        surface's API key, even one of its own tenant, is not ready after upgrade and answers 503,
        and saving it unchanged answers 400. Under warn it keeps serving and is logged as
        other_surface. To fix such a surface, add an API key to it and save it naming that key;
        to set up a new one, create the surface, add its API key, then save it naming that key.
        A stored surface naming a key whose owning surface was deleted is also not ready under
        enforce after upgrade.
    - timestamp: '2026-11-05T20:00:00Z'
      title: Stop serving a stored surface that names a revoked API key, under warn too
      description: >-
        After the upgrade, a stored surface whose Identity slot, target identity injection,
        Transit Point or legacy Caller Context secret names a revoked API Key Provider key
        answers every request with 503 under tenant_credential_isolation warn as well as
        enforce. This includes a key of a deleted surface: deleting a surface revokes its keys,
        and the gateway revokes the keys of surfaces deleted before the upgrade when it becomes
        Active. To keep such a surface serving, select an active
        API key of that surface in place of the revoked one and save it; the Surface Builder
        marks the affected Identity as unconfigured.
    - timestamp: '2026-11-05T21:00:00Z'
      title: Stop serving a stored surface that names an API key that no longer exists
      description: >-
        After the upgrade, a stored surface whose Identity slot, target identity injection or
        Transit Point names an API Key Provider key id that no key has answers every request
        with 503 under tenant_credential_isolation warn as well as enforce, logged with reason
        api_key_missing and reported as missing_key with not_ready true. Before, such a surface
        kept serving the DID of a key that was gone. A legacy Caller Context secret with no key
        of its id stays a plain secret. To keep such a surface serving, select an existing API
        key of that surface and save it; the Surface Builder marks the Identity as unconfigured.
