branch: fix/provider-key-tenant-follow-ups
changes:
  added: []
  changed: []
  fixed:
    - timestamp: '2026-11-05T09:35:33Z'
      title: Read the API key store once per boot or reload for the provider key check
      description: >-
        Boot and a configuration reload now check every surface that derives a DID from an API
        key against one listing of the API key store, instead of listing the whole store once
        per surface.
    - timestamp: '2026-11-05T09:35:33Z'
      title: Stop re-reading an unreadable API key store on every request
      description: >-
        While the API key store cannot be read, a surface naming an API key id keeps its 503
        verdict until the recheck interval passes, as a missing key's verdict is kept, so a
        failing disk or share is read at most once per interval per surface.
  removed: []
  security:
    - timestamp: '2026-11-05T09:35:33Z'
      title: Stop surfaces serving the API key DID of a deleted surface under enforce
      description: >-
        Under tenant_credential_isolation enforce, a surface naming an API key whose owning
        surface no longer exists is not ready, as the key's tenant cannot be told. A new surface
        cannot be created with an id whose API key folder holds any key record, readable or
        not and whatever owner it names, such as the kept keys of a deleted surface, so it
        cannot take over those keys and the DIDs derived from them.
    - timestamp: '2026-11-05T09:35:33Z'
      title: Revoke a surface's API keys when the surface is deleted
      description: >-
        Deleting a surface now revokes its active API keys and keeps their records, so they
        no longer authenticate callers and the deleted surface's id stays tied to them. The
        surface's key folder is read from disk, so keys another node created are revoked too.
    - timestamp: '2026-11-05T09:35:33Z'
      title: Treat an API key folder that fails to load as a key store outage
      description: >-
        The provider key tenant check run when a surface goes live no longer reads the keys of
        a folder it could not load as missing. Surfaces naming an API key id answer 503 until
        the folder can be read, so a surface cannot keep serving another tenant's key DID
        because that key failed to load. Surface saves, tenant reassignment, the credential
        policy report and the API key listing still answer without the folder's keys, and
        creating a surface with the id of that folder answers 503.
    - timestamp: '2026-11-05T10:40:17Z'
      title: Keep API key usage apart from the key record so it cannot undo a revoke
      description: >-
        An API key's last use is now written to its own file beside the key record, at most
        once a minute per key and node, and never into the record, so recording a key's use
        on one node can no longer write a revoked key back as active on any node. A failed
        usage write is logged and the caller is still accepted. The API key list and detail
        show the usage file's time, or a record's own last use from before this change. A key
        revoked on another node stops authenticating at this node's next cache refresh. A
        rotation re-reads the key from disk and refuses one another node revoked, and key
        records are replaced atomically so concurrent writes cannot leave a partial record.
  breaking: []
