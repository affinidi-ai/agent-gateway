branch: fix/display-identity-versioning
changes:
  added:
    - timestamp: '2026-11-02T12:00:00Z'
      title: Group a surface's managed agent identities into one Identities page entry
      description: >-
        A surface's managed agent gets a new DID when its x-identity claim values change or the
        surface is pointed at a different certificate or API key. The Identities page now shows
        those DIDs as one entry per surface, source and slot, led by the most recently used DID
        with the usage summed across them. The expanded row's Version History lists the earlier
        DIDs and the credential rotations inside them, newest first, with the fields each one
        changed. from_jwt_claim identities, one per claim value, and external callers keep one
        row per DID. A link to an earlier DID opens its entry and marks that version.
    - timestamp: '2026-11-02T12:00:00Z'
      title: Record certificate and API key rotations on managed agent identities
      description: >-
        Rotating a stored certificate or secret-store API key keeps the managed agent's DID, and
        nothing recorded it. Each managed identity record now stores the slot that created it
        (the protected slot or a Transit Point's own managed_identity), the credential's
        updated_at, and a list of rotations with their time and, for a certificate, the
        fingerprint, subject or issuer they replaced; the record's identity fields follow the
        current certificate. Identities rows carry the optional slot and rotations fields.
        Rotations before this release were not recorded; a certificate change found on the
        first use after it is recorded once, without a time.
  changed: []
  fixed:
    - timestamp: '2026-11-02T12:00:00Z'
      title: Replace the Identities page version history button, which never appeared
      description: >-
        The button waited for a uuid field the backend never sends, and its modal read a
        response shape the history endpoint does not return. The button and modal are removed;
        an identity's versions are listed in its expanded row instead.
  removed: []
  security: []
  breaking: []
