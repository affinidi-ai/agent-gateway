  fixed:
    - timestamp: '2026-10-16T12:00:00Z'
      title: Show one save button and an honest value reveal in the secret editor
      description: >-
        The secret editor had two save buttons and a reveal toggle that showed an empty field,
        because stored secret values are never returned by the API. The editor now has a single
        save button, marks the stored value as hidden, and offers the reveal toggle only for a
        value entered or generated on the page. Cancelling a value update or saving it clears
        the entered value from the page.
