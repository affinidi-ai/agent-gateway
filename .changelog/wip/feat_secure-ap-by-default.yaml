branch: feat/secure-ap-by-default
changes:
  added:
    - timestamp: '2026-10-30T12:00:00Z'
      title: Add access_point.public and caller_authentication.on_failure to surfaces
      description: >-
        `access_point.public: true` lets a surface admit callers without credentials, sets
        `on_failure` to `continue` on every save so a failed caller goes on to policy, and every
        save of such a surface answers with a `Warning` header. `caller_authentication.on_failure:
        reject` refuses a missing or invalid credential with `401` before policy and before the
        surface rate limit, as a JSON-RPC error carrying the request id for MCP callers and
        `application/problem+json` otherwise, on direct inbound, `proxy://`, `a2a-proxy://` and
        Fabric receive. The dashboard adds a Public access switch to the Access Point panel, and
        shows a surface stored without `public` as a legacy Access Point that it can close. A
        save of a legacy surface that authenticates no caller answers with a `Warning` header
        saying it admits callers without credentials.
    - timestamp: '2026-11-02T12:00:00Z'
      title: Report whether an Access Point is ready for external access
      description: >-
        Surface responses from the admin API carry a read-only top-level
        `access_point_status`, `ready` or `not_ready`, for the surface the Access Point URL
        serves: its default variant when it has one, otherwise the base. Variant responses
        report it for that variant. It is never stored, and a write that sends it back has it
        dropped. The dashboard shows "Not ready for external access" under the Access Point URL,
        with a Configure Authentication action, until the saved surface is ready. Each request a
        not-ready Access Point refuses is recorded in the Audit Log as `request_rejected` with
        the reason `access_point_not_ready`.
  changed:
    - timestamp: '2026-11-02T12:00:00Z'
      title: Show a surface save and its warnings in one warning toast
      description: >-
        The surface create and edit pages show a save that drew warnings as one toast, the saved
        message followed by "with warnings:" and each warning, with warning styling instead of
        error styling. The gateway's `Warning` headers come first, then the dashboard's own.
  fixed: []
  removed: []
  security: []
  breaking:
    - timestamp: '2026-11-02T12:00:00Z'
      title: ⭐ Create surfaces with closed Access Points by default
      description: >-
        The admin API and dashboard now create surfaces with `access_point.public: false`, so
        an Access Point no longer admits anonymous callers: a missing or invalid credential is
        refused with `401`. A closed Access Point without source authentication (a
        `caller_authentication` method, or on MCP `mcp_http.authorization`) is saved, with
        `access_point_status: not_ready` and a `Warning` header, but answers every request,
        discovery reads included, with `503` until source authentication is added or
        `public` is set to `true`. The same applies after a PUT, PATCH, variant change or
        promote that leaves a closed surface, or one of its enabled variants, without source
        authentication. API and CLI clients that create surfaces must add source authentication
        or send `access_point.public: true`, and should check `access_point_status` or the
        `Warning` headers of the response. Surfaces stored before this release, built from
        DynamoDB, or restored without `public` keep their behaviour.
    - timestamp: '2026-11-02T12:00:00Z'
      title: Older releases skip every surface created after this upgrade
      description: >-
        A release before this one rejects `access_point.public` and
        `caller_authentication.on_failure`, so after a rollback it skips, with a logged error,
        every surface that stores either one: every surface created after the upgrade, and
        every surface closed or opened since. Their routes answer `404` and they leave the
        dashboard and Fabric discovery until the upgrade is reapplied; the records stay on disk.
        Removing the fields to load them on the older release opens them to callers without
        credentials. Back up `_storage/agent_surfaces/` before upgrading.
