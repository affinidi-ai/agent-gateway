  fixed:
    - timestamp: '2026-11-10T12:00:00Z'
      title: List secrets of every type in the API Key (secret store) picker
      description: >-
        The Secret ID list of a Caller Context or Transit Point caller using API Key (secret store)
        showed only secrets of type API Key, so a secret saved with the default type General never
        appeared and nothing said why. The gateway reads the secret whatever its type, and the
        Secrets docs call the type descriptive only, so the list now offers every secret, those of
        type API Key first.
