branch: feat/oauth-hop-one
changes:
  added:
    - timestamp: '2026-10-29T09:00:00Z'
      title: ⭐ Require scopes on JWT bearer Access Points
      description: >-
        A jwt_bearer caller authentication method can list required_scopes. After the token
        verifies, the Access Point reads the scopes it grants from the strategy's scope claims
        (scope then scp by default, as a space-separated string or an array) and treats a token
        that lacks one as a failed caller of kind insufficient_scope, with the audit reason
        insufficient_scope. Most Access Points hand it to policy like a missing or invalid token;
        an MCP Access Point with protected_resource refuses it before policy with 403 and a
        WWW-Authenticate challenge carrying error="insufficient_scope" and the required scopes,
        and on the receiving gateway of a Fabric route it answers 403 with
        Bearer realm="agent-gateway", error="insufficient_scope". Entries must be RFC 6749 scope
        tokens and are checked on every surface save and at startup. Earlier releases ignore
        required_scopes and drop it when they save the record, so after a rollback those Access
        Points accept tokens without the scope, ID tokens included. Before rolling back, disable
        each Access Point that relies on it or protect it with a surface policy on the raw scope or
        scp claim in input.source_auth.claims, since earlier releases do not publish
        input.source_auth.scopes, and set required_scopes again after upgrading.
    - timestamp: '2026-10-29T09:00:00Z'
      title: Let a JWT verification strategy name the claims that carry scopes
      description: >-
        A strategy's scope_claims lists the token claims read for granted scopes, in order,
        defaulting to scope then scp, so Microsoft Entra app-only tokens can be read from roles.
        The list is validated on save, kept when a save omits it, and stored as absent when it
        equals the default, so existing strategy records are unchanged.
    - timestamp: '2026-10-29T09:00:00Z'
      title: Publish normalised scopes, client id and verifying strategy to policy
      description: >-
        Policy input for a verified JWT caller now carries scopes (sorted and de-duplicated),
        client_id (from client_id, azp or appid), strategy_id and strategy_tenant_id. Gateway
        policies that trust an issuer should key on the strategy, because a tenant can create a
        strategy with any issuer.
    - timestamp: '2026-10-29T09:00:00Z'
      title: Tell policy why caller authentication failed
      description: >-
        A failed caller's policy input now carries kind (missing, invalid or insufficient_scope)
        next to attempted_method and reason, so a policy can treat a scope shortfall differently
        from a missing or invalid credential.
    - timestamp: '2026-10-29T09:00:00Z'
      title: Count caller tokens that lack a required scope
      description: >-
        agent_gateway_scope_denied_total{scheme} counts each request whose caller token lacked a
        required scope, whether the gateway refused it or left it to policy, labelled jwt for a
        jwt_bearer method and mcp_resource_token for mcp_http.authorization, and whether or not an
        audit sink selects auth_failed.
  changed:
    - timestamp: '2026-10-29T09:00:00Z'
      title: Name only required scopes in the MCP discovery challenge
      description: >-
        The WWW-Authenticate challenge of an MCP Access Point with protected_resource now carries
        scope only when its jwt_bearer method lists required_scopes, and names exactly those, since
        they are what a token must grant. protected_resource.scopes stay advertise-only and no
        longer appear in the challenge.
    - timestamp: '2026-10-29T09:00:00Z'
      title: Advertise required scopes in MCP protected resource metadata
      description: >-
        scopes_supported in the protected resource metadata of an MCP Access Point now lists the
        union of protected_resource.scopes and the method's required_scopes, so a client that
        reads the metadata asks for every scope the Access Point enforces.
    - timestamp: '2026-10-29T09:00:00Z'
      title: Keep MCP Proxy metadata paths apart from Access Point paths
      description: >-
        Saving an MCP Proxy with mcp_http.authorization now fails with 400 when its path holds $
        or %24, or is the route or a Surface Variant path of any stored surface, and saving a
        surface whose route or variant path such a proxy uses fails the same way. Any MCP Proxy
        at or under the metadata path is refused too. Otherwise one tenant could make another
        tenant's Access Point metadata answer 503, or answer for its variant URL. A surface route
        or proxy path that holds $ or %24 no longer publishes metadata. Stored proxies and surfaces
        are not checked again at startup or reload, so rename such a path before upgrading to keep
        its metadata published; its next save otherwise fails with 400.
  fixed:
    - timestamp: '2026-10-29T09:00:00Z'
      title: Run the same surface validation on create as on update
      description: >-
        Creating a surface skipped the source authentication, Trust Check and Workload Binding
        checks that an update ran, so a POST could store a surface a later PUT refused. Create,
        update, PATCH and the variant routes now share one validation.
  removed: []
  security:
    - timestamp: '2026-10-29T09:00:00Z'
      title: Refuse ID tokens on Access Points that require scopes
      description: >-
        When required_scopes is set, a token carrying nonce or at_hash, or whose typ header is
        neither at+jwt, application/at+jwt nor JWT, fails as invalid, and a Google ID token minted
        for the Access Point URL fails for lacking a scope. Access Points without required_scopes
        keep their current token acceptance.
  breaking:
    - timestamp: '2026-10-29T09:00:00Z'
      title: Stop at startup on a prefix at the protected resource metadata path
      description: >-
        A channel, route of any type (redirect and static included) or MCP proxy prefix in
        gateway.json at or under /.well-known/oauth-protected-resource now stops the gateway at
        startup with exit code 2, and POST /v1/config/reload refuses such a configuration and keeps
        the running one. Previously a prefix equal to that path made the listener log a warning
        and stop publishing protected resource metadata, while its MCP Access Points kept
        challenging callers with a metadata URL it did not serve; a prefix below the path started
        normally and now stops the gateway too. Every listener now mounts the metadata path.
        Rename the prefix before upgrading.
    - timestamp: '2026-10-29T09:00:00Z'
      title: Refuse surface routes on the protected resource metadata path
      description: >-
        Saving a surface whose route is /.well-known/oauth-protected-resource or a path below it
        now fails with 400, because every inbound listener answers that path itself and the
        Access Point could not be reached there. A stored surface with such a route, which earlier
        releases served through a catch-all prefix of an empty path or /.well-known, is now logged
        as an error naming the surface id and no longer mounted, at startup and on reload. Change
        its route before upgrading.
    - timestamp: '2026-10-29T09:00:00Z'
      title: Drop Target challenges other than Payment on protected and Fabric routes
      description: >-
        On an MCP Access Point with protected_resource, and on any surface whose Target is a
        fabric:// route, the gateway now removes every WWW-Authenticate challenge from the
        Target's response except Payment and its own, because those challenges name an
        authorization the caller cannot use through the gateway. A Target 401 left with no
        challenge becomes 502, so the receiving gateway's 401 on a Fabric route now reaches the
        caller as 502. Each dropped challenge is logged with its scheme. Other Access Points still
        pass the Target's challenges and status through. After upgrading, a client or alert that
        matched 401 from a fabric:// route or a protected MCP Access Point must also match 502 with
        the detail "The target refused the gateway's authorization". The caller cannot fix it:
        correct the credential the gateway injects toward the Target, or, on a Fabric route, the
        one the sending gateway injects.
