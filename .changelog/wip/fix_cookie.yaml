branch: fix/cookie
changes:
  added: []
  changed:
    - timestamp: '2026-11-23T12:30:00Z'
      title: Pin every AWS SDK client to one behaviour version
      description: >-
        The gateway asked for AWS SDK behaviour in two ways: the Secrets Manager and Parameter
        Store config loaders pinned v2026_01_12, which the SDK deprecates, while the KMS,
        Kinesis and DynamoDB clients asked for whatever version was latest and so changed
        silently with every SDK upgrade. All six now pin v2026_11_17, which applies the Retry
        Behavior 2.1 rules and a default read timeout to AWS SDK clients. The four clients that
        tracked the latest version are unaffected today, since v2026_11_17 is what they were
        already resolving to; from here a new behaviour version reaches them only when this
        pin is raised. For the two loaders, retry counts and backoff when reading a secret or a
        parameter at startup can differ, and a read that previously hung now times out. Nothing
        about which secret, parameter, key, stream or table is read changes.
  fixed: []
  removed: []
  security:
    - timestamp: '2026-11-23T11:00:00Z'
      title: Upgrade the cookie crate to 0.18.3 for RUSTSEC-2026-0594
      description: >-
        cookie 0.18.1 could repeat the AES-GCM nonce for the first private cookies written in a
        process that forks without exec, and a repeated nonce lets an attacker recover the
        plaintext and forge those cookies. The lockfile now pins cookie 0.18.3, the patched
        release, so cargo audit passes again. The gateway never built a private cookie: its
        session cookie is a plain __Host-session_token header, so no deployment was exposed and
        no session needs re-issuing.
  breaking: []
