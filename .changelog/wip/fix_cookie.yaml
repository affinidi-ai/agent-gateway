branch: fix/cookie
changes:
  added: []
  changed:
    - timestamp: '2026-11-23T12:30:00Z'
      title: Take the AWS SDK behaviour the rest of the gateway already uses
      description: >-
        The Secrets Manager and Parameter Store config loaders pinned the AWS SDK behaviour
        version to v2026_01_12, which the SDK deprecates. Both loaders move to v2026_11_17,
        which applies the Retry Behavior 2.1 rules and a default read timeout to AWS SDK
        clients. Every other AWS client in the gateway, for KMS, Kinesis and DynamoDB, asks for
        the latest behaviour version and so already works that way, so this aligns the two
        loaders with the rest of the process. Retry counts and backoff when reading a secret or
        a parameter at startup can differ, and a read that previously hung now times out;
        nothing about which secret or parameter is read changes.
  fixed: []
  removed: []
  security:
    - timestamp: '2026-11-23T11:00:00Z'
      title: Upgrade the cookie crate to 0.18.3 for RUSTSEC-2026-0594
      description: >-
        cookie 0.18.1 could repeat the AES-GCM nonce for the first private cookies written in a
        process that forks without exec, and a repeated nonce lets an attacker recover the
        plaintext and forge those cookies. The lockfile now pins cookie 0.18.3, the patched
        release, so cargo audit passes again. The gateway never built a private cookie: its
        session cookie is a plain __Host-session_token header, so no deployment was exposed and
        no session needs re-issuing.
  breaking: []
