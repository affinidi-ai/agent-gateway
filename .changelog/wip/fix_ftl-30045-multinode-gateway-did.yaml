branch: fix/ftl-30045-multinode-gateway-did
changes:
  added: []
  changed: []
  fixed:
    - timestamp: '2026-11-16T13:11:38Z'
      title: ⭐ List the gateway signing key under assertionMethod and authentication
      description: >-
        Strict Data Integrity verifiers refused the credentials and presentations a gateway
        signs, because its DID document did not list the signing key (#key-2) under
        assertionMethod. New gateways now list it under assertionMethod and authentication, the
        proof purpose presentations conventionally claim. A gateway that already published its
        DID document without it adds it when it starts Active: a did:webvh DID gets one new log
        version signed with the gateway key, so the DID and its earlier versions do not change
        and verifiers reading the latest version accept credentials the gateway signed before;
        a did:web DID gets its document updated. No key is created or replaced, and the new
        version and the stored did.json differ from the earlier ones only by #key-2 added to
        those two relationships. Only the Active node writes, the repair runs once, and a log
        that does not verify, a document missing either relationship or publishing another key
        as #key-2 or publishing #key-2 twice, or a log dated ahead of the node's clock is left
        as it is, and a stored
        did.json that is missing or does not parse is written again from the log. The /v1/resolve
        index now picks up new versions of the gateway DID log and is rebuilt from it when it
        does not match.
    - timestamp: '2026-11-16T13:11:38Z'
      title: Give gateways that start together on shared storage one DID and signing key
      description: >-
        Gateway instances that start together on one shared volume no longer each create their
        own signing keys and did:webvh DID, which could publish a DID document whose keys are
        not the ones the gateway signs with. The gateway DID and its keys are now created, and a
        did:web gateway moved to did:webvh, under an exclusive file lock in the vc_keys folder,
        so the first instance creates them and the others load what it wrote. A gateway whose
        keys and DID are already in place loads them without the lock, creates nothing and keeps
        every existing key. The DID document repair runs under the same lock, so two nodes
        Active at once add one version between them; a promoted node makes it after it admits
        traffic, and a node whose DID document and resolver index are already up to date takes
        no lock. On a volume that refuses the lock, a node started in Standby stops with an
        error rather than create a new gateway DID alone; an Active node, or one whose DID
        exists, starts without the lock as before. The DID log and did.json are now replaced
        atomically, so a reader never sees a partly written file.
