branch: feat/multiple-caller-auth-methods
changes:
  added:
    - timestamp: '2026-10-30T14:00:00.000Z'
      title: ⭐ Accept more than one source authentication method on one Access Point
      description: >-
        An Access Point accepted a list of caller authentication methods but enforced only the
        first, so an agent called by internal users with a JWT and by partner agents with an API
        key needed two surfaces, and two identities. Every method in
        `caller_authentication.methods` now works: the gateway verifies each request with the
        method whose credential the request carries (a header, for JWT bearer one holding a
        token in its scheme so an MPP `Authorization: Payment` credential is not a JWT, or the
        client certificate for mTLS), or with the first, primary, method when it carries none, refuses a request
        carrying credentials for more than one method, and never retries a rejected credential
        with another method. Policy sees the method that verified the caller as
        `input.source_auth.method`. Saving a surface now validates every method and refuses two
        methods reading the same credential location, more than one DID Auth method, a
        `from_jwt_claim` identity unless every method is JWT bearer, and an inbound
        `from_api_key` identity unless every method is API Key or API Key Provider. The
        credential headers of all methods are stripped before forwarding, and a forwarded JWT
        header reaches the target only when the JWT method verified the request. On an MCP
        Access Point that publishes protected resource metadata, only a failed JWT bearer
        credential gets the `401` discovery challenge. The Surface Builder's Caller Context
        element lists its methods in the sidebar and in its editor, each with whether it is
        ready, what it reads and a Configure button that opens its settings; methods are added
        from a menu, and made primary or removed in the editor.
  changed:
    - timestamp: '2026-10-30T16:00:00.000Z'
      title: Serve stored surfaces with extra source authentication methods safely on upgrade
      description: >-
        Methods after the first in a stored surface's `caller_authentication.methods` used to be
        ignored and now take effect, so a request carrying one of their credentials is verified
        by that method, and a request carrying credentials for two of the methods, which the
        first method used to verify, is refused. A stored surface whose methods break the new
        rules (two methods on one credential location, a second DID Auth method, a
        body-extracted method beside another, or an invalid later method) no longer stops the
        gateway from starting: it keeps only its first method, the gateway logs an error naming
        the surface and the rule, and local storage persists the correction. A stored
        `from_jwt_claim` identity beside a method other than JWT bearer, or an inbound
        `from_api_key` identity beside a method other than an API key, is logged as a warning at
        startup and refused on the next save; until then a caller verified by that other method
        is refused.
  fixed: []
  removed: []
  security: []
  breaking: []
