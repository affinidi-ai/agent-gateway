  removed: []
  security:
    - timestamp: '2026-11-03T14:00:00Z'
      title: Stop listeners with different IPv6 external URLs counting as one host
      description: >-
        An inbound listener passes /outbound/ requests on to an outbound listener whose external
        URLs share a host name with its own. The host was cut at the first colon, so every IPv6
        address URL looked like the same host, and an inbound listener could expose another
        address's Transit Points. Hosts are now parsed as URLs and an IPv6 address matches only
        the same address.
    - timestamp: '2026-11-03T13:50:00Z'
      title: Block cloud metadata and private IPv4 addresses inside 6to4 and NAT64 IPv6
      description: >-
        The SSRF checks on target, webhook, OAuth and JWKS URLs, and on the addresses their hosts
        resolve to, decoded only the IPv4-mapped form of an IPv6 address. A 6to4 (2002::/16) or
        NAT64 (64:ff9b::/96) address carrying a cloud metadata, loopback or RFC 1918 IPv4 address
        passed as a public one. Those forms are now checked as the IPv4 address they carry.
  breaking: []
