branch: feat/mediator-v0.33.1
changes:
  added: []
  changed:
    - timestamp: '2026-10-05T13:57:17.000Z'
      title: ⭐ Support DIDComm mediator v0.33.1 with the messaging SDK 0.30.1
      description: >-
        Upgrades affinidi-messaging-sdk 0.19 → 0.30.1, affinidi-messaging-didcomm 0.15.9,
        affinidi-tdk-common 0.6.11, affinidi-did-common 0.4.3, affinidi-did-resolver-cache-sdk
        0.8.39, trust-tasks-rs 0.24.8 and didwebvh-rs 0.7, the client side of mediator v0.33.1.
        The SDK signs each Trust Task sent to the mediator with a key it finds by resolving the
        Connection Point's own DID, and sends the task unsigned when that DID cannot be resolved,
        so a gateway whose DID lives on a private host needs `[did_cache] allow_private_hosts`.
        The ALLOW_ALL account ACL is built through the trust-tasks builder. The local, E2E and EC2
        mediator scripts run `public.ecr.aws/affinidi/messaging-mediator:v0.33.1`.
    - timestamp: '2026-10-05T13:57:17.000Z'
      title: Raise mediator queue capacity for local and E2E environments
      description: >-
        Local and end-to-end mediator configurations now allow up to 150 queued messages per
        peer, preventing higher-concurrency Fabric traffic from timing out.
    - timestamp: '2026-10-06T12:00:00.000Z'
      title: Use the messaging SDK's hash for DID resolver cache keys
      description: >-
        Resolver cache keys are now derived via the SDK's `hash_did` instead of a separate local
        implementation, so the two cannot drift apart. The direct `highway` dependency is dropped.
    - timestamp: '2026-10-06T12:00:00.000Z'
      title: Document DID resolution host policy and cache behavior
      description: >-
        The documentation now explains public-host restrictions, the opt-in private-host setting,
        per-method host rules, and mediator document caching.
  fixed:
    - timestamp: '2026-10-05T13:57:17.000Z'
      title: Restart the Connection Point when the mediator reports its account missing
      description: >-
        After a gateway ping timed out, the account probe's `e.p.account.not_found` problem
        report went back to the probe itself, never reached the listener, and the Connection
        Point stayed on a dead mediator session. The ping handler now restarts that Connection
        Point's listener so it re-authenticates and re-registers. It matches the exact code, and
        it restarts only the listener instance it probed, so concurrent pings do not tear down a
        session another one just restored. A stored mediator DID document is also cached before
        the messaging profile is built, so the profile finds its mediator at start.
    - timestamp: '2026-10-05T13:57:17.000Z'
      title: Refresh mediator functions after an EC2 redeploy
      description: >-
        EC2 mediator redeploys now refresh the bundled Redis functions before starting the
        mediator, so upgrades do not retain stale functions or report a degraded readiness state.
  removed: []
  security:
    - timestamp: '2026-10-06T12:00:00.000Z'
      title: Resolve did:web in VP and VC verification through the host-policy resolver
      description: >-
        Presentation and credential verification resolved `did:web` with a resolver that had no
        host policy and followed redirects, so a presentation naming a DID on a private host
        made the gateway fetch it. `did:web` now goes through the shared resolver, the same as
        `did:webvh`, and is refused on non-public hosts unless `[did_cache] allow_private_hosts`
        is on.
  breaking:
    - timestamp: '2026-10-05T13:57:17.000Z'
      title: ⭐ Refuse did:web and did:webvh on private hosts unless allow_private_hosts is on
      description: >-
        DID resolution now refuses a host that is, or resolves to, a loopback, private-network,
        carrier-grade NAT or link-local address, and does not follow redirects; each method also
        refuses some local names outright. This closes an SSRF path through attacker-supplied
        DIDs and applies to every resolver the gateway builds. A stored mediator document is
        served from cache only until the resolver's TTL expires, so a stack whose mediator or
        peer DIDs live on such hosts must set the startup-only
        `[did_cache] allow_private_hosts = true`, which logs a warning at startup and also
        reopens cloud metadata. `scripts/_prepare.sh` turns it on for local and Docker dev
        stacks, and the BDD configs turn it on too.
