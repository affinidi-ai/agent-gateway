branch: feat/mediator-v0.33.1
changes:
  added: []
  changed:
    - timestamp: '2026-10-05T13:57:17.000Z'
      title: ⭐ Support DIDComm mediator v0.33.1 with the messaging SDK 0.30.1
      description: >-
        Upgrades affinidi-messaging-sdk 0.19 → 0.30.1, affinidi-messaging-didcomm 0.15.9,
        affinidi-tdk-common 0.6.11, affinidi-did-common 0.4.3, affinidi-did-resolver-cache-sdk
        0.8.39, trust-tasks-rs 0.24.8 and didwebvh-rs 0.7, the client side of mediator v0.33.1.
        The SDK signs each Trust Task sent to the mediator with a key it finds by resolving the
        Connection Point's own DID, and sends the task unsigned when that DID cannot be resolved,
        so a gateway whose DID lives on a private host needs `[did_cache] allow_private_hosts`.
        The ALLOW_ALL account ACL is built through the trust-tasks builder. The local, E2E and EC2
        mediator scripts run `public.ecr.aws/affinidi/messaging-mediator:v0.33.1`.
  fixed:
    - timestamp: '2026-10-05T13:57:17.000Z'
      title: Restart the Connection Point when the mediator reports its account missing
      description: >-
        After a gateway ping timed out, the account probe's `e.p.account.not_found` problem
        report went back to the probe itself, never reached the listener, and the Connection
        Point stayed on a dead mediator session. The ping handler now restarts that Connection
        Point's listener so it re-authenticates and re-registers. It matches the exact code, and
        it restarts only the listener instance it probed, so concurrent pings do not tear down a
        session another one just restored. A stored mediator DID document is also cached before
        the messaging profile is built, so the profile finds its mediator at start.
  removed: []
  security:
    - timestamp: '2026-10-06T12:00:00.000Z'
      title: Resolve did:web in VP and VC verification through the host-policy resolver
      description: >-
        Presentation and credential verification resolved `did:web` with a resolver that had no
        host policy and followed redirects, so a presentation naming a DID on an internal host
        made the gateway fetch it. `did:web` now goes through the shared resolver, the same as
        `did:webvh`, and is refused on non-public hosts unless `[did_cache] allow_private_hosts`
        is on.
  breaking:
    - timestamp: '2026-10-05T13:57:17.000Z'
      title: ⭐ Refuse did:web and did:webvh on private hosts unless allow_private_hosts is on
      description: >-
        DID resolution now refuses a host that is, or resolves to, a loopback, private-network,
        carrier-grade NAT or link-local address, and does not follow redirects; each method also
        refuses some local names outright. This closes an SSRF path through attacker-supplied
        DIDs and applies to every resolver the gateway builds. A stored mediator document is
        served from cache only until the resolver's TTL expires, so a stack whose mediator or
        peer DIDs live on such hosts must set the startup-only
        `[did_cache] allow_private_hosts = true`, which logs a warning at startup and also
        reopens cloud metadata. `scripts/_prepare.sh` turns it on for local and Docker dev
        stacks, and the BDD configs turn it on too.
  internal:
    - timestamp: '2026-10-05T13:57:17.000Z'
      title: Refresh the mediator Lua functions from the image on every EC2 redeploy
      description: >-
        `scripts/mediator/user-data-v2.sh` keeps an existing mediator's DID and secrets on
        redeploy, and the mounted `conf/` directory hid the image's `atm-functions.lua`. A host
        upgraded to a newer mediator therefore loaded the old Redis functions, which left the
        per-peer queue limit inert and `/readyz` reporting `degraded`. The redeploy now copies
        the file from the image first, through a temporary file so a failed read leaves the
        existing copy in place.
    - timestamp: '2026-10-05T13:57:17.000Z'
      title: Raise the E2E and local mediators' per-peer queue cap to 150
      description: >-
        Mediator v0.27+ refuses a forward once one sender has 50 messages queued for one
        recipient, and a gateway keeps each fabric message queued until it has processed it, so
        the 50-request concurrency scenario timed out one request. `scripts/g2g-mediator.sh` and
        `make mediator-up` now set `queued_send_messages_per_peer = "150"`.
        `reconcile-mediator-config.sh` adds or replaces it under `[limits]` when
        `user-data-v2.sh` is given the cap. Both scripts rewrite `mediator.toml` in place, so
        Docker Desktop bind mounts do not serve the replaced copy. `docs/FABRIC.md` documents the
        cap for operators.
    - timestamp: '2026-10-06T12:00:00.000Z'
      title: Record why DID resolution uses the resolver's host policy
      description: >-
        `docs/POLICY.md` explains why DID fetches rely on the SDK's `HostPolicy` instead of
        `src/egress.rs`, the cloud-metadata trade-off of `allow_private_hosts` (also listed
        under Known limitations), the per-method host-name lists, and that a cached mediator
        document lasts only for the resolver TTL. `ARCHITECTURE.md`, `docs/FABRIC.md`,
        `docs/CONFIGURATION_REFERENCE.md` and the docker-compose deployment note point to it.
    - timestamp: '2026-10-06T12:00:00.000Z'
      title: Compute DID resolver cache keys with the SDK's hash_did
      description: >-
        DID documents seeded into a resolver cache are keyed with `DIDCacheClient::hash_did`
        instead of a local copy of the hash, so the key cannot drift from the SDK's. The direct
        `highway` dependency is dropped.
    - timestamp: '2026-10-05T13:57:17.000Z'
      title: Cover the DID host policy, ALLOW_ALL ACL and mediator recovery
      description: >-
        Adds unit tests for the `allow_private_hosts` default and parsing, for public-only
        resolvers (DIDComm and VP verification) refusing `did:web:localhost` while
        private-allowing ones do not, and for the ACL builder output. The recovery tests cover
        which probe outcomes restart the listener (only `e.p.account.not_found`, not a near-miss
        code, another report, a transport error or a probe timeout), that a listener another
        caller already replaced is not restarted, that a failed restart still reports the ping
        timeout, and that a supplied mediator document lets the profile find its mediator.
