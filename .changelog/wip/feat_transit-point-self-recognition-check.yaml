branch: feat/transit-point-self-recognition-check
changes:
  added:
    - timestamp: '2026-11-19T12:00:00Z'
      title: ⭐ Let Transit Point policy refuse a managed agent no longer recognised
      description: >-
        A Transit Point Trust Check element with subject managed_agent asks a trust registry
        whether it still recognises the managed agent calling out through the Transit Point,
        by the DID it calls out under, instead of the destination. Results reach policy at
        input.trust_check_results.managed_agent, so policy can refuse an agent whose
        recognition was turned off; MANAGED_AGENT_IDENTITY_UNAVAILABLE reports a request with
        no managed agent DID. Each query is audited as a trust_check on the managed_agent leg,
        which the Audit Log names and places before policy in the request journey.
    - timestamp: '2026-11-20T10:00:00Z'
      title: Keep managed-agent Trust Checks and VP injection across dashboard saves
      description: >-
        A Surface Builder save keeps a Transit Point Trust Check element's managed_agent
        subject and blank entity, and a Transit Point's stored identity_injection while
        inject_vp is on, so saving does not change what the check asks about.
