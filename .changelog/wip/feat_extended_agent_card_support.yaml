branch: feat/extended_agent_card_support
changes:
  added: []
  changed: []
  fixed: []
  removed: []
  security:
    - timestamp: '2026-10-12T10:00:00.000Z'
      title: Rewrite backend endpoint URLs in extended agent cards
      description: >-
        Extended agent cards on A2A and AP2 surfaces, returned by GetExtendedAgentCard and
        agent/getAuthenticatedExtendedCard or fetched with GET extendedAgentCard (1.0) or GET v1/card
        (0.3), now have their endpoint URLs rewritten to the gateway on inbound, fabric and outbound
        paths and get the same agent identity treatment as the public card, so callers no longer
        learn the backend address. An extended-card response the gateway cannot rewrite is answered
        with 502, and a JSON-RPC batch containing an extended-card request is rejected with -32600.
  breaking: []
  internal:
    - timestamp: '2026-10-12T15:00:00.000Z'
      title: Note test coverage of the extended agent card rewrite
      description: >-
        The JSON-RPC binding is covered by inbound and outbound component tests and BDD scenarios.
        The fabric path and the HTTP+JSON paths are covered only by unit tests of the shared helpers,
        because the harness has no fabric peer and HTTP+JSON component tests were left out of scope.
    - timestamp: '2026-10-12T10:30:00.000Z'
      title: Share one well-known agent card path check across proxy handlers
      description: >-
        Adds is_well_known_agent_card_path in src/proxy/paths.rs and uses it in the inbound,
        fabric and outbound handlers and in is_public_path, replacing duplicated suffix checks.
    - timestamp: '2026-10-12T11:00:00.000Z'
      title: Share extended agent card unwrap and rewrap between inbound and fabric
      description: >-
        Adds unwrap_extended_agent_card, rewrap_extended_agent_card and requests_extended_agent_card
        so the inbound and fabric response pipelines use one implementation, and the fabric path only
        parses the request method on A2A and AP2 surfaces.
    - timestamp: '2026-10-12T12:00:00.000Z'
      title: Pass an identity response kind instead of an agent card flag
      description: >-
        Replaces the is_agent_card flag on the identity resolvers with IdentityResponseKind
        (Message, PublicAgentCard, ExtendedAgentCard) so the anonymous short-circuit for
        from_jwt_claim applies to public cards only, and splits the inbound and fabric agent card
        flags into named well-known and extended card flags.
    - timestamp: '2026-10-12T13:00:00.000Z'
      title: Pick the identity response kind with one shared helper
      description: >-
        Adds IdentityResponseKind::for_response so the inbound and fabric pipelines choose the
        identity response kind the same way.
