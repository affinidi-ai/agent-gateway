branch: change-integration-ui
changes:
  added: []
  changed: []
  fixed: []
  removed:
    - timestamp: '2026-10-15T08:16:21.000Z'
      title: Remove the integration test, trigger, config and runtime-variables routes
      description: >-
        POST /v1/integrations/test, /v1/integrations/{id}/trigger and
        /v1/integrations/trigger-multiple, GET /v1/integrations/config and
        /v1/integrations/runtime-variables are gone; GET /v1/integrations/catalog lists the
        events, template variables and endpoint types instead.
  security:
    - timestamp: '2026-10-15T08:16:21.000Z'
      title: Never return integration endpoint credentials from the API
      description: >-
        SMTP passwords, Slack webhook URLs, webhook signing secrets and headers, and stream SASL
        passwords and Redis URLs are write-only: responses name the secrets set but never their
        values, so the user role's integrations.view no longer reveals credentials.
    - timestamp: '2026-10-15T08:16:21.000Z'
      title: Refuse tenant and resource-scoped tokens on the integrations API
      description: >-
        Integrations, endpoints and event sets belong to the whole appliance, so every
        /v1/integrations route answers 403 to a tenant or resource-scoped access token.
  breaking:
    - timestamp: '2026-10-15T08:16:21.000Z'
      title: ⭐ Manage integrations as an endpoint plus an event set
      description: >-
        /v1/integrations now keeps integrations that join one endpoint
        (/v1/integrations/endpoints: transport, destination, credentials) and one event set
        (/v1/integrations/event-sets: events picked from the whole catalog), with the template on
        the integration. Categories and tenant owners are gone, and audit.view is no longer
        needed to manage integrations that forward audit records.
  internal:
    - timestamp: '2026-10-14T09:03:25.000Z'
      title: Add one catalog of every event the gateway delivers to integrations
      description: >-
        Lists every delivered gateway, user, connection point message, x402, MPP and governance
        audit event with its family, audit group and the template variables each delivery
        fills, so integrations can pick events without categories.
    - timestamp: '2026-10-14T09:10:57.000Z'
      title: Store endpoints, event sets and integrations as separate definitions
      description: >-
        Adds the endpoint definition (transport, destination and credentials, whose secret
        fields are kept when an update leaves them out and are never read back), the event set
        (events picked from the catalog, refused when empty or unknown), the integration that
        joins one endpoint and one event set through its template, and a shared store that
        keeps one JSON file per definition and lists them newest first.
