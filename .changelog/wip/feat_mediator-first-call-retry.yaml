branch: feat/mediator-first-call-retry
changes:
  added:
    - timestamp: '2026-10-21T00:00:00.000Z'
      title: Retry the first call to a directory-listed mediator while its DID is refused
      description: For a mediator the mediator directory lists, which may admit a DID only after the directory's operator has registered it in response to the creation_started notification, when the first call of a new Connection Point to it is refused because it does not know the DID yet (an HTTP 403, an ACL denial, or the live connection not becoming active), the gateway repeats it with the same DID instead of failing at once. AG_MEDIATOR_DIRECTORY_FIRST_CALL_RETRY_ATTEMPTS (default 5, 0 to 20, 0 never repeats) and AG_MEDIATOR_DIRECTORY_FIRST_CALL_RETRY_DELAY_MS (default 2000) set the repeats and the wait, for directory-listed mediators only. A mediator the operator added, or one the directory no longer lists, is never retried and its refusal fails at once, and for an unlisted provided mediator the error says it is no longer offered by the directory. Only an HTTP 403, an ACL denial and the live connection failing to become active (which also covers an unreachable mediator) are repeated, other failures end creation immediately, cancellation stops the wait, the whole sequence is capped at 60 seconds, and after the last repeat creation fails as before. This lets a mediator that only admits known DIDs accept the DID once a receiver of the event hook has registered it. See docs/INTEGRATIONS.md.
    - timestamp: '2026-10-21T00:00:00.000Z'
      title: List extra mediators from an operator-configured mediator directory
      description: When AG_MEDIATOR_DIRECTORY_URL is set, the gateway reads a list of mediators from that endpoint with a signed GET (the same X-Webhook-Timestamp and X-Webhook-Signature-256 scheme and AG_EVENT_HOOK_SECRET as the event hook, https unless the host is loopback, redirects not followed) and shows them in GET /v1/mediators, GET /v1/mediators/compatible, the Create Connection Point wizard (which pre-selects the first one) and the Mediators page. The endpoint answers {"items":[{"did","name"}]}, other fields are ignored. An unavailable, slow or invalid directory leaves only the stored mediators listed; right after start the gateway asks again every 2 seconds for up to 30 seconds, allowing each of those requests 10 seconds, without making any request wait, and an expired list is served at once while one background task refreshes it. Creating a Connection Point on a directory entry stores a provided mediator record for it under an id fixed by the DID before the Connection Point's first event, so every event carries the final mediator id (the record stays and is reused if the creation then fails; the final check and save hold the record's lock, and a token scoped to directory ids can create on the entry repeatedly). A mediator the operator added for the same DID is a separate row and is never used for the entry, and the entry is always listed under its directory id. Creating on an entry needs no mediators.edit permission and does not count toward the mediator limit. Creating a Connection Point on a directory id before the directory has answered successfully answers 503 with a Retry-After header instead of 404. A stored provided record cannot be edited through the API (409) and can be deleted only once the directory has answered without its DID and no Connection Point uses it, which refreshes it; it follows the caller's mediator resource scope by its own id. The first-call retry also applies while the directory has not answered successfully yet, and each attempt is bounded by the 60 second cap. Mediator responses gain provided only when a directory is configured or a record was created from an entry. See docs/INTEGRATIONS.md.
