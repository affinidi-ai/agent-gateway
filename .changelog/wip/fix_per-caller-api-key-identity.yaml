branch: fix/per-caller-api-key-identity
changes:
  added: []
  changed:
    - timestamp: '2026-11-02T00:00:00Z'
      title: Label a Transit Point's managed identity resolve metrics with the surface name
      description: >-
        A Transit Point's outbound request labelled
        `agent_gateway_managed_identity_resolve_total` and its duration histogram with the
        surface ID, while every other path used the surface name. It now reports the surface
        name, so one surface counts under one `channel_id`. Update alerts and dashboards that
        filter these metrics by a Transit Point surface's ID.
  fixed:
    - timestamp: '2026-10-31T00:00:00Z'
      title: ⭐ Identify each caller by the API key it presents
      description: >-
        An inbound Identity set to From API Key derived every caller's DID from one
        operator-picked key, so all callers on a surface shared a DID. The caller DID now
        comes from the API key each request presents. An API Key Provider gives one DID per
        key, reported to policy as `source_auth`; a plain API Key gives one DID per secret,
        shared by everyone holding it and reported as `unverified`. A failed or revoked key
        resolves no caller identity. The inbound slot stores no key id; a stored one is
        ignored and dropped on save.
    - timestamp: '2026-10-31T00:00:00Z'
      title: Stop asking for an API key on the inbound Identity in the Surface Builder
      description: >-
        The inbound Identity's From API Key option shows "Each caller is identified by the API
        key it presents." instead of a key picker, and Save never sends an inbound key id. Save
        is blocked unless the first Caller Context method is API Key or API Key Provider. The
        protected and external Identities keep the key picker.
    - timestamp: '2026-11-02T00:00:00Z'
      title: Give concurrent first requests for one identity the same DID
      description: >-
        Concurrent first requests for an identity with no record could each mint a different
        DID. The identity record is now created only if none exists for its hash, under a lock
        on that record, so every concurrent first request gets the one stored DID.
  removed: []
  security:
    - timestamp: '2026-10-31T00:00:00Z'
      title: Refuse plain API Key secret ids that start with the reserved atgk_ prefix
      description: >-
        A plain API Key secret id starting `atgk_` would derive the same caller DID as the API
        Key Provider key with that id. Saving such a surface with an inbound From API Key
        Identity is refused with 400, and a stored one is refused at request time with 500.
    - timestamp: '2026-11-02T00:00:00Z'
      title: Make the presented API key's DID replace any body-asserted caller identity
      description: >-
        On a direct request to a surface whose inbound Identity is From API Key, the presented
        key's DID replaces any identity the request body asserts, so a key holder cannot choose
        another DID. `input.agent.did` and its verification are the key's DID, and a
        presentation or credential extension in the body no longer sets the caller DID, so
        policies naming the presentation's DID stop matching. When the body does not assert
        the key's own DID, or no caller identity resolves, the trust-registry claims it made
        (`provider_did`, `trust_registry_did`, `authority_did`, `identity_issuer_did`,
        `agent_dna` and trust verifications) are dropped, so Trust Check presets that read
        `input.agent.provider_did` deny. Gateway and global policy see no `input.agent.did`
        and none of those claims on these surfaces. Fabric receive does not read this mode; the request body sets the
        caller there.
  breaking:
    - timestamp: '2026-11-02T00:00:00Z'
      title: Fail closed when an inbound From API Key caller does not use an API key
      description: >-
        An inbound From API Key Identity behind caller authentication that is not API Key or
        API Key Provider returns 500 with a fixed body (metric `api_key_unavailable`). Saving
        it, on the surface or an enabled variant, is refused with 400, as is combining it with
        `mcp_http.authorization`. A missing VC issuer returns 500 and an issuance failure 502.
        When an API key identity record has no role and the role cannot be recorded, the
        request returns 503 (metric `identity_origin_unavailable`) on the caller path, the
        Managed Agent fallback, the Managed Agent's response and a Transit Point's outbound
        request. Find affected surfaces through `agent_gateway_managed_identity_resolve_total`
        with `mode="from_api_key"` and `result` `api_key_unavailable`.
    - timestamp: '2026-10-31T00:00:00Z'
      title: Give each API key its own DID, so rules tied to the shared DID stop matching
      description: >-
        Callers on an API Key Provider surface no longer share the configured key's DID. Policies,
        Trust Check entries and Transit Point OAuth grants tied to that DID now match only the
        key it belongs to, and the Transit token `sub` and Workload Binding `userIdentity.id`
        are per key. On a plain API Key surface whose stored inbound key id differed from the
        Caller Context secret id, callers now get that secret's DID instead of the stored
        key's, and the stored id is dropped on save. Re-grant or update rules for the affected
        keys.
    - timestamp: '2026-11-02T00:00:00Z'
      title: Refuse one API key identifying both a Managed Agent and a caller
      description: >-
        A caller could otherwise share a Managed Agent's DID and the trust attached to it.
        Save refuses with 400 a surface that names one key in both roles, such as a Managed
        Agent `api_key_id` equal to the external Identity's key or the plain API Key secret
        id. An API key's identity record keeps the role it was first used in, and whichever
        role resolves the key second, on any surface, gets 500 (metric `role_clash`), on the
        caller path and the Managed Agent paths alike. To recover, issue a new API key for the
        refused role. When a surface still stores an inbound key id that is also its Managed
        Agent or a Transit Point key, the Managed Agent takes over that key's caller record, or
        its record with no role, once, keeping its DID, at request time or when the surface is
        saved or reassigned, provided no other surface has used the record (metric
        `legacy_role_restamped`). When another surface has used it, the save or reassignment
        answers 200 with a `Warning` header naming the key id and telling the operator to
        issue a new API key for the Managed Agent or Transit Point. A request returns 503
        (metric `identity_origin_unavailable`) when the identity store fails during the takeover, and a save or reassignment returns
        503 and keeps the stored id when the identity or secrets store fails during it. Find
        affected surfaces through
        `agent_gateway_managed_identity_resolve_total` with `mode="from_api_key"` and `result`
        `role_clash`.
    - timestamp: '2026-10-31T00:00:00Z'
      title: Refuse From API Key on an MCP proxy:// surface when it is saved again
      description: >-
        The MCP Proxy request path never resolves the caller's key, so saving an MCP surface
        with a `proxy://` target and an inbound From API Key Identity is refused with 400. A
        stored surface keeps loading but cannot be saved until its inbound Identity changes.
    - timestamp: '2026-10-31T00:00:00Z'
      title: Drop downgrade support for surfaces saved without an inbound key id
      description: >-
        A surface saved with an inbound From API Key Identity has no stored key id, which
        older binaries require, so they skip it at load. Downgrading after re-saving such a
        surface is not supported.
