branch: feat/policy-input-logging
changes:
  added:
    - timestamp: '2026-11-12T00:00:00Z'
      title: ⭐ Capture a surface's OPA policy input live while a dashboard user listens
      description: >-
        A dashboard WebSocket connection can listen to one surface's policy input with a
        capture_policy_input message and stop with stop_capturing_policy_input. While at least one
        connection listens, each request and response policy evaluation on that surface (gateway,
        surface, Transit Point and appliance-wide planes, on the direct, Fabric and MCP proxy paths)
        is serialized once and queued for the listening connections only (up to 64 per connection,
        then dropped for that connection, which is told how many it missed), never through the
        shared dashboard broadcast, as a
        policy_input_captured update with its input,
        the id, name and version of each policy definition the slot evaluated, the member that denied
        a gateway or appliance-wide set (or failed to evaluate, on an appliance-wide plane), and its
        allow, deny reason or error. Answers and captures are sent alongside the shared dashboard
        updates without waiting behind them, and captures queued before a stop, or by an earlier
        listen of the same surface, are not sent. The gateway policy of
        an outbound request shows as its own gateway outbound slot. A listen naming a surface id
        that is empty, over 256 bytes or holds a control character is refused. Credential-named values, JWTs and Bearer or Basic values
        are masked first, also inside longer text, and an SD-JWT with its disclosures (a Bearer token of at least 12 token characters,
        or 6 with a digit or symbol, and a Basic token that decodes to user:password; message text
        such as "Basic authentication" is kept), and every query value in the request path and in
        any absolute URL is redacted, as are the user name and password in any absolute URL. Listening needs surfaces.edit and policies.edit, is checked again on each
        keep-alive ping before any queued capture is sent (captures still queued when access is
        lost are discarded), and ends when the connection closes. Nothing is logged or stored, and the
        surface configuration is not changed. Policy authors can see the input structure again
        without the gateway logging it. See docs/POLICY.md.
    - timestamp: '2026-11-12T00:00:00Z'
      title: Show captured policy input and decisions live in a surface's Capture view
      description: >-
        The Surface Builder's Capture view has a Policy Input card with a Listen to policy input
        button for users with both surfaces.edit and policies.edit. While listening, the card lists
        each policy evaluation with its slot, the name and version of the policy it ran, its
        decision and reason, and shows or copies its input to
        try in the policy Test panel. Stopping, leaving the view or reloading the page ends
        listening. It keeps the last 50 evaluations with a filter by policy slot, says when it is
        waiting for the dashboard connection, and says that a multi-node appliance shows only this
        node's requests. It warns how many evaluations were not shown when the surface sent them
        faster than the dashboard could receive them. On a surface with no policy yet, it says a
        request policy must be added before there is anything to capture. It is for developing and
        testing policies only.
  changed:
    - timestamp: '2026-11-17T00:00:00Z'
      title: Close a dashboard connection whose client stops reading for 10 seconds
      description: >-
        A dashboard WebSocket message the client has not read within 10 seconds now closes the
        connection, and the page reconnects. A client that stopped reading used to keep its
        connection open indefinitely and hold back the keep-alive checks of its session and
        permissions. A stop answer it does not read at a keep-alive check ends the connection at
        once, without a further wait for the ping.
  fixed:
    - timestamp: '2026-11-13T00:00:00Z'
      title: Keep surface ids whole in redacted logs so their Monitoring log shows them
      description: >-
        Log redaction no longer masks part of a UUID. A broad rule such as the example phone
        number pattern turned ids like bf983d36-0281-4579-... into bf983d[REDACTED-PHONE], so the
        [CHANNEL:<id>] prefix no longer matched and that surface's Monitoring log stayed empty. A
        rule that matches a whole UUID still masks it.
    - timestamp: '2026-11-16T00:00:00Z'
      title: Keep a dashboard connected when it falls behind the live update stream
      description: >-
        A dashboard WebSocket connection that fell more than websocket_broadcast_buffer updates
        behind was closed, and the page showed its reconnect dialog. It now skips the updates it
        missed and keeps reading; only a closed update channel ends it. At its next keep-alive it
        is sent one refresh_dashboard, however often it fell behind, so the page reloads its
        dashboard stats. A burst of dashboard updates no longer forces a slow connection to
        reconnect.
  removed: []
  security: []
  breaking: []
