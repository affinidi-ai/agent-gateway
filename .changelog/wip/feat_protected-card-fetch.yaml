branch: feat/protected-card-fetch
changes:
  added: []
  changed:
    - timestamp: '2026-11-03T12:00:00Z'
      title: Answer 502 Target authentication failed on Fabric and MCP proxy paths
      description: >-
        When the Target credential cannot be resolved and the fallback is reject, the Fabric
        receiving gateway and the MCP proxy path now answer 502 with the text Target
        authentication failed, the same text as the direct path, instead of Target
        authentication configuration error. The sending gateway's agent card route passes that
        text, and Upstream redirected, on to its caller instead of Upstream error: 502 Bad
        Gateway. Clients that match the old text must match the new one.
    - timestamp: '2026-11-03T12:30:00Z'
      title: Skip the sending gateway's surface policy for every public discovery read
      description: >-
        The sending gateway of a Fabric route now skips its surface policy for a GET or HEAD of
        any public discovery path, as the direct path does: paths ending in agent-card.json,
        agent.json, .well-known/agent-card, .well-known/ucp or discovery. A policy that denied
        such reads on the sending gateway no longer applies to them.
  fixed:
    - timestamp: '2026-11-02T11:45:42Z'
      title: Fetch agent cards over Fabric with the direct path's header and failure rules
      description: >-
        On a Fabric route with Target authentication, the receiving gateway's agent card fetch,
        a GET of exactly /.well-known/agent-card.json or the configured card location, now
        follows the direct path's header, body and failure rules. It is a new GET with no body
        that carries the Target credential and keeps only Accept, Accept-Language and User-Agent
        from the peer, with no delegated credential, transit token or trace id. Its answer
        reaches the peer with only the headers that describe the card. A redirect answers 502
        Upstream redirected, as on the direct path, and any other refusal only its status.
        Without Target authentication the fetch is still forwarded as the peer sent it and a
        Target redirect is relayed. Any other public read, a HEAD of the card path or the legacy
        agent.json included, is forwarded without the credential. A GET at the configured card
        location is the card fetch after source authentication, including for a caller who
        failed it on a public Access Point; an Access Point that refuses failed callers, such
        as a closed or legacy one, answers it 401.
    - timestamp: '2026-11-06T08:40:35Z'
      title: Read the agent card for a Fabric surface's policy with its Target credential
      description: >-
        The receiving gateway of a Fabric route now presents the surface's Target credential when
        it reads the agent card for the surface policy's input. Under fallback passthrough a
        credential that cannot be resolved reads the card without it, a provider token the Target
        refuses as invalid_token is dropped as on the forward, and a Target that is not an http or
        https URL has no card read and no credential resolved. The outcome is cached per surface
        and Target authentication for up to 60 seconds, so a variant with its own Target
        authentication reads its own card.
  removed: []
  security:
    - timestamp: '2026-11-02T13:54:10Z'
      title: Run the surface policy on a POST to an agent card path over Fabric
      description: >-
        The sending gateway of a Fabric route skipped its surface policy for any request whose
        path ended in agent.json or agent-card.json, whatever the method, so a POST to such a
        path passed unevaluated. It now skips the policy only for a GET or HEAD of a public
        discovery path. Unchanged, on the direct path and the sending gateway a request of any
        method to a path ending in .well-known/agent-card.json or .well-known/agent.json is
        answered by the gateway's own agent card fetch, a GET to the Target, before policy, so
        it never reaches the Target as sent.
    - timestamp: '2026-11-06T10:00:00Z'
      title: Redact the agent card url in the receiving gateway's card read log
      description: >-
        When the receiving gateway of a Fabric route reads its Target's agent card for the policy
        input, the success log now shows the card's url without userinfo or query values and the
        card's name escaped, as the card location is already logged, so a credential in the
        card's url no longer reaches the logs.
  breaking: []
