branch: feat/provider-resource-in-token-requests
changes:
  added:
    - timestamp: '2026-11-11T10:00:00Z'
      title: Let an external consent provider leave resource out of its token requests
      description: >-
        An external consent provider takes a new `send_resource` setting, `true` by default.
        Created with `false`, its authorization code exchange and every refresh of its grants
        send no `resource` parameter to the token endpoint, so a token endpoint that refuses it,
        such as the Microsoft identity platform v2.0 one, can still issue grants. Its tokens then
        carry no RFC 8707 audience binding, their audience following the scopes alone, so it is
        meant only for such a token endpoint. The provider's `resource` stays required and still
        decides the only origin its grants are sent to. The setting is fixed for the provider's
        life: an update that sends another value is refused with `provider_field_immutable`, and
        a provider without an issuer cannot turn it off. The dashboard no longer warns about an
        Entra v2.0 resource for an external consent provider that leaves it out, and tells one
        that sends it to be re-created with `send_resource` set to false.
  changed: []
  fixed: []
  removed: []
  security: []
  breaking: []
