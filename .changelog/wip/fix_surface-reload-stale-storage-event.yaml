  fixed:
    - timestamp: '2026-10-23T10:00:00Z'
      title: Keep the surface a configuration reload stored instead of an older copy
      description: >-
        A configuration reload re-reads Agent Surfaces from disk, and each surface that changed is
        then applied again as a single-surface change. That change could run while the reload was
        still applying its own, so a surface edited by hand and reloaded could keep serving the A2A
        versions it had before the reload carried its settings over. Explicit reloads, the reload a
        node runs when it becomes Active, API surface changes and changes from storage are now
        applied one at a time, and a change from storage applies the surface as currently stored,
        with its carried-over A2A settings. This also removes an intermittent component test
        failure.
