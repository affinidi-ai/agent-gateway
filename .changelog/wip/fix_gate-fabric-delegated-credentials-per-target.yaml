branch: fix/gate-fabric-delegated-credentials-per-target
changes:
  added:
    - timestamp: '2026-10-09T13:30:00.000Z'
      title: Add a switch to send delegated credentials over Fabric per route
      description: >-
        The Surface Builder's Managed Agent and Transit Point panels show a **Send delegated
        credentials over Fabric** switch for a `fabric://` route on a surface with credential
        bindings. It sets that route's `fabric_delegated_credentials`, defaults to off, and when
        on warns that the caller's access token is sent to the named receiving gateway. Saving a
        surface keeps the setting.
    - timestamp: '2026-10-09T15:00:00.000Z'
      title: Log when a Fabric route withholds delegated credentials
      description: >-
        When `fabric_delegated_credentials` is off on a `fabric://` Target or Transit Point with
        credential bindings, the gateway logs `Delegated credentials withheld from Fabric peer` at
        debug level with the surface id, the route and the reason, without credential values, so
        a missing token at the peer can be traced to the switch.
  changed: []
  fixed: []
  removed: []
  security:
    - timestamp: '2026-10-09T08:44:16.000Z'
      title: ⭐ Require a per-route opt-in before delegated credentials cross Fabric
      description: >-
        A surface with `outbound_credentials` sent the caller's delegated access token to a
        `fabric://` peer with no separate control: on modern MCP requests through its Target, and
        on modern and legacy requests through a `fabric://` Transit Point. The token now crosses
        only when that Target or Transit Point sets `fabric_delegated_credentials: true`, and only
        for that route. With the setting off, the caller's own token is still stripped and the
        peer gets no delegated credential. The refresh token never crosses Fabric. A Target
        variant can override the setting, and a `complete` variant that omits it turns it off. A
        Transit Point that relies only on its own `transit_credentials` is gated the same way.
    - timestamp: '2026-10-09T15:00:00.000Z'
      title: Stop Transit Points from sending another Transit Point's credentials
      description: >-
        On a surface without `outbound_credentials`, a request through one Transit Point picked up
        the `transit_credentials` of every Transit Point on the surface, so a token meant for one
        destination could reach another. A Transit Point now uses only its own
        `transit_credentials`. This also changes `https` Transit Points, which previously received
        the other Transit Points' tokens too.
    - timestamp: '2026-10-09T15:00:00.000Z'
      title: Send no delegated credential when a Transit Point variant fails to resolve
      description: >-
        A legacy request whose Transit Point variant cannot be resolved still falls back to the
        base surface, but no longer carries a delegated credential, so a broken variant cannot
        send the base surface's tokens to a destination the variant did not intend.
  breaking:
    - timestamp: '2026-10-09T08:44:16.000Z'
      title: Stop sending delegated credentials over Fabric unless the route opts in
      description: >-
        After upgrade, `fabric://` Targets and Transit Points on surfaces with
        `outbound_credentials` stop sending delegated access tokens to the peer, because the new
        `fabric_delegated_credentials` setting defaults to off and no migration turns it on. Turn
        the setting on for each Target or Transit Point whose peer relies on receiving the token,
        including `fabric://` Transit Points that rely only on their own `transit_credentials`.
        Transit Points on surfaces without `outbound_credentials` also stop receiving other Transit
        Points' `transit_credentials`; give each one its own binding if it needs a token.
  internal:
    - timestamp: '2026-10-09T08:44:16.000Z'
      title: Test the Fabric delegated-credential opt-in and refresh-token isolation
      description: >-
        Tests cover the Access Point send-leg gate (off by default, on for one Target only, off
        without bindings), variant overrides of the setting, Transit Point modern and legacy
        injection with the setting off, on, and on a non-Fabric destination, and that a Fabric
        send preparation carries the access token in a header or `_meta` field but never the
        refresh token. Dashboard tests cover keeping the setting across a save, and when the switch
        shows, its default, the value it writes and the warning. Further tests drive the Access
        Point Fabric send leg for two surfaces on the same peer gateway, where only the opted-in
        one reaches delegation, set a Transit Point's setting through a
        variant `points` override, and cover per-Transit-Point credential scoping and variant
        resolution failure. The Transit Point switch now needs a named credential provider.
