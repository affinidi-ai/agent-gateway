branch: fix/ftl-29583-transit-point-secret-picker
changes:
  added: []
  changed: []
  fixed:
    - timestamp: '2026-11-06T09:51:49Z'
      title: Pick a Transit Point's target authentication secret from a list
      description: >-
        Bearer Token, API Key Header and Custom Header target authentication on a Transit
        Point asked for the secret's ID in a free-text box whose placeholder suggested a name,
        so a typed name or a typo failed on save with "Secret reference is not accessible". The
        field is now a Secret Reference dropdown of the surface's tenant's secrets, shown as name and ID,
        with a refresh button beside it to reload the list after adding a secret in another tab,
        and an Add secret link below. A stored secret that no longer exists stays visible as not
        found with a warning, an out-of-tenant one is explained below the field, and a list that
        cannot load says so, telling a user without access to secrets to ask an administrator.
    - timestamp: '2026-11-06T09:51:49Z'
      title: Block a Transit Point save whose static-secret target auth has no secret
      description: >-
        Saving a Transit Point with Bearer Token, API Key Header or Custom Header target
        authentication and no secret silently dropped its target authentication, so requests
        went to the destination without a credential. Save is now blocked, with "Pick the secret
        whose value authenticates this Transit Point." under the field, as a Credential Provider
        option without a provider already was.
  removed: []
  security: []
  breaking: []
