branch: fix/dashboard-laptop-layout
changes:
  added: []
  changed: []
  fixed:
    - timestamp: '2026-10-21T14:29:18Z'
      title: Stack the Audit Log list above its details on smaller laptop screens
      description: >-
        Below 1440px wide the Audit Log now shows the event list above the event details and
        the page scrolls as one, instead of two cramped side-by-side panels with short scroll
        boxes; selecting an event scrolls to its details. On wider screens the two panels fill
        the page height without the page scrolling past the footer, and the event details use
        the full height next to the About banner.
    - timestamp: '2026-10-21T17:30:00Z'
      title: Keep long tags and owner names from stretching list tables
      description: >-
        Long tags on surfaces, secrets and certificates, and long owner names on MCP proxies,
        now wrap inside their table cell instead of widening the column. The lists no longer
        scroll sideways on laptop screens, the Name and Description columns keep their
        width, and every row action stays on screen.
    - timestamp: '2026-10-21T16:02:23Z'
      title: Fit Identities, Connection Points, Credential Audit, Metrics, Tasks on laptops
      description: >-
        The Identities table no longer scrolls sideways at 1280px wide, so every row action stays
        reachable. Connection Points show their four actions in a compact block, and Credential
        Audit gives its Downstream Provider and Agent Surface columns room, so names no longer
        wrap into tall rows. A long identity in the Metrics flow chart is cut to 22 characters
        plus "..." like the source and target labels, so it no longer runs over its neighbours;
        hover shows the full identity. On Tasks the tag filter sits under the title and Refresh
        stays at the right end of the header.
  removed: []
  security: []
  breaking: []
