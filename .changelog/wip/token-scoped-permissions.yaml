branch: token-scoped-permissions
changes:
  added: []
  changed:
    - timestamp: '2026-10-06T00:00:00.000Z'
      title: Document token-scoped permissions
      description: Updates the RBAC guide with personal access token scope behavior for permissions and JWT verification strategy routes.
  fixed:
    - timestamp: '2026-10-06T00:00:00.000Z'
      title: Limit /api/v1/permissions for access tokens to the token's own scopes
      description: A personal access token now sees only the features its scopes grant, capped by its owner's role, instead of the full role. The response is also sent with no-store and Vary Authorization, Cookie so it is not cached across credentials.
  removed: []
  security:
    - timestamp: '2026-10-07T00:00:00.000Z'
      title: Enforce access-token scopes on the JWT verification strategy routes
      description: The /api/v1/jwt-verification-strategies routes (list, get, create, update, delete and validate-jwks-uri) now also require the matching jwt_verification_strategies feature in a scoped personal access token's scopes, instead of checking only the owner's role. Session logins and tokens without feature scopes are unchanged.
  breaking: []
