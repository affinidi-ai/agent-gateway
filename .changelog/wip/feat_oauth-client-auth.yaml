branch: feat/oauth-client-auth
changes:
  added:
    - timestamp: '2026-11-25T00:34:00Z'
      title: Let client secret credential providers authenticate with HTTP Basic
      description: >-
        An oauth2_client_credentials provider, or an oauth2_authorization_code provider without an
        issuer, can now set client_authentication to client_secret_basic, and then sends its client
        ID and secret by HTTP Basic, each form-urlencoded as RFC 6749 section 2.3.1 requires, on
        the client credentials grant, the code exchange and every refresh. RFC 6749 requires
        token endpoints to accept HTTP Basic and some accept nothing else, so such a provider got
        401 invalid_client before. Unset, or client_secret_post, keeps sending them in the form
        body, so stored providers work as before. The dashboard offers Form body (default) and
        HTTP Basic for these types, and the provider list badges the choice.
  changed:
    - timestamp: '2026-11-25T00:35:00Z'
      title: Explain when a signed assertion's audience must be the issuer
      description: >-
        The credential provider editor's Audience help and the credential delegation docs now say
        that an empty audience means the token endpoint, which Google, Entra and Ory Hydra accept,
        and that an authorization server following RFC 7523bis wants its issuer identifier there
        instead. The default is unchanged, so providers that work today keep their audience.
  fixed:
    - timestamp: '2026-11-25T00:16:00Z'
      title: Accept ES256 for credential providers that sign a client assertion
      description: >-
        The admin API and the dashboard now accept ES256 as the signing algorithm of an
        oauth2_client_credentials_jwt_auth provider and of an external consent provider whose client
        authenticates with private_key_jwt, beside PS256 and RS256. The gateway already signed such
        assertions correctly when a stored record named ES256, so the save rule now matches what
        the gateway does. The key is still checked on save, and an ES256 provider whose key is not
        an EC P-256 key is refused.
  removed: []
  security: []
  breaking: []
