branch: UX-fixes---badges-and-empty-states
changes:
  added: []
  changed:
    - timestamp: '2024-11-24T15:30:00Z'
      title: Remove count badges from dashboard pages
      description: Removed count badges from Credentials (STS Clients tab), Policies (Gateway and Surface Policies tabs), JWT Verification Strategies, Access Tokens (PAT), Payments, Proxies page, and Payment Gateway detail surfaces section. These count badges appeared next to page titles and were displaying the number of items in each section.
    - timestamp: '2024-11-24T16:45:00Z'
      title: Remove duplicate CTA from STS Clients empty state
      description: Removed the duplicate "Add your first STS client" button from the STS Clients empty state. The "Add STS Client" button in the header is now the only CTA, following the design pattern used in other empty states like Agents and Surfaces.
    - timestamp: '2024-11-24T17:00:00Z'
      title: Keep indication when payment list is capped at 500 rows
      description: Added a truncation notice on the Payments page when the ledger response contains more than 500 matching payments. The notice informs operators that only the newest 500 payments are shown and that older matching payments were not searched, preventing silent failures when searching for older payments.
  fixed:
    - timestamp: '2024-11-24T17:15:00Z'
      title: Update Agents page browser tests for removed controls
      description: Removed references to deleted count badge test IDs from the Agents browser tests and updated the empty-state test to use the new Add Surface button instead of the removed link, ensuring all tests now work with the redesigned UI.
  removed: []
  security: []
  breaking: []
