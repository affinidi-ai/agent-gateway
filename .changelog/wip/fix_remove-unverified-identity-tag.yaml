branch: fix/remove-unverified-identity-tag
changes:
  added: []
  changed:
    - timestamp: '2026-10-21T00:00:00.000Z'
      title: Remove the "unverified" badge from Agent Card names in Identities
      description: >-
        The Identities page no longer shows an "unverified" badge beside a caller's
        Agent Card name or a managed agent's target Agent Card name. The names are
        still self-asserted and are still never signed into the identity VC or
        published to Trust Recorder context or trust registries. Verified agent names
        keep their verified marker.
  fixed: []
  removed: []
  security:
    - timestamp: '2026-10-21T00:00:00.000Z'
      title: Update TLS certificate dependencies in Cargo.lock
      description: >-
        Bumps rustls-webpki to 0.103.16 (could accept distrusted intermediates,
        rustls/webpki#546), and webpki-roots and webpki-root-certs to 1.0.10
        (bundled roots trusted distrusted emSign intermediates,
        rustls/webpki-roots#133). Fixes the failing Rust dependency audit.
  breaking: []
