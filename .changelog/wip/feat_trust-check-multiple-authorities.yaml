branch: feat/trust-check-multiple-authorities
changes:
  added:
    - timestamp: '2026-11-12T00:00:00Z'
      title: ⭐ Let one Trust Check query list several authorities
      description: >-
        A Trust Check query can list several authorities in query.authority_ids instead of one
        authority_id. The gateway queries every listed authority in parallel, waits for each to answer or time out
        (a built-in 5 seconds per authority; timeout_secs is refused on such a query), and gives
        policy one result per authority under the element's id, so a surface can accept callers
        that any participating organisation recognises. Gateway 1.0.9 and earlier skips any
        surface or managed connection with a Trust Check that sets query.authority_ids, even a
        list of one, so change such queries to a single authority_id before rolling back.
    - timestamp: '2026-11-12T00:00:00Z'
      title: Link each authority a Trust Check lists to the Authorities register
      description: >-
        Saving a surface or managed connection records, per DID in query.authority_ids, whether
        it was picked from the Authorities register (authority_sources), as it does for
        authority_id, refuses authority_sources on a query without query.authority_ids or with a
        DID the list does not hold, and refuses authority_source on a query with the list. A listed Authority that no longer exists fails only its own result with
        AUTHORITY_NOT_FOUND without querying its registry, while the other authorities are queried,
        and deleting an Authority that a Trust Check lists is refused naming that Trust Check.
    - timestamp: '2026-11-12T00:00:00Z'
      title: Pick several Authorities for one Trust Check query in the dashboard
      description: >-
        In the Trust Check editor, a query's Authority ID is one multi-select of the
        Issuers and Authorities, plus on the caller leg the agent identity credential issuer and the
        sending gateway DID, and keeps the picks in the order picked. On the caller leg the
        agent identity credential issuer is checked while nothing is picked, and the first pick
        replaces it; it stays only when ticked beside other picks. The editor's card header
        shows how many authorities a query with several names. A query with several saves
        query.authority_ids with authority_sources recording the register each was picked from; a
        query with one keeps authority_id as before. A listed Authority that was deleted blocks
        Save, as a single one does.
  changed:
    - timestamp: '2026-11-13T00:00:00Z'
      title: Remove the 10-query limit on a Trust Check list
      description: >-
        A Trust Check list is no longer refused for holding more than 10 queries, and there is no
        limit on the authorities its queries name. The gateway sends one TRQP query per listed
        authority, all at once, so each one adds a DIDComm message to the trust registry on every
        request. The Queries badge in the dashboard shows the number of queries. Gateway
        1.0.9 and earlier still loads and runs a list of more than 10 queries, but refuses
        to save that surface or managed connection (400) until the list is trimmed to 10.
    - timestamp: '2026-11-12T00:00:00Z'
      title: Fail a Trust Check whose authority resolves to a blank value
      description: >-
        A Trust Check whose query.authority_id template resolves to a blank value now fails with
        TEMPLATE_RESOLUTION_FAILED without querying its trust registry, instead of sending a query
        with no authority.
    - timestamp: '2026-11-13T00:00:00Z'
      title: List Trust Check queries by number and record type in the sidebar
      description: >-
        The Trust Check sidebar lists each query as Query N with its record type, without its
        name.
  fixed:
    - timestamp: '2026-11-13T00:00:00Z'
      title: Keep a trust registry connected when it answers a timed-out query late
      description: >-
        The gateway remembered only the latest 256 timed-out query threads of a registry, so when
        many queries timed out, a late problem report to an older one was taken as the registry
        rejecting the gateway and marked the connection Failed, breaking every surface using that
        registry until it was reconnected by hand. Every request the gateway sends now carries a
        recognisable thread id, and a late problem report on one is logged and ignored however many
        queries timed out before it.
  removed: []
  security:
    - timestamp: '2026-11-13T00:00:00Z'
      title: Update quinn-udp to 0.5.16 to fix a QUIC receive-loop spin advisory
      description: >-
        Bumps the transitive quinn-udp dependency from 0.5.14 to 0.5.16, which fixes
        RUSTSEC-2026-0538, where the UDP receive loop could spin after a truncated datagram
        (affects quinn-udp below 0.5.16). Restores a passing cargo audit.
  breaking: []
