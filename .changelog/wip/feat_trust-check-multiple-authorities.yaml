branch: feat/trust-check-multiple-authorities
changes:
  added:
    - timestamp: '2026-11-12T00:00:00Z'
      title: ⭐ Let one Trust Check query list several authorities
      description: >-
        A Trust Check query can list up to 25 authorities in query.authority_ids instead of one
        authority_id. The gateway queries every listed authority in parallel, waits for each to
        answer or time out (a built-in 5 seconds per authority; timeout_secs is refused on such a
        query), and gives policy
        one result per authority under the element's id, so a surface can accept callers that any
        participating organisation recognises. The dashboard keeps such a list when it saves a
        surface but cannot edit it yet.
  changed: []
  fixed: []
  removed: []
  security: []
  breaking: []
