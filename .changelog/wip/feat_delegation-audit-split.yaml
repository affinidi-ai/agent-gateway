branch: feat/delegation-audit-split
changes:
  added: []
  changed:
    - timestamp: '2026-11-16T15:00:00Z'
      title: Confirm a revoke-all with a danger button that says how many it ends
      description: >-
        On the Credential Tokens tab, the first click on a user's revoke-all now turns it into a
        danger button that says how many of that user's delegations the second click ends, such
        as "Revoke all 2 for this user?". It used to be small amber text that was hard to read and
        gave no count.
  fixed:
    - timestamp: '2026-11-16T15:10:00Z'
      title: Say that token refresh stops when a provider's consent time limit ends
      description: >-
        The help under "Enable automatic token refresh" on an Authorization Code provider said the
        connection keeps working without reauthorizing, which a consent time limit contradicts.
        It now says tokens are refreshed until the consent time limit ends, and that the person
        then approves again. Other provider types keep the old help.
    - timestamp: '2026-11-16T15:20:00Z'
      title: Show a refused consent time limit under its field and move focus there
      description: >-
        A consent time limit outside 1 minute to 365 days was reported only in the banner at the
        top of the provider form, far from the field, which was not marked invalid. The field is
        now marked invalid for assistive technology too, says "Enter a limit from 1 minute to 365
        days, or leave it empty." under itself and takes the focus; the banner stays as a
        summary.
  removed: []
  security: []
  breaking: []
