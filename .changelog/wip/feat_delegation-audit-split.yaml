branch: feat/delegation-audit-split
changes:
  added:
    - timestamp: '2026-11-16T15:30:00Z'
      title: Warn how many active consents a shorter consent time limit ends
      description: >-
        When an admin shortens a stored provider's consent time limit, or sets one where none
        was, the provider form now asks the gateway how many active consents saving would end
        and, when that is at least one, says so under the field, naming the provider, for example
        "Saving ends 2 active GitHub consents now". It asks once the field has stopped changing,
        and shows nothing when no consent ends or the gateway cannot say.
  changed:
    - timestamp: '2026-11-16T15:00:00Z'
      title: Confirm a revoke-all with a danger button that says how many it ends
      description: >-
        On the Credential Tokens tab, the first click on a user's revoke-all now turns it into a
        danger button that says how many of that user's delegations the second click ends, such
        as "Revoke all 2 for this user?". It used to be small amber text that was hard to read and
        gave no count.
    - timestamp: '2026-11-16T15:40:00Z'
      title: Revoke delegated access with a text button whose confirm names it
      description: >-
        Delegated Access now revokes with a "Revoke" text button instead of a bin icon. Its first
        click turns it into a danger button that names what it ends, such as "Revoke Salesforce
        access?", with a Cancel beside it; the second click revokes. It still confirms in place,
        with no dialog.
    - timestamp: '2026-11-16T15:50:00Z'
      title: Show an agent by its whole did:web host name on the credential tabs
      description: >-
        Delegated Access and Credential Tokens cut an agent's DID in the middle, which hid the
        agent's name. A did:web agent now shows its whole web address, such as
        "pr-reviewer.example.com", without "did:web:" and wrapping when long; other DID methods
        stay shortened, and the full DID is in the tooltip. Credential Tokens also revokes one
        delegation with the same "Revoke" text button and named confirm as Delegated Access.
    - timestamp: '2026-11-16T16:00:00Z'
      title: Show each consent's limit, and when an access token renews by itself
      description: >-
        Delegated Access now shows, between the time left and the end date, the limit the consent
        was given under, such as "6-hour limit", so "in 39 minutes" has context. On Credential
        Tokens the "Token Expires" column is now "Access Token" and says "Renews automatically"
        under the date while the provider refreshes tokens and the consent has not ended, so it no
        longer reads as a second end date.
    - timestamp: '2026-11-16T16:10:00Z'
      title: Show a credential provider's status in its own column
      description: >-
        The Credential Providers list has a Status column with an "Active" badge, or a
        "Deactivated" badge with "No new consent" under it, instead of a "Deactivated" badge in
        the Type column. Deactivate and Activate now share one outline button style, so the
        Status column, not the button, carries the colour.
    - timestamp: '2026-11-16T16:20:00Z'
      title: Offer minutes, hours and days for a consent time limit, not seconds
      description: >-
        The provider form's consent time limit unit menu no longer offers seconds, since the
        shortest limit is one minute. A stored limit that is not a whole number of minutes, which
        only the API can set, still loads in seconds and saves unchanged.
  fixed:
    - timestamp: '2026-11-16T15:10:00Z'
      title: Say that token refresh stops when a provider's consent time limit ends
      description: >-
        The help under "Enable automatic token refresh" on an Authorization Code provider said the
        connection keeps working without reauthorizing, which a consent time limit contradicts.
        It now says tokens are refreshed until the consent time limit ends, and that the person
        then approves again. Other provider types keep the old help.
    - timestamp: '2026-11-16T15:20:00Z'
      title: Show a refused consent time limit under its field and move focus there
      description: >-
        A consent time limit outside 1 minute to 365 days was reported only in the banner at the
        top of the provider form, far from the field, which was not marked invalid. The field is
        now marked invalid for assistive technology too, says "Enter a limit from 1 minute to 365
        days, or leave it empty." under itself and takes the focus; the banner stays as a
        summary.
  removed: []
  security: []
  breaking: []
