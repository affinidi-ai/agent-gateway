branch: fix/api-key-retype-refresh
changes:
  added: []
  changed: []
  fixed: []
  removed: []
  security:
    - timestamp: '2026-11-25T00:11:10Z'
      title: Refresh a legacy grant only through the provider the request checked
      description: >-
        A legacy binding read its credential provider a second time before refreshing an
        expired grant and sent the client ID, client secret and the person's refresh token to
        whatever that second read held, with no type check. A provider retyped to api_key
        meanwhile, with an http token endpoint, received them in warn mode. The refresh now
        uses the provider the request read and checked, as the 2026-07-28 and verified consent
        refreshes already do.
    - timestamp: '2026-11-25T00:11:10Z'
      title: Store no token endpoint or client references on an API key provider
      description: >-
        An api_key provider sends nothing to a token endpoint, yet a create or update kept a
        token endpoint and client ID and secret references on one, and a retype to api_key kept
        the stored ones while skipping the https token endpoint rule. A create or update of an
        api_key provider now drops them, so no later read of the provider finds a client to send.
  breaking: []
