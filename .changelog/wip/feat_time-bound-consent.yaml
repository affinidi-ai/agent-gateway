branch: feat/time-bound-consent
changes:
  added:
    - timestamp: '2026-11-12T12:00:00Z'
      title: ⭐ End a delegated consent at a configurable time limit
      description: >-
        A person's consent to a credential provider can now have an end. `max_consent_age_secs`
        on an `oauth2_authorization_code` credential provider limits every consent given to it,
        the same field on a binding (`outbound_credentials[]`, a Transit Point's
        `transit_credentials`) limits the consents used through that binding, and
        `[credential_policy]` in config.toml takes `default_max_consent_age_secs`, for providers
        that set none, and `max_consent_age_ceiling_secs`, which no limit reaches past. Each is
        from 60 seconds to 365 days. The end is fixed when the person consents and stored with
        the credential, so a shortened limit also ends older consents and a lengthened one never
        extends a consent already given. From its end a credential is never injected and never
        refreshed, even when the vendor would still refresh it: the gateway removes it, records
        `consent_expired`, which is not a revocation, and answers the existing `consent_required`
        or `connect_required` with the reason, so the person is asked again. A binding with a
        shorter limit than the consent it finds asks again with `consent_too_old` and leaves the
        credential for other bindings. The consent start page, the elicitation message and the
        `consent_required` entries say how long the new consent lasts. Without a limit nothing
        changes, and revocation works as before.
    - timestamp: '2026-11-13T09:00:00Z'
      title: Remove ended consents hourly and show when a consent ends
      description: >-
        A consent past its time limit is now removed even when no request needs it again. Once
        an hour, while the node is active, the gateway deletes every ended agent-keyed token and
        every ended grant by binding, revokes those grants at the vendor, and records each as
        `consent_expired` with `source:sweep`, so a refresh token does not stay in the vault
        long after its consent ended. `GET /api/v1/delegation-vault`, `GET
        /api/v1/delegation-vault/{id}` and the grants report now show `consent_expires_at`, the
        end as the limits set now make it, and a `DelegationCredential` issued for a consent
        under a time limit carries it as `validUntil`.
    - timestamp: '2026-11-13T12:00:00Z'
      title: Set a provider's consent time limit in the dashboard
      description: >-
        The credential provider editor has a Consent time limit field on Authorization Code
        providers, external consent ones included: a number and a unit, empty for no limit, from
        one minute to 365 days. The Surface Builder now shows a binding's own limit, which is set
        through the API, and keeps it when the surface is saved, so a dashboard save never
        removes it.
    - timestamp: '2026-11-13T16:00:00Z'
      title: Add a Delegated Access tab that lists active delegated access
      description: >-
        The Credentials page has a Delegated Access tab beside Credential Tokens. It lists only
        the access a person gave that an agent can still use: the user, the system, the agent,
        the scopes, whether it ends within a day, when it ends and when it was last used, with a
        revoke confirmed by a second click. Service tokens, ended consents and tokens that can
        no longer be refreshed are left out, and a History button opens the Credential Delegation
        Audit tab, where ended and revoked access is recorded.
  changed:
    - timestamp: '2026-11-13T15:00:00Z'
      title: Show when each consent ends on the Credential Tokens tab
      description: >-
        Each entry of the Credentials page's Credential Tokens tab shows when its consent ends
        and how long is left, or that it has no time limit, and is marked Ending soon within a
        day of its end and Consent ended after it. Revoking every delegation of a user is
        confirmed in place with a second click instead of a browser dialog, the expanded row
        links to that user's records in the Credential Delegation Audit tab, and that tab labels
        `consent_expired` records.
    - timestamp: '2026-11-13T17:00:00Z'
      title: Name whose access a vault revoke ended in its audit record
      description: >-
        The `token_revoked` audit record of `DELETE /api/v1/delegation-vault/{id}` now names the
        agent, the user identity hash, the credential provider and the scopes of the entry that
        was revoked, beside who revoked it. Before, it carried only the entry's id, so a search of
        the delegation audit for a user did not find the revokes of that user's access.
  fixed: []
  removed: []
  security: []
  breaking: []
