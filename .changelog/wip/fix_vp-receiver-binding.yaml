branch: fix/vp-receiver-binding
changes:
  added: []
  changed:
    - timestamp: '2026-11-26T15:20:00Z'
      title: Name the receiver in the domain of every agent presentation the gateway signs
      description: >-
        Every agent Verifiable Presentation the gateway signs now names its receiver in the proof's
        `domain`: the peer's Connection Point DID on a Fabric request, the requesting peer's on a
        Fabric answer, and the origin of the Target or Transit Point destination it is sent to. A
        presentation sent to no verifying receiver (a direct answer to a caller, a consent audit
        record, a request to one of the gateway's own MCP Proxies) carries a reserved
        `urn:agent-gateway:label:` value instead. The agent card presentation stays without a
        domain.
    - timestamp: '2026-11-27T12:00:00Z'
      title: Sign a new agent presentation for every retry the gateway sends to a Target
      description: >-
        When the gateway retries a request to a Target after a 5xx answer or a dropped connection,
        each retry now carries a newly signed agent Verifiable Presentation, signed after the
        backoff wait, instead of the one sent first. A retry whose presentation cannot be signed is
        not sent, and the caller gets the previous attempt's answer. Each presentation sent is
        recorded as `vp_injected`. On a `fabric://` Transit Point the peer gateway is looked up once,
        so the presentation names the gateway the request is sent to.
  fixed: []
  removed: []
  security:
    - timestamp: '2026-11-26T14:10:00Z'
      title: Cap an agent presentation's lifetime at five minutes when verifying it
      description: >-
        The gateway refuses an agent Verifiable Presentation whose proof expires more than five
        minutes and 120 seconds from now, or whose proof was created more than 120 seconds ahead
        of the gateway's clock. A proof with no expiry expires five minutes after it was created.
  breaking: []
