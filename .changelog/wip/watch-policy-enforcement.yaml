branch: watch-policy-enforcement
changes:
  added:
    - timestamp: '2026-10-16T16:00:00Z'
      title: Stamp every audit record with the id of the gateway request that produced it
      description: >-
        Audit records now carry a `request_id` (16 lowercase hex characters) minted when an
        Access Point, Transit Point or fabric-received request starts. All records of one
        request share it, so a sink such as Agent Watch can count requests rather than policy
        evaluations; `trace_id` still links the requests of one chain.
  changed:
    - timestamp: '2026-10-16T16:01:00Z'
      title: Name the surface and the policy on every policy decision record
      description: >-
        Policy decision records left `channel_name` empty and `policy_name` empty unless the
        call site passed one. They now carry the surface name in `channel_name` beside the
        surface UUID, and always name the policy: the definition name, else the definition id,
        else a label for the layer, such as "Gateway policy" or "MCP tool gating".
    - timestamp: '2026-10-27T16:00:00Z'
      title: Audit every change to a policy and to where a policy applies
      description: >-
        Seven new governance audit events in the Policies group record who changed a policy
        definition (`policy_created`, `policy_updated`, `policy_deleted`), where a policy was
        added or removed on a surface, variant, gateway or appliance-wide plane
        (`policy_attached`, `policy_detached`), a switch between enforced and monitor-only or
        enabled and disabled (`policy_attachment_changed`), and a refused change
        (`policy_change_refused`). Records name the actor by id only and never carry Rego text.
  fixed:
    - timestamp: '2026-10-27T16:01:00Z'
      title: Recompile surfaces that use an edited definition as an MCP tool policy
      description: >-
        Editing a policy definition recompiled the surfaces referencing it as a target,
        inbound, response or transit policy, but not those using it only as an MCP tool policy
        or an MCP tool gate condition. Those surfaces kept the old version until their next
        save; they are now recompiled with the others.
  removed: []
  security: []
  breaking: []
