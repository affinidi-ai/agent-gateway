branch: fix-user-integration
changes:
  added: []
  changed: []
  fixed: []
  removed: []
  security:
    - timestamp: '2026-10-08T15:10:00.000Z'
      title: Refuse integration API requests when no RBAC guard is mounted
      description: The /v1/integrations routes were served without any permission check when the router was built without an RBAC guard, while neighbouring admin routes refused such requests. They now fail closed with 403. Deployments always mount the guard, so this is hardening against a future wiring change.
    - timestamp: '2026-10-08T14:30:00.000Z'
      title: ⭐ Validate user and identity integration mappings before saving them
      description: PUT /v1/users/integrations and /v1/identities/integrations saved any payload. They now refuse tenant and resource-scoped tokens (403), unknown, tenant-owned, audit or wrong-category integrations, unknown or missing event types, duplicate or excess entries, non-custom or oversized variables and unknown fields (400), and log each accepted change. The routes refuse every request when mounted without an RBAC guard.
    - timestamp: '2026-10-08T14:31:00.000Z'
      title: Skip tenant-owned integrations when sending appliance-wide user events
      description: User events describe every user on the appliance, so an integration owned by a tenant no longer receives them, even if a stored trigger configuration names it.
    - timestamp: '2026-10-08T14:32:00.000Z'
      title: Fill integration template placeholders in a single pass
      description: A substituted value was scanned again for placeholders, so a self-chosen username such as ${_TOKEN} could pull an operator's custom variable into the message. Values are now inserted literally.
    - timestamp: '2026-10-08T12:40:00.000Z'
      title: ⭐ Stop sending passkeys and profile details in user integration events
      description: User events (created, approved, updated, deleted, login, accessed) put the whole user record into OLD_STATE and NEW_STATE, including passkey credentials, the SAML subject, email, names, department, job title and avatar path. They now carry only user_id, role, status, is_primary, created_at and updated_at, and trigger logs name the user by id instead of username.
  breaking: []
  internal:
    - timestamp: '2026-10-08T12:20:00.000Z'
      title: Set rotation fields on the scoped PAT component test token
      description: The scoped-token helper in the access-token component tests built an AccessToken without the rotation fields added with token rotation, so the test binary did not compile.
