branch: fix/sts-token-verification-hardening
changes:
  added: []
  changed:
    - timestamp: '2026-11-03T13:30:00Z'
      title: Count callers behind an unlisted load balancer as one STS throttle source
      description: >-
        The STS token endpoint throttle, on by default, now takes the caller's address from the
        connection, and from X-Forwarded-For only when the connecting peer is in
        client_ip.trusted_proxies, which is empty by default. Behind a load balancer that is not
        listed there, every caller it forwards shares one source, so a burst of failed client
        logins through it locks every STS client out for lockout_secs. List the balancer in
        client_ip.trusted_proxies; a lockout of a caller no trusted proxy forwarded logs a
        warning saying so.
  fixed: []
  removed: []
  security:
    - timestamp: '2026-11-03T10:32:45Z'
      title: Verify STS subject tokens only with the client tenant's JWT strategies
      description: >-
        The token endpoint verified a JWT subject token, actor token or jwt-bearer assertion
        with the first JWT verification strategy of any tenant whose expected issuer matched,
        so a tenant could register another tenant's issuer with its own keys and have its
        tokens accepted for that issuer. It now uses the authenticated client's tenant's
        strategies for the issuer, or the appliance-global ones when the tenant has none, and an
        appliance-global client uses only appliance-global strategies. The jwt-bearer grant now
        authenticates the client before it verifies the assertion, so a bad client is refused
        with invalid_client before any assertion is checked.
    - timestamp: '2026-11-03T10:32:45Z'
      title: Stop spoofed forwarded headers from steering the STS throttle and discovery
      description: >-
        The token endpoint throttle keyed its source on the first X-Forwarded-For entry and
        counted a client id across every source, so a caller could pick its own source and lock
        a known client id out everywhere. It now uses the client IP resolved through
        client_ip.trusted_proxies, counts an IPv6 address by its /64, and counts a client id
        separately for each source, so the per_client limit applies per client and source and
        no longer bounds guessing one client's secret from many sources; give each client a
        long random secret. STS discovery now reads X-Forwarded-Host and X-Forwarded-Proto, or
        Forwarded, only from a peer in client_ip.trusted_proxies when no inbound external_urls
        is set.
    - timestamp: '2026-11-03T10:32:45Z'
      title: Refuse an Ed25519 JWK whose public key is not 32 bytes
      description: >-
        A JWT verification strategy's OKP key went to the EdDSA verifier without a length check,
        and a token whose header named EdDSA against a key with a short or empty x made the
        verifier panic, failing the request. The key must now decode to exactly 32 bytes, and a
        key whose crv names a curve other than Ed25519 is refused too, both as an invalid token.
  breaking: []
