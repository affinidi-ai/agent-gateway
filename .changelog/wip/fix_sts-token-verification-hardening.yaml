branch: fix/sts-token-verification-hardening
changes:
  added: []
  changed: []
  fixed:
    - timestamp: '2026-11-03T10:32:45Z'
      title: Cap the expiry of STS access tokens and ID-JAGs instead of overflowing
      description: >-
        The STS computed a token's exp as issued-at plus lifetime with unchecked addition, which
        panics in a build with overflow checks and wraps around otherwise. It now saturates at
        the largest value, so exp can never land before iat. The inputs are the gateway clock and
        a configured lifetime, so callers could not reach this.
  removed: []
  security:
    - timestamp: '2026-11-03T10:32:45Z'
      title: Stop spoofed forwarded headers from steering the STS throttle and discovery
      description: >-
        The token endpoint throttle keyed its source on the first X-Forwarded-For entry and
        counted a client id across every source, so a caller could pick its own source and lock
        a known client id out everywhere. It now uses the client IP resolved through
        client_ip.trusted_proxies and counts a client id separately for each source, so the
        per_client limit applies per client and source. STS discovery now reads
        X-Forwarded-Host and X-Forwarded-Proto, or Forwarded, only from a peer in
        client_ip.trusted_proxies when no inbound external_urls is set. Behind a load balancer,
        list it in client_ip.trusted_proxies.
    - timestamp: '2026-11-03T10:32:45Z'
      title: Refuse an Ed25519 JWK whose public key is not 32 bytes
      description: >-
        A JWT verification strategy's OKP key went to the EdDSA verifier without a length check,
        and a token whose header named EdDSA against a key with a short or empty x made the
        verifier panic, failing the request. The key must now decode to exactly 32 bytes, and any
        other key is refused as an invalid token.
  breaking: []
