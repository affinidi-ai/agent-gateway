branch: feat/identity-source-method
changes:
  added:
    - timestamp: '2026-11-11T17:10:00Z'
      title: Choose which Caller Context method supplies the inbound identity
      description: >-
        A surface with several Caller Context methods can now derive its inbound From JWT Claims or
        From API Key identity from one named method, so a surface can mix JWT and API key methods.
        The Identity panel offers an Identity source method select that lists the methods the
        identity can read, selects the first beside methods it cannot all read, and offers Any JWT
        Bearer method or Any API key method while every method is of its kind. The gateway saves a
        named method as identity_slots.inbound_source_method, the id of a Caller Context method,
        and refuses a caller authenticated by any other method with 401 before policy, on a
        public Access Point too. A surface without a named method keeps today's rules.
