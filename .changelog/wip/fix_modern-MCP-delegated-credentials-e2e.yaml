  internal:
    - timestamp: '2026-10-13T00:00:00.000Z'
      title: Test modern MCP delegated credentials end to end between two gateways
      description: >-
        New `make gw-e2e` scenarios run a `2026-07-28` `tools/call` through a `fabric://` Access
        Point Target with `fabric_delegated_credentials`. With the setting on, the caller is asked
        for consent before the peer gateway receives a Fabric forward. After consent, the retry
        delivers the delegated access token to the peer's MCP server as a bearer token, without the
        refresh token or the caller's own token, after exactly one provider token request. A consent
        callback with an altered `state` is rejected before any token exchange; a retry afterwards
        still gets `input_required` and reaches nothing, and a new tool call can still complete
        consent. When the setting is
        turned off after a consented call, no consent is requested and the peer's MCP server
        receives neither an `Authorization` header, the stored access token nor the caller's token.
        With the setting off and nothing stored, no consent is requested either. The leak checks
        also scan the request URL, and a failed metrics read now fails the Fabric forward check
        instead of counting as zero. The g2g harness gains a local OpenID provider, gateway configuration
        for protected continuations, the STS MCP issuer, an STS client and a consent identity
        strategy, and caller token exchange before the Fabric route probe. `docs/MCP_METADATA.md`
        and `docs/FABRIC.md` now state what these scenarios verify.
    - timestamp: '2026-10-13T12:00:00.000Z'
      title: Fix the Fabric receive test's count of requests reaching the Target
      description: >-
        `fabric_mcp_requests_are_validated_on_receive` still expected 6 Target requests after a
        request blocked by source auth, although earlier cases had since raised the count to 8.
        It now checks that the blocked request leaves the count unchanged.
