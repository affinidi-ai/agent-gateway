  security:
    - timestamp: '2026-11-12T08:47:25Z'
      title: Refuse a client secret newly given to a stored http OAuth provider
      description: >-
        In warn mode a stored credential provider keeps a plain http token endpoint that
        insecure_token_endpoints does not list, and an update that makes it start sending a client
        secret is refused. That check read only a JWT Bearer provider's client authentication, so an
        oauth2_client_credentials or oauth2_authorization_code provider stored without a client
        secret reference (a gateway before 1.0.8 let an update clear it) could be given one and
        then sent it in clear text with every token request. That update is now refused with
        "token_endpoint must be an https URL". The check now judges what each provider type sends:
        a provider sends a client secret only when it holds the reference and its type sends it,
        which for a JWT Bearer provider means a client authentication that uses a secret. Moving
        the endpoint to https in the same update, or listing it in insecure_token_endpoints, still
        allows the update, and so does pointing a reference the provider already holds at another
        secret. The dashboard's warning on an http token endpoint now names this exception.
  breaking: []
