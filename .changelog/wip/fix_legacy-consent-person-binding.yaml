branch: fix/legacy-consent-person-binding
changes:
  added:
    - timestamp: '2026-11-11T14:00:00Z'
      title: Set consent confirmation in the dashboard's credential provider editor
      description: >-
        The credential provider editor of a legacy authorization code provider now has a Consent
        confirmation switch with the login client ID and client secret, both picked from the
        secrets store, the authorization and token endpoints, JWT verification strategy and
        optional ID-token principal claim, offering only strategies the provider's tenant can use,
        and shows the Confirmation redirect URI to register at the identity provider. Saving sends
        the setting while the switch is on and clears a stored one when it is switched off.
  changed: []
  fixed: []
  removed: []
  security:
    - timestamp: '2026-11-11T12:00:00Z'
      title: ⭐ Confirm the caller at their identity provider before legacy consent
      description: >-
        A legacy authorization code credential provider can now carry a consent_confirmation
        setting that names a login client at the callers' identity provider, whose client ID and
        secret are both read from the secrets store in the provider's own tenant, and the JWT
        verification strategy that identifies them. When a JWT caller whose issuer and principal
        claim are that strategy's opens a consent link, the gateway first signs them in at the identity provider, verifies
        the ID token and checks that it names the same person the link was issued to, and only
        then continues to the vendor. Another person is refused with 403 before the vendor is
        reached. Saving the setting checks the provider type, the strategy and its tenant, both
        endpoints, the client ID and secret, the confirmation redirect URI, the principal claim and the
        identity hash pepper. A JWT verification strategy that a provider's consent_confirmation
        or consent_identity_strategy_id names can no longer be deleted (409). Providers
        without the setting, API key callers, and Transit and Fabric consent behave as before.
  breaking: []
