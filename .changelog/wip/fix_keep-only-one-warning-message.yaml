branch: fix/keep-only-one-warning-message
changes:
  added: []
  changed:
    - timestamp: '2026-11-26T13:00:00Z'
      title: Give every dashboard notification the same close button
      description: >-
        Success, warning, error and loading notifications now close with the same ×
        button as the "Changes discarded." notification, at the end of the message row,
        instead of one pinned to the top-right corner, so all notifications look alike.
        A long message wraps beside it, so the button stays inside the notification.
    - timestamp: '2026-11-26T14:00:00Z'
      title: Show a countdown bar on the notification after a surface save
      description: >-
        The notification after saving or creating a surface without warnings is laid
        out like the "Changes discarded." notification, with a countdown bar, so a save
        looks the same whether or not it drew warnings. It still closes after 3 seconds,
        and shows the saved message without the "Success!" heading. The "Changes
        discarded." notification and the save notifications are now announced to screen
        readers.
  fixed:
    - timestamp: '2026-11-26T12:00:00Z'
      title: Show a surface save's warnings once, in the save toast
      description: >-
        Saving or creating a surface that drew warnings showed them twice: in the
        "The last save drew a warning" banner above the canvas and in the save toast.
        The banner is gone, and the save toast is the one place they are listed. It is
        laid out like the "Changes discarded." toast, with a countdown bar, and closes
        after 10 seconds, as before, unless Keep open is pressed, which moves focus to its
        close button and keeps it until it is closed, the next save shows its toast, or
        the surface page leaves that surface; a create with only the dashboard's own
        warnings returns to the surface list, where a kept toast stays until it is closed
        or the next save. A later notification, such as a blocked Save's, is then shown
        below it instead of replacing it, and scrolls if the screen is too short. Screen
        readers announce it, as they did the banner, and its icon uses the text-safe
        colour so it keeps its contrast in both themes. A Transit Point a warning names
        still shows it in its own panel.
  removed: []
  security: []
  breaking: []
