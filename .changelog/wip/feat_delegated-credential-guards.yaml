branch: feat/delegated-credential-guards
changes:
  added: []
  changed:
    - timestamp: '2026-11-26T09:00:00Z'
      title: Parse an MCP proxy's OpenAPI spec once rather than on every tool call
      description: >-
        Each MCP proxy's spec is parsed once and the parsed catalog kept while the proxy's id,
        base URL and spec stay the same, so a tool call and the base path check before it
        share one parse; a proxy whose base URL or spec changed is parsed again.
  fixed:
    - timestamp: '2026-11-06T04:20:00Z'
      title: Warn once for an A2A proxy request that sends no backend credential
      description: >-
        An A2A proxy request whose Direct Line credential is withheld because
        credential_policy.target_source_auth is enforce logs one warning per request, the
        gateway's "Withholding the A2A proxy backend credential" line naming the rule. The A2A
        proxy runtime no longer warns that the caller was not authenticated, which was wrong for
        an authenticated caller a rule withholds the credential from; it logs that it sends no
        credential at debug.
    - timestamp: '2026-11-06T03:28:47Z'
      title: Correct which Fabric receive requests reach an A2A proxy before delegation
      description: >-
        The credential delegation reference now says that only an A2A or AP2 surface's
        a2a-proxy:// Target is handed to the A2A proxy on Fabric receive before delegated
        credentials apply; on an MCP or HTTP surface it is treated as any other non-HTTP Target.
  removed: []
  security:
    - timestamp: '2026-11-06T05:00:00Z'
      title: Never send a delegated credential in MCP _meta to a traffic mirror
      description: >-
        On the direct path a surface's traffic mirror received the request body after delegated
        credentials were injected into MCP _meta, so a person's or a service grant reached the
        mirror endpoint. The mirrored copy now leaves out the _meta fields delegated credentials
        go into, even when the caller set them, also for a legacy proxy:// MCP tool call on the
        direct path or received over Fabric, where it also leaves out the fields the sending
        gateway names as delegated, the empty name included; custom metadata, DID identity and
        the identity binding VP stay in the body. A list of named fields the receiving gateway
        cannot read whole (not an array, a non-string entry, or more than 256 entries) is never
        cut short: the mirror then gets no _meta at all and a Legacy SSE fallback checks its
        session endpoint. Mirrored headers already left out the Target credential and every
        header named like a credential header.
    - timestamp: '2026-11-06T03:28:47Z'
      title: Keep a delegated credential under the Target base path on every leg
      description: >-
        A request that would carry a person's or a service grant from a delegated credential
        binding outside the Target base path, for example {route}/%2e%2e/admin, is now refused
        with 400 target_path_refused on the direct path, Fabric send (2026-07-28 MCP), Fabric
        receive (including grants released to a partner's requests) and Transit Points, as the
        Target credential already was. It is recorded in the VP Audit Log as request_rejected at
        forward with reason target_path_refused, or as target_auth_failed when the leg also has
        a Target credential. On the direct path, Fabric receive and Transit Points, for legacy
        and 2026-07-28 requests alike, and on Fabric send for 2026-07-28 requests, the check
        runs before anything is read from the vault, a token is requested or consent is
        started; before, the Target credential's own check ran only after the delegation was
        prepared. A tool call to an MCP proxy is checked against the REST URL its path arguments
        build before any of that happens: a 2026-07-28 call on the direct path and Fabric
        receive, a legacy call before its Target credential is resolved, and a call through a
        Transit Point's MCP Proxy before its external-consent grant is read. A Transit Point
        checks its external-consent binding the same way, and a proxy whose spec cannot be
        parsed is refused there before any credential is resolved. A proxy:// Target whose MCP
        proxy cannot be loaded, or belongs to another tenant, is refused before any grant is read
        or consent is started, on the direct path, Fabric receive and Transit Points, with the
        answer the call would have got without delegation. A Legacy SSE fallback posts a
        request carrying a delegated credential in _meta, including one a sending gateway names
        in delegated_meta_fields over Fabric, only to a session endpoint the Target advertises
        under its base path, checked as soon as it is advertised and before the session is
        initialized. The configured agent card location outside the base path takes only the
        Target credential: a request routed there for another path, such as a direct GET of
        {route}/.well-known/not-a-card, is refused when a delegated credential binding applies.
        A credential in a header or in _meta is held alike, and a request that carries no
        delegated credential, such as a 2026-07-28 tools/list against a binding scoped to
        tools, is not refused. Previously only the Target credential and external-consent
        grants were checked.
        Upgrade note: on a surface with delegated credential bindings, a request whose path
        climbs out of the Target base path now gets 400 instead of reaching the Target. The
        refusal comes before payment, so on a paid surface such a request gets 400 instead of a
        402 challenge. On Fabric receive it also comes before the caller deadline check, so an
        elapsed deadline no longer answers 504 first. A Target whose Legacy SSE server
        advertises its message endpoint outside the Target base path, such as a root
        /messages?sessionId=... for a Target of https://host/mcp, now refuses a fallback request
        that carries a delegated credential in _meta with 400 target_path_refused; set the
        Target endpoint to the base path both share, such as https://host, to keep it working.
  breaking: []
