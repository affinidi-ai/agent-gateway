branch: feat/fabric-caller-principal
changes:
  added:
    - timestamp: '2026-10-30T15:00:00.000Z'
      title: Name the caller the receiving surface verified in a partner's transit token
      description: >-
        A transit token issued for a request a paired gateway sent over Fabric named only the
        peer gateway. When the receiving surface's own `source_auth` or Resource Server token
        verified a credential on that request, normally the one the peer's `target_auth`
        presents, the token now carries that caller's identity hash as
        `fabric.principal_hash`, the value the Access Point would put in `user_identity_hash`
        for the same credential, and the claims of a verified JWT that the surface's Transit
        Points allowlist as `caller_context_fields`. A caller DID, presentation or payload
        identity the peer sends never becomes the principal. A Transit Point policy sees such a
        caller as `fabric_peer` with `verified: true` and that `user_identity_hash`, so a rule
        that admits a verified caller by its hash also admits it when it arrives over Fabric;
        add `not input.transit.caller.fabric` to keep out partner requests that carry the
        transit token issued for them, on a Transit Point that requires it. `verified` covers
        the hash only, never the DID the peer named, so match the caller by its hash, never by
        `did`. Its audit records
        name it with `auth_method: fabric_verified`, its identity hash as `user_identity_hash`
        and the claims the receiving surface verified, with the peer as `peer_gateway` and no
        `iss`, ahead of a caller the Transit Point verified itself, as a verified Access Point
        token is; a caller the receiving surface did not verify is `fabric_asserted`, with
        `peer_gateway` too. The caller DID a presentation carried (`fabric.caller_did`) stays
        unverified and never names that caller. The principal is nested under `fabric`, so a
        release that does not read it sees no principal.
    - timestamp: '2026-10-30T15:00:00.000Z'
      title: Release delegated credentials to partner callers on Transit Points that opt in
      description: >-
        A Transit Point refused, with `403`, every call carrying a transit token issued for a
        request that arrived over Fabric when a delegated credential binding applied. A Transit
        Point that sets the new `delegated_credentials_for_fabric_callers: true` now releases
        the grant of the caller in the token's `fabric.principal_hash`, and only that caller's;
        the caller DID the peer named never keys a grant. It is off by default, and only a
        Transit Point that requires the transit token may set it: the admin API refuses one
        that does not with `400`. Set it only when the receiving surface verifies a per-user
        credential, such as a JWT whose `sub` is the end user: when it verifies the partner's
        own key, one grant serves every request the partner sends, for all of its users. The
        Transit Point also needs a managed identity, and a save of one that sets the switch
        without one answers with a `Warning` header, since a binding there refuses every Fabric
        caller. A `PUT` of the surface or of a variant that omits the switch keeps the stored
        value while the Transit Point requires the transit token, since the Surface Builder does
        not show it. It has an effect only on a Transit Point that also sets
        `allow_fabric_callers`. Without it, or when the receiving surface verified no caller,
        the call is refused as before and the log gives the reason. The token decides the
        caller, as any transit token does, so a client the Transit Point's own `source_auth`
        verified on the same call keys no grant, and without the switch such a call is refused
        rather than served with that client's grant.
  changed: []
  fixed: []
  removed: []
  security:
    - timestamp: '2026-11-02T03:00:00.000Z'
      title: Key a partner's delegated credentials only by the caller this gateway verified
      description: >-
        On Fabric receive, the receiving gateway keyed its Target's delegated credentials by the
        caller identity the peer's request named, a payload pseudonym, a DID or a presentation's
        DID, ahead of the caller its own source authentication verified, so a paired gateway
        could name another caller and have that caller's stored grant sent to the Target. A
        partner's claim about who it acts for no longer selects stored credentials: the grant is
        keyed only by the caller the receiving surface verified, a request it verified no caller
        for is refused with `403` when a binding applies (an agent card or discovery read, which
        releases no credential, is served as before), and on a `2026-07-28` MCP request the
        agent half of the key is a caller DID only a connection issuer's presentation proved.
        Grants stored under a caller the peer named are no longer looked up.
    - timestamp: '2026-11-02T03:00:00.000Z'
      title: Refuse a partner's modern MCP Transit Point call the opt-in does not cover
      description: >-
        A `2026-07-28` MCP Transit Point call keyed delegated credentials by the Transit Point's
        resource-token caller even when it carried a Fabric-issued transit token, so with
        `delegated_credentials_for_fabric_callers` off, or with another caller verified on the
        partner's request, it was served with the resource-token caller's grant. It now follows
        the Fabric rule: a binding that applies refuses the call with `403` unless the Transit
        Point opts in and its resource-token caller is the one the receiving surface verified.
  breaking: []
