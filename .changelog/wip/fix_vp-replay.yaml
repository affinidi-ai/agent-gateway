branch: fix/vp-replay
changes:
  changed: []
  fixed: []
  removed: []
  security:
    - timestamp: '2026-11-24T00:00:00Z'
      title: Refuse agent presentations whose proof outlives the 5 minute VP lifetime
      description: >-
        A presentation's proof now expires at most 5 minutes (plus 2 minutes of clock skew)
        after it is verified, and a proof without `expires` may not be created more than 2
        minutes ahead of the gateway's clock. Before, the gateway accepted any `expires` the
        holder signed, so a presentation minted with a far-future expiry could be replayed for
        as long as its credential lasted.
    - timestamp: '2026-11-24T00:00:00Z'
      title: Bind identity presentations to their recipient to limit replay
      description: >-
        Identity presentations now name their audience in the proof's `domain`: the peer's DID
        over Fabric, the Target's origin on direct calls, and `urn:affinidi:audit-only` for
        presentations kept only in the audit log. Every verifier refuses an audit-only copy, and
        a Fabric verifier refuses a presentation addressed to another gateway, so an addressed
        copy taken from a peer or an audit integration can no longer be presented as the agent
        there. Direct paths, the STS token endpoint and fetched agent cards accept any other
        `domain`. Presentations
        without a `domain` are still accepted, so older gateways and clients keep working.
    - timestamp: '2026-11-24T00:00:00Z'
      title: Address Fabric answers' identity presentations to the calling gateway
      description: >-
        The identity presentation on an answer sent back over Fabric now names the calling
        gateway's Connection Point, and the calling gateway refuses an answer whose presentation
        names another recipient with `502`, recorded as an `invalid` identity binding. The
        calling gateway now also checks the presentation in an MCP answer's `result._meta` or
        top-level `_meta`, which it did not check before, as it does on A2A answers: an MCP answer whose
        presentation fails verification, is addressed to another recipient, or comes from an
        issuer the connection does not trust is refused with `502`. This includes a Managed
        Agent's own credential passed through when the paired gateway adds none (its surface
        has no managed identity, or the result is not complete). On an MCP surface that takes
        the agent's identity from the payload, a verified presentation now supplies that
        identity.
  added:
    - timestamp: '2026-11-24T00:00:00Z'
      title: Let a Remote gateway connection refuse relayed identity presentations
      description: >-
        A Remote gateway record has `require_addressed_presentations`, set with
        `PUT /v1/gateways/{id}`. Off by default, so a peer may keep relaying presentations from
        an issuer the operator trusts for the connection; on, such a presentation must be
        addressed to this gateway, and one with no `domain` is refused.
  breaking: []
