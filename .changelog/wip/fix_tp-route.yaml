branch: fix/tp-route
changes:
  added:
    - timestamp: '2026-11-19T22:40:00Z'
      title: Surface routing config says which prefixes a Transit Point may listen under
      description: >-
        GET /v1/config/surface-routing now returns outbound_channel_path_prefix beside
        channel_path_prefix: the same channel prefixes under the gateway's outbound prefix, with the
        same id and name. A Transit Point whose listen_path sits under one of them is reachable at
        every address in available_outbound_listen_addresses, whether the outbound listener has a
        hostname of its own or shares the inbound one. Previously a client had to derive that, and
        could not: only the gateway knows which of the two it is serving, and a path outside the
        outbound prefix answers on the outbound listener alone, so on a shared hostname it is never
        reached. The field is always present and may be empty.
  changed: []
  fixed:
    - timestamp: '2026-11-20T10:30:00Z'
      title: ⭐ Refuse a Transit Point listen_path no deployment serves
      description: >-
        A Transit Point whose listen_path is /outbound, bare or with a trailing slash, registers
        that prefix and its wildcard on the outbound listener, so it answers every outbound request
        no other Transit Point's route matches more closely, and one the outbound router cannot
        register as written, such as a path with no leading slash, panics the outbound listener
        build. Until now both were only logged as a warning while the listener was built, by which
        time the surface was stored and the operator none the wiser. The admin API now refuses the
        save that introduces either, with 400 and the code listen_path_is_outbound_prefix or
        listen_path_invalid, naming the Transit Point, its variant and what to do instead, on the
        base surface and in every variant. A brace, which axum reads as a path parameter so the
        point silently answers every value in that position, is now one of the paths the gateway
        calls malformed. Only a path the save introduces or changes is refused: the same Transit
        Point, in the same variant, keeping the same path is exempt, so a surface stored with such
        a path stays editable, while moving it to another Transit Point, copying it into a variant,
        renaming the point, or renaming the variant, which re-introduces every path that variant
        holds, is a new claim. A disabled surface reserves no route, so saving one is never refused,
        and claims nothing while disabled, so enabling it introduces every path it names. A
        listen_path already on disk is still served as stored.
    - timestamp: '2026-11-20T10:35:00Z'
      title: Refuse a Transit Point listen_path an inbound listener's hostname hides
      description: >-
        A listen_path outside the gateway's outbound prefix answers on the outbound listener's own
        address alone, so an inbound listener that shares that listener's hostname never reaches it,
        and the Surface Builder offers only the /outbound prefixes there. The admin API now agrees
        with it: on such a deployment the save that introduces one is refused with 400 and the code
        listen_path_not_served, naming the Transit Point, its variant and the route every address
        serves instead, for the base surface and every variant. Where the outbound listener has a
        hostname of its own the path is reachable, the picker offers it and the save stores it; a
        path a surface is already stored with is answered with a Warning header rather than
        refused, so such a surface stays editable.
    - timestamp: '2026-11-20T12:10:00Z'
      title: Refuse a Transit Point listen_path with a legacy parameter segment
      description: >-
        A listen_path segment starting with ':' or '*', such as /outbound/:partner or
        /outbound/*partner, is the parameter syntax axum used before 0.8 and refuses now, so the
        outbound listener build panicked on it once the surface was already stored. The gateway now
        counts it among the paths the outbound router cannot register as written, and the save that
        introduces one is refused with 400 and the code listen_path_invalid.
    - timestamp: '2026-11-20T12:15:00Z'
      title: Name a variant's own route when its Transit Point path is not served
      description: >-
        The warning for a listen_path outside the outbound prefix named
        /outbound/<surface route>/<alias> for every Transit Point, including one a variant defines,
        which is the base point's route: an operator who followed it reached the base Target, or a
        404 for an alias only the variant has. Such a Transit Point is now named at the route its
        variant serves, /outbound/<surface route>$<variant>/<alias>.
    - timestamp: '2026-11-20T16:40:00Z'
      title: The Surface Builder reads a Transit Point's prefix from the list it offers
      description: >-
        On an outbound address that shares the inbound hostname a Transit Point listens under
        /outbound plus a channel's prefix, and the prefix picker offers exactly those forms. Two
        places matched a stored route against the plain inbound list instead, which such a route
        can never match, and then fell back to the first channel: a Transit Point whose path began
        /outbound/ was recorded as /agents. The picker had no option equal to that, so it stayed on
        its placeholder with Custom Path empty, and both required fields looked unset on a surface
        whose route was correct; saving from there would have composed a new route out of the two
        empty fields. Both now match against the offered list, a route under none of the offered
        prefixes leaves the field unset rather than claiming one its path does not start with, and
        a stored prefix the picker no longer offers is re-derived from the route instead of shown
        as selected, so a surface stored before this reads correctly without being rewritten. A
        new Transit Point seeds an offered prefix as well.
    - timestamp: '2026-11-20T18:10:00Z'
      title: The Surface Builder holds the surface prefix and path to the required fields they are
      description: >-
        Both route fields carry a required marker and neither could act on it: the path's validator
        returns no error for an empty value, and the prefix had no error binding at all. A node
        whose stored route the builder could not place under an offered prefix therefore rendered
        as two blank fields, indistinguishable from one nobody had filled in, and saving it composed
        an empty route out of them without a word, replacing a route the gateway was still serving.
        A save attempt now refuses both, the prefix naming the route as stored and saying it is
        under none of the prefixes on offer. On a save attempt, as the path's own error already
        was, so a node is never marked before it has been touched.
  removed: []
  security:
    - timestamp: '2026-11-20T12:40:00Z'
      title: Keep control characters out of a save's Warning header
      description: >-
        A save's Warning header quotes what the operator stored, such as a Transit Point
        listen_path, so a stored value's control characters reached the header text. They are now
        replaced with spaces, alongside the existing quote and backslash escaping, so nothing a
        surface holds can end the header value or introduce a line break, and a warning about such a
        value is still delivered instead of being dropped whole, which is what the header library's
        own refusal did before.
  breaking:
    - timestamp: '2026-11-20T13:30:00Z'
      title: ⭐ Hold a Transit Point listen_path to the prefixes the Surface Builder offers
      description: >-
        The Surface Builder composes a Transit Point's listen_path from a picker: one of the
        surface prefixes gateway.json configures in channels, with /outbound in front on an
        outbound address shared with an inbound listener, then a path of your own. The admin API
        took any path at all, so it stored Transit Points the dashboard could not have made and
        could not edit, among them paths claiming a route under another surface's prefix, which
        the outbound listener either shadowed or dropped as a duplicate. A listen_path must now be
        under one of those same prefixes, with or without /outbound, with a segment of its own
        after it, and a save that introduces anything else is refused with 400 and the code
        listen_path_not_a_channel_prefix, naming the Transit Point, its variant and the prefixes
        the gateway does offer. This refuses saves every deployment accepted until now, with no
        setting to turn it off: an API client or integration that creates a Transit Point on a
        path outside those prefixes, such as /partner-a-webhook, is refused on upgrade and must
        move the path under a configured prefix. A listen_path already stored keeps working and
        keeps saving, so no running surface stops serving.
