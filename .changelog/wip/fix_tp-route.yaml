branch: fix/tp-route
changes:
  added:
    - timestamp: '2026-11-19T22:40:00Z'
      title: Surface routing config says which prefixes a Transit Point may listen under
      description: >-
        GET /v1/config/surface-routing now returns outbound_channel_path_prefix beside
        channel_path_prefix: the same channel prefixes under the gateway's outbound prefix, with the
        same id and name. A Transit Point whose listen_path sits under one of them is reachable at
        every address in available_outbound_listen_addresses, whether the outbound listener has a
        hostname of its own or shares the inbound one. Previously a client had to derive that, and
        could not: only the gateway knows which of the two it is serving, and a path outside the
        outbound prefix answers on the outbound listener alone, so on a shared hostname it is never
        reached. The field is always present and may be empty.
    - timestamp: '2026-11-19T22:45:00Z'
      title: An appliance can refuse a Transit Point path it would not serve
      description: >-
        gateway.json takes strict_outbound_listen_paths, off by default. Off, nothing changes: every
        listen_path that saved before still saves, and the save answers with a Warning header naming
        each path the gateway cannot serve as the Transit Point means it, for the base surface and
        every variant. A path outside the outbound prefix is named only where an inbound listener
        shares the outbound one's hostname, which is when it stops being reachable. On, such a save
        is refused with 400 and the code listen_path_not_served, listen_path_is_outbound_prefix or
        listen_path_invalid, naming the Transit Point, its variant and what to do instead. Only the
        paths that save introduces or changes: the same Transit Point, in the same variant, keeping
        the same path is exempt, so turning the setting on never locks an operator out of editing a
        surface, while moving a stored path to another Transit Point, copying it into a variant,
        renaming the point, or renaming the variant, which re-introduces every path that variant
        holds, is a new claim. A disabled surface reserves no route, so saving one is never refused,
        and claims nothing while disabled, so enabling it introduces every path it names: a surface
        disabled with one of these paths cannot be enabled while the setting is on until the path
        changes.
  changed: []
  fixed:
    - timestamp: '2026-11-20T10:30:00Z'
      title: Say when a Transit Point listen_path takes the whole outbound prefix
      description: >-
        A Transit Point whose listen_path is /outbound, bare or with a trailing slash, registers
        that prefix and its wildcard on the outbound listener, so it answers every outbound request
        no other Transit Point's route matches more closely, and one the router cannot register as
        written, such as a path with no leading slash, panics the outbound listener build. Until now
        both were only logged as a warning while the listener was built, by which time the surface
        was stored. The save now answers with a Warning header naming the Transit Point, its variant
        and what to do instead, and refuses the save with 400 and the code
        listen_path_is_outbound_prefix or listen_path_invalid where strict_outbound_listen_paths is
        on. A brace, which axum reads as a path parameter so the point silently answers every value
        in that position, is now one of the paths the gateway calls malformed. Both stand as they
        were while the setting is off, which is the default.
  removed: []
  security: []
  breaking: []
