branch: fix/service-token-renewal
changes:
  added: []
  changed: []
  fixed:
    - timestamp: '2026-11-25T01:01:18Z'
      title: Renew a renewed service token half its own lifetime before it expires
      description: >-
        A service token from a credential provider is renewed half its own lifetime before it
        expires, between 60 seconds and 5 minutes early, every time and not only the first. The
        lifetime was counted from when the token's vault row was first written, which a renewal
        keeps, so later tokens of the same key were renewed early: one living between 300 and 600
        seconds 5 minutes before it expired, and one living 300 seconds or less on almost every
        request, which could reach the issuer's rate limit. The lifetime is now counted from when
        the provider issued the current token.
  removed: []
  security: []
  breaking: []
