branch: feat/delegation-vault-providers
changes:
  added:
    - timestamp: '2026-10-30T20:00:00Z'
      title: Check a credential provider with an issuer against the issuer's metadata
      description: >-
        A credential provider can name its authorization server's `issuer`, a plain `client_id`,
        a `token_endpoint_auth_method` (`none`, `client_secret_basic` or `client_secret_post`)
        and an RFC 7009 `revocation_endpoint`. Such an external consent provider is checked when
        it is created: its endpoints must be public `https` URLs, it needs a public `https`
        `resource`, and the gateway reads the issuer's RFC 8414 or OpenID Connect metadata
        through a pinned fetch under the Strict egress posture, without requiring a `jwks_uri`,
        and refuses the provider with `provider_metadata_mismatch` unless its authorization,
        token and revocation endpoints are the ones the metadata names, the server supports its
        authentication method, and the metadata lists S256 PKCE. A server whose metadata lists no
        PKCE methods, which MCP clients refuse, is admitted only for a provider that sets
        `allow_unadvertised_pkce`, for a server known to enforce S256 without listing it. Its
        issuer, endpoints, client fields, callback URL, resource and PKCE exception never change
        afterwards: an update that sends another value is refused with
        `provider_field_immutable`, so a token that can edit providers cannot point one whose
        grants are stored at an endpoint of its choosing. It takes no `additional_params`,
        `client_id_secret_ref`, consent identity strategy or API key.
    - timestamp: '2026-10-30T21:00:00Z'
      title: Keep delegated grants by binding in the vault, only while encrypted at rest
      description: >-
        The delegation vault keeps the grants of external consent providers apart from its
        agent-keyed tokens, each keyed by the tenant, the surface, the Transit Point, the
        provider and the principal (`owner`, or a caller's identity hash), with no agent DID
        involved, so a grant is never released on another surface, Transit Point or tenant.
        A record's id is an HMAC of that key under the identity hash pepper, so a lookup is
        one read and one decrypt instead of a scan of every token, and the id reveals nothing.
        The vault refuses to store or release such a grant unless at-rest encryption is enabled
        with a key from the environment, a file or AWS KMS (the development `local` key source
        does not count) and `AG_IDENTITY_HASH_PEPPER` is set, since a pepper generated for one
        process would orphan every grant on restart; it warns at startup when either is
        missing. Grants and tokens restored in plaintext are encrypted when the vault starts.
        Storage exports leave these grants out. Nothing is migrated: existing agent-keyed tokens
        stay where they are and are never moved into grants by binding, so people connect their
        accounts again through external consent.
    - timestamp: '2026-10-30T22:00:00Z'
      title: Release a vendor grant on a Transit Point with consent_mode external
      description: >-
        A Transit Point's `transit_credentials` can set `consent_mode: external` with a
        `subject` of `owner` (one grant every caller uses) or `caller` (one per caller's identity
        hash), for a credential provider with an issuer of the surface's own tenant. The Transit
        Point then injects the grant the vault keeps for that tenant, surface, Transit Point,
        provider and principal, needs no managed agent identity, never builds an authorization
        URL, and refuses the call with 503 before forwarding it when no live grant can be
        released. A call that names no caller is refused with 403, so an anonymous caller never
        acts as the owner. The grant goes only to the origin of the provider's `resource`: the
        Transit Point must target it over public `https`, never over Fabric, its id must name
        one destination and binding across the surface and its variants, and the request is
        forwarded through Strict pinned egress after the destination is checked again. Saves,
        including a surface's creation and tenant reassignment, are refused when such a binding
        has no subject, names another tenant's or an agent-keyed provider, sends the grant
        elsewhere, sits on a surface with `outbound_credentials`, or the vault cannot keep
        grants; a provider with an issuer is bound by no other consent mode, and surface-level
        `outbound_credentials` cannot ask for `external`.
    - timestamp: '2026-10-30T23:30:00Z'
      title: Revoke a binding's grants when a surface change removes the binding
      description: >-
        Deleting a surface, removing a Transit Point or its binding, changing the binding's
        subject or provider, or moving the surface to another tenant revokes and deletes the
        grants of each external consent binding the change removes, before the change is
        saved. A change that adds a binding deletes any grant left under it, so re-adding the
        same surface, Transit Point id and provider needs a new consent. A surface write that
        cannot remove those grants is refused with 503, so no grant outlives its binding.
  changed:
    - timestamp: '2026-10-30T20:00:00Z'
      title: Make credential provider slugs unique per tenant
      description: >-
        A credential provider's `provider_id` is now unique per tenant, and among the untenanted
        providers, instead of across the whole appliance. The duplicate check now compares the
        slug as it is stored, trimmed and in lower case, so `GitHub` and `github` conflict, and
        a create whose duplicate check fails is refused instead of proceeding.
  fixed:
    - timestamp: '2026-10-30T21:00:00Z'
      title: Stop logging that the delegation vault is encrypted when it is not
      description: >-
        The delegation vault's startup line said it was encrypted whatever the configuration.
        It now says whether it is encrypted at rest, and warns when it is not that delegated
        tokens are written in plaintext.
    - timestamp: '2026-10-30T23:45:00Z'
      title: Connect pinned egress directly, whatever proxy the environment names
      description: >-
        Every pinned egress client, used for forwards, metadata, JWKS, revocation and other
        vetted calls, now ignores `HTTPS_PROXY`, `HTTP_PROXY`, `ALL_PROXY` and the system proxy.
        A proxy resolved the host again and connected to an address nobody vetted, so address
        vetting and pinning did not hold while one was configured.
  removed: []
  security: []
  breaking:
    - timestamp: '2026-10-30T23:00:00Z'
      title: Refuse to delete a credential provider that a surface still binds
      description: >-
        Deleting a credential provider that a surface binds, in its base or a variant, through
        `outbound_credentials` or a Transit Point's `transit_credentials`, now answers 409
        `provider_in_use` instead of 204, which left every later call through the binding
        refused; clients that delete providers must remove the bindings first. Only surfaces
        that may reference the provider are considered, and the answer names the surface when
        the caller may see it. Deleting a provider with an issuer first revokes each of its
        grants at the authorization server's RFC 7009 revocation endpoint, the refresh token and
        then the access token, at most eight grants at a time, through pinned Strict `https`
        egress, with the client authenticating as its `token_endpoint_auth_method` says, then
        deletes them. Revocation is best effort and audited as `token_revoked` with its outcome
        and the caller that deleted the provider; the grant is deleted whatever the outcome.
        The provider is kept, with 503, while grants are stored that cannot be read because
        at-rest encryption is off.
