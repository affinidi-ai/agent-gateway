branch: fix/saml-explicit-role-mapping
changes:
  added:
    - timestamp: '2026-11-20T12:00:00Z'
      title: Add default_role to saml.json for sign-ins with no role mapping
      description: >-
        saml.json accepts an optional default_role (administrator, poweruser or user) that a SAML sign-in gets
        when none of its identity-provider role values has a role_mapping entry. Without it such a sign-in is
        refused. The gateway warns at startup when default_role is administrator, or when role_mapping is empty
        and default_role is unset, or when every role_mapping key is an unedited placeholder from the example file.
    - timestamp: '2026-11-25T14:00:00Z'
      title: Raise user.login_failed with reason ambiguous_attribute for conflicting SAML IDs
      description: >-
        A SAML sign-in whose user ID or username attribute carries more than one distinct value is refused with
        the same 403 page as a refused role and raises a user.login_failed integration event with failure
        reason ambiguous_attribute, naming no account.
    - timestamp: '2026-11-23T09:00:00Z'
      title: Raise user.login_failed with reason role_not_mapped when a SAML role is refused
      description: >-
        A SAML sign-in refused because its role maps to no gateway role now raises a user.login_failed
        integration event with failure reason role_not_mapped, naming no account, and logs the SAML subject
        and the role values received.
  changed: []
  fixed: []
  removed: []
  security: []
  breaking:
    - timestamp: '2026-11-20T12:00:00Z'
      title: ⭐ Grant SAML roles only through an explicit role_mapping entry
      description: >-
        A SAML role now comes only from an explicit role_mapping entry, taking the highest role any of the sent
        role values maps to, whether they come in one attribute, in repeated attributes or in several attribute
        statements. A value that merely looks like a gateway role, such as admin, is not mapped. A sign-in whose
        values have no entry, or with no role value, gets default_role or is refused with a 403 page and no user
        created or updated. An assertion whose user ID or username attribute carries more than one distinct value is refused, including across repeated attributes and statements. The user ID attribute identifies the user only when the first attribute statement carries it, and the NameID otherwise, as before. Email, first name, last name, department and job title keep their stored value while the identity provider still sends it, else take the first.
        Before upgrading, add a role_mapping entry for every identity-provider role that should sign in, or set
        default_role to user to keep admitting the rest, and check that an saml.json copied from an earlier
        example maps only roles you intend to grant. A role_mapping value or default_role that is not exactly
        administrator, poweruser or user, which used to become user, now stops the gateway at startup. A refused
        sign-in leaves the stored role of an existing user as it was, so after upgrading review the users holding
        administrator or poweruser, and revoke the sessions and tokens of those who no longer qualify.
        The first user on an empty appliance and the primary administrator keep their administrator role
        whatever role is sent. Before upgrading, check that the identity provider sends one value for the user ID
        and username attributes, since an assertion with several is refused.
