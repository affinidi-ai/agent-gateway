branch: feat/mcp-authorization-server-discovery
changes:
  added:
    - timestamp: '2026-10-27T10:54:00Z'
      title: Publish protected resource metadata for MCP surfaces with JWT callers
      description: >-
        An MCP Access Point whose JWT Bearer source authentication accepts tokens from an external
        authorization server can set caller_authentication.protected_resource with its resource,
        authorization servers and scopes. The gateway then serves the RFC 9728 document at
        /.well-known/oauth-protected-resource followed by the route, for the base surface and each
        enabled variant, so an MCP client finds where to get a token. Each listener publishes only
        its own surfaces. The authorization servers must include the issuer of the caller
        authentication's JWT verification strategy. The setting is checked on save like
        mcp_http.authorization, a PUT that
        omits it keeps it while the surface still supports it, and surfaces without it behave as
        before.
    - timestamp: '2026-10-27T11:14:01Z'
      title: Challenge MCP callers without a valid token to fetch one
      description: >-
        A direct request to an MCP Access Point that publishes protected resource metadata, whose
        bearer token is missing or refused, is now answered before policy with 401 and
        WWW-Authenticate Bearer resource_metadata naming the absolute metadata URL, with
        error=invalid_token once a token was presented and the scopes when set. MCP clients follow
        it to the authorization server, get a token and retry. Without this setting a failed
        credential is still handed to policy.
    - timestamp: '2026-10-27T19:07:39Z'
      title: Edit MCP authorization server discovery in the dashboard
      description: >-
        The Caller Context editor of an MCP surface whose caller authentication is JWT Bearer can
        turn on authorization server discovery and set its resource, authorization servers and
        scopes, for the surface and each variant. It keeps token forwarding off and the accepted
        audiences empty while discovery is on, shows the resource each variant advertises, and
        removes a setting the operator switches off.
    - timestamp: '2026-10-27T19:34:56Z'
      title: End-to-end MCP discovery demo against Ory Hydra
      description: >-
        make mcp-discovery starts Ory Hydra in Docker, a login and consent app, an MCP server and
        the gateway, then checks discovery, sign-in, the token audience, token stripping and the
        caller identity in policy with a scripted client and the official MCP client SDK. With
        ARGS=--keep it stays up for a check with MCP Inspector. The consent app shows how to grant
        the RFC 8707 resource as the token audience, which Hydra does not do by itself.
  changed: []
  fixed:
    - timestamp: '2026-10-27T10:22:00Z'
      title: Stop pointing MCP JWT Bearer challenges at a metadata document
      description: >-
        A JWT Bearer 401 on an MCP Access Point carried resource_metadata with a relative
        /.well-known/oauth-protected-resource URL. Nothing served a document there for a surface
        with caller authentication, so a client that followed it reached a 404, or the document of
        another endpoint mounted at the root. The challenge is now Bearer realm="agent-gateway"
        only.
    - timestamp: '2026-10-27T19:30:01Z'
      title: Let browser MCP clients read protected resource metadata
      description: >-
        The /.well-known/oauth-protected-resource documents answered without CORS headers and
        refused the preflight, so an MCP client running in a browser on another origin could not
        find the authorization server. Any origin may now read them with GET or HEAD; other
        methods keep the cors allowlist.
  removed: []
  security:
    - timestamp: '2026-10-27T11:20:02Z'
      title: Never forward the caller token on MCP surfaces that publish discovery
      description: >-
        MCP forbids passing a client's token through to the upstream server. Saving an MCP surface
        that publishes protected resource metadata with JWT Bearer forward_header set is refused
        with 400, and a stored surface with that combination answers 503 instead of forwarding, so
        the caller's Authorization header never reaches the Target.
    - timestamp: '2026-10-27T17:34:03Z'
      title: Accept only tokens issued for the MCP surface's own resource
      description: >-
        An MCP Access Point that publishes protected resource metadata accepts a JWT Bearer token
        only when its aud claim names the resource advertised for the route called, the base
        resource or the variant's own, as the MCP authorization specification requires. A token the
        same authorization server issued for another resource is answered with the 401 challenge.
        The JWT Bearer audiences list must be empty on these surfaces.
    - timestamp: '2026-10-28T11:02:53Z'
      title: Reject JWT Bearer tokens used before their nbf
      description: >-
        JWT Bearer caller tokens were accepted before the time in their nbf claim, because the JWT
        library checks nbf only when asked. A token whose nbf is still more than 60 seconds away is
        now refused like any other invalid token, on every surface with JWT Bearer caller
        authentication and on the gateway STS Resource Server.
  breaking: []
