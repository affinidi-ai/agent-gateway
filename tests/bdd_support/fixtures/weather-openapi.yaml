openapi: 3.0.0
info:
  title: Weather REST API
  description: Minimal REST API used by BDD scenarios to verify that MCP-proxy targets translate JSON-RPC tools/call into REST calls.
  version: 1.0.0
paths:
  /weather/{city}:
    get:
      operationId: get_weather
      summary: Get current weather for a city
      parameters:
        - name: city
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current weather report
          content:
            application/json:
              schema:
                type: object
                properties:
                  city:
                    type: string
                  temperature:
                    type: number
                  conditions:
                    type: string
  /forecast/{city}:
    get:
      operationId: get_forecast
      summary: Get five-day forecast for a city
      parameters:
        - name: city
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Five-day forecast
          content:
            application/json:
              schema:
                type: object
                properties:
                  city:
                    type: string
                  days:
                    type: array
                    items:
                      type: object
                      properties:
                        day:
                          type: integer
                        high:
                          type: number
                        low:
                          type: number
  /weather/{city}/map:
    get:
      operationId: get_weather_map
      summary: Get the weather map for a city as a PDF document
      parameters:
        - name: city
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Weather map
          content:
            application/pdf:
              schema:
                type: string
                format: binary
  /weather/{city}/attachment:
    get:
      operationId: get_weather_attachment
      summary: Get the weather report for a city as a file inside a JSON answer
      parameters:
        - name: city
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The report's bytes in base64url
          content:
            application/json:
              schema:
                type: object
                properties:
                  size:
                    type: integer
                  data:
                    type: string
              x-gateway-file:
                pointer: /data
                encoding: base64url
  /weather/{city}/broken-attachment:
    get:
      operationId: get_broken_attachment
      summary: Declare a file in an encoding the gateway does not read
      parameters:
        - name: city
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A malformed file declaration
          content:
            application/json:
              x-gateway-file:
                pointer: /data
                encoding: hex
