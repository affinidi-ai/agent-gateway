# Setup file for the bundled sidecar VTA, read by `vta-entrypoint.sh` on the
# VTA's first start. Shipped with the deployment, mounted read-only.
#
# The gateway never writes this file. It only supplies one fact, its control
# DID, through the bootstrap volume; the role, the context and the capabilities
# are fixed in the entrypoint script, so a compromised gateway cannot ask for a
# wider grant or a weaker seed backend.
#
# There is deliberately no `admin_did`: nobody human exists at first boot, and
# seeding one here would seal the VTA. The super-admin slot stays empty until a
# person claims the VTA.

config_path = "/var/lib/vta/config.toml"
data_dir    = "/var/lib/vta/data"
vta_name    = "agent-gateway-bundled"
# Required by setup whenever REST is on. The VTA's DID is a did:key, so nothing
# is published at this address; it is the loopback address the gateway uses.
public_url  = "http://127.0.0.1:8100"

[server]
# Loopback only. The gateway shares this network namespace, so nothing else can
# reach the VTA.
host = "127.0.0.1"
port = 8100

[log]
level  = "info"
format = "json"

[services]
rest      = true
didcomm   = false
tsp       = false
webauthn  = false

[messaging]
kind = "skip"

[secrets]
# The seed is encrypted under a passphrase that is mounted as a secret and never
# read from this file or the environment. Never `plaintext` or `config_seed`.
backend = "encrypted_file"
path    = "/var/lib/vta/seed.enc"
kek     = { source = "passphrase", file = "/run/secrets/vta_seed_passphrase" }

[hardened]
enabled = true

[vta_did]
# The VTA is internal and never published, so its DID is the key itself: nothing
# to host, nothing to resolve. The gateway pins it from the identity file.
kind = "create_did_key"
