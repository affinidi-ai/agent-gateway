# `[vta]` block for the bundled sidecar (tier T1). Add it to the gateway's own
# `config.toml`; it is not a complete configuration on its own.
#
# With `auto_bootstrap` the gateway and its sidecar connect on first start with
# no operator action: the gateway writes its own did:key for the sidecar to
# enrol, waits for the sidecar to publish its DID and pins it, authenticates,
# checks it holds exactly the expected grant, and creates a non-exportable
# signing key. Switching this deployment to a customer-operated VTA later is a
# change to `mode`, `base_url` and `vta_did` (and dropping `auto_bootstrap`);
# nothing else, and no code path differs.
#
# Encryption at rest must be enabled in `[encryption]`: the sidecar's keys sit on
# this host's disk, so encryption is the only thing between a disk image and the
# signing keys. Startup fails closed without it.

[vta]
enabled = true

# `embedded` is the wire spelling of the bundled deployment, kept for config
# written before the shape was named. It means **packaging**, never linking:
# `vta-service` runs as its own process in this deployment unit.
mode = "embedded"

auto_bootstrap = true

# The sidecar shares the gateway's network namespace, so its loopback is
# private to the pair. The gateway reserves this address so no surface, MCP
# proxy or A2A proxy can be pointed at it (`GET /v1/vta/status` lists it).
base_url = "http://127.0.0.1:8100"

# The folder shared with the sidecar. Public data only crosses it: the gateway's
# control DID going in, the sidecar's own DID coming out. Mount it into both.
bootstrap_dir = "/bootstrap"
bootstrap_wait_secs = 90

# The gateway authenticates as its own did:key. The sidecar cannot resolve the
# gateway's public address, so nothing is published for it; rotation is
# `agent-gateway --vta-rotate-control-key --yes` (see the runbook).
control_did_method = "did_key"

# Bound how much a runaway caller can mint before someone notices.
sign_quota_max = 600
sign_quota_window_secs = 60

# Hashes-only, bounded, non-blocking signing audit.
audit_enabled = true
