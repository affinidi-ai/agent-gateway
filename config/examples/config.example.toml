# Affinidi Trust Fabric Gateway Bootstrap Configuration

# Configuration source: "local" (no external database required)
channel_config_source = "local"

# DynamoDB table name containing the proxy channel configuration
# Required when channel_config_source is "dynamodb"
# Only channels are loaded from DynamoDB - all other config is local
# dynamodb_table = "trust-proxy-configuration"

# AWS Region (optional)
# If not specified, uses the default region from AWS credential chain
aws_region = "ap-southeast-1"

# AWS Profile (optional)
# Specifies which profile to use from ~/.aws/credentials and ~/.aws/config
# If not specified, uses the default profile or environment credentials
# aws_profile = "my-aws-profile"

# Secrets backend type: "filesystem" or "aws"
secrets_backend = "filesystem"

# Backup encryption key (REQUIRED). Encrypts the whole `.agbak` backup archive
# (AES-256-GCM). Sourced at runtime — use one of:
#   env://AG_BACKUP_ENCRYPTION_KEY   (recommended)
#   file:///run/secrets/backup_key   (read from a file)
# or a literal 64-char hex string (32 bytes). The service fails to start if unset
# or unresolvable. Never commit a literal key to a shared repo.
backup_encryption_key = "env://AG_BACKUP_ENCRYPTION_KEY"
# Temporary migration only: resolve up to four comma-separated previous BEKs,
# tried after the current key. The environment variable alone is ignored unless
# this explicit source is configured. Remove the field and environment variable
# after restoring and creating a fresh backup.
# legacy_backup_encryption_keys = "env://AG_LEGACY_BACKUP_KEYS"

# Authentication mode (passkey or saml)
# Options: "passkey" or "saml"
auth_mode = "passkey"
#auth_mode = "saml"

# Session timeout in minutes (applies to both passkey and SAML)
session_timeout_minutes = 20

# Require authentication for WebSocket connections (default: true)
# When enabled, users must authenticate with a valid passkey session before connecting to WebSocket
websocket_require_auth = true

# WebSocket broadcast channel buffer size (default: 500)
# Increase for high-traffic deployments to prevent message loss
# Each buffered message uses ~8KB memory
websocket_broadcast_buffer = 500

# How long to keep metrics in minutes (default: 360 = 6 hours, max: 10080 = 7 days)
# This value is overridden by settings stored in _storage/settings/settings.json
metrics_retention_minutes = 360

# Cache TTL for metrics aggregations in seconds (default: 1)
# Lower values provide more real-time updates but increase CPU usage
# Higher values reduce CPU usage but make dashboard updates less frequent
metrics_cache_ttl_seconds = 1

# Initial server mode. "active" (default) handles traffic and maintains connections.
# "standby" drops listeners and returns 503 on /api/v1/health.
# Send SIGUSR1 to promote to active; SIGUSR2 to step down to standby.
# NOTE: must be a top-level key (before any [table] header), or TOML nests it under
# the preceding table and it is silently ignored.
server_mode = "active"

# Optional provenance declaration for a broad, header-derived PAT tenant selector.
# Enable only when an authenticated edge removes every caller-supplied instance
# of this header and writes the authoritative tenant value before forwarding.
# Exact single-tenant selectors do not need this setting. Startup-only.
# [tenancy.trusted_tenant_header]
# header = "x-tenant-id"
# edge_strips_client_values = true

# Encryption at rest
[encryption]
# Master switch: when enabled, whole JSON storage files on disk are encrypted (.json.enc)
# and the configured encryption layers are loaded.
enabled = false
# Reserved: would additionally seal sensitive fields (private JWKs, private-key PEMs) as
# ENC[...] inside the (decrypted) JSON. Not yet wired to any field — leave false.
field_encryption_enabled = false
# Master key source: "environment", "file", "aws_kms", or "local".
# "local" is for development only: it does NOT encrypt (files hold plaintext ENC[0::...]
# envelopes) and logs every encrypt/decrypt as "<op> file=<path> fingerprint=<sha256>" under
# the log target `encryption::local`, so you can watch which files each cache refresh
# or standby promotion would send to KMS.
key_source = "environment"
key_env_var = "AG_MASTER_KEY"
# For key_source = "aws_kms": per-value envelope encryption. Set kms_key_id; every value
# is protected with a fresh KMS data key (GenerateDataKey per write, Decrypt per read).
# key_env_var is NOT used for aws_kms. IAM needs kms:GenerateDataKey + kms:Decrypt on the CMK.
# kms_key_id = "arn:aws:kms:us-east-1:123456789012:key/00000000-0000-0000-0000-000000000000"
# Bound in-flight KMS operations (optional, default 16).
# kms_max_concurrent_ops = 16

# Configuration file paths
[config_files]
gateway = "../gateway.json"
