# Run Agent Gateway from a locally built image.
#
# Docker is an integration workflow, not a zero-config quickstart. For a single
# command that generates config and runs the container, use `make docker-run`.
# For the fastest working first run with passkey login, use `make run-debug`
# (see docs/development/GETTING_STARTED.md).
#
# This compose file runs the image against a config you generate first. It will
# refuse to start until that config exists.
#
# Prerequisites:
#   1. Generate a runnable config (REQUIRED):   make config-docker
#      Creates envs/docker/config (config.toml, gateway.json) and
#      envs/docker/certs, with the WebAuthn relying party defaulted to localhost
#      so the container starts as-is. Without this, compose stops with
#      "source path does not exist" instead of a cryptic in-container error.
#   2. Provide a 64-character hex backup key:
#      export AG_BACKUP_ENCRYPTION_KEY=$(openssl rand -hex 32)
#
# Then: docker compose up
#   Dashboard: https://localhost:8443/    (accept the self-signed certificate)
#   Readiness: curl -k https://localhost:8443/api/v1/health
#   Liveness:  curl -k https://localhost:8443/api/v1/alive
#
# Storage lives at envs/docker/_storage on the host (created on first run),
# alongside the generated config. To start clean, delete it:
#   docker compose down && rm -rf envs/docker/_storage
#
# On Linux the container runs as a non-root user (uid 999); if writes to the
# bind-mounted _storage are denied, make it writable once:
#   mkdir -p envs/docker/_storage && chmod 777 envs/docker/_storage
#
# For a real deployment, override webauthn.rp_id, webauthn.external_origin, and
# the did.domain in envs/docker/config/gateway.json with your public host.
# Browser passkey login requires that WebAuthn origin to match the URL you open.
# Also set `[did_cache] allow_private_hosts = false` in
# envs/docker/config/config.toml: the generated dev config turns it on so DID
# resolution can reach a localhost mediator.

services:
  agent-gateway:
    image: agent-gateway:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-gateway-dev
    # No restart policy: a config/permissions error should surface once and stop,
    # not crash-loop and bury the first error.
    security_opt:
      - no-new-privileges:true
    ports:
      - "8443:8443"   # HTTPS listener — dashboard + passkey origin
      - "8080:8080"   # HTTP listener
    environment:
      RUST_LOG: info
      # Required. Encrypts backups; must be a 64-character hex string. The :? guard
      # aborts every compose command (including `down`) until it is exported.
      AG_BACKUP_ENCRYPTION_KEY: ${AG_BACKUP_ENCRYPTION_KEY:?set a 64-char hex key, e.g. export AG_BACKUP_ENCRYPTION_KEY=$(openssl rand -hex 32)}
    volumes:
      # Generated by `make config-docker`. create_host_path:false makes compose
      # fail loudly if the config is missing instead of mounting an empty dir.
      # The gateway only reads config/certs; all writes go to /app/_storage.
      - type: bind
        source: ./envs/docker/config
        target: /app/config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./envs/docker/certs
        target: /app/certs
        read_only: true
        bind:
          create_host_path: false
      # Persistent JSON storage (the only writable path). Bind-mounted under
      # envs/docker so eval data lives beside the generated config and matches
      # `make docker-run`. create_host_path lets compose create it on first run.
      - type: bind
        source: ./envs/docker/_storage
        target: /app/_storage
        bind:
          create_host_path: true
    healthcheck:
      # -k accepts the self-signed cert; /api/v1/health returns 200 only when
      # the gateway is Active and ready (503 while starting up).
      test: ["CMD", "curl", "-fsk", "https://localhost:8443/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
