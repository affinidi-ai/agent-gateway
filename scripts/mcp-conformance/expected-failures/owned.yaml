  # OpenAPI-backed Proxies offer tools only: resources/list returns -32601.
  - caching:sep-2549-resources-list-caching-hints
  # OpenAPI-backed Proxies offer tools only: resources/templates/list returns -32601.
  - caching:sep-2549-resources-templates-list-caching-hints
