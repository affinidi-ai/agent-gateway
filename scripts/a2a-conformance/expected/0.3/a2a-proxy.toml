# Failures of the gateway-owned A2A proxy when the suite treats it as an agent. It is scored on
# its own failures, not against the direct run. Its backend is the Direct Line stand-in
# (directline.py), which only echoes text
# (target "a2a-proxy", A2A 0.3 suite). The run fails on an entry that is missing here, on a
# listed test with another outcome, and on a listed test that no longer applies.
#
# minimum_passed is how many tests pass today. Fewer means tests stopped running
# or started being skipped, which a list of failures alone would not show.
minimum_passed = 36

[[expected]]
tests = [
    "tests.mandatory.jsonrpc.test_json_rpc_compliance::test_rejects_invalid_json_rpc_requests[invalid_request0--32600]",
    "tests.mandatory.jsonrpc.test_json_rpc_compliance::test_rejects_invalid_json_rpc_requests[invalid_request1--32600]",
    "tests.mandatory.jsonrpc.test_protocol_violations::test_invalid_jsonrpc_version",
    "tests.mandatory.jsonrpc.test_protocol_violations::test_missing_method_field",
]
outcome = "fail"
reason = "The gateway answers a JSON-RPC request it refuses itself with HTTP 400 and the JSON-RPC error in the body (docs/PROTOCOLS.md, Error mapping); this suite requires HTTP 200 for a JSON-RPC error. The suite fails on the HTTP 400: an assertion on the status, a raised HTTPError, or a -32603 from its transport client."

