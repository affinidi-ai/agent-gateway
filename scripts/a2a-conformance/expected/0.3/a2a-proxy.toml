    "tests.optional.capabilities.test_a2a_v030_method_enhancements.TestA2AV030MethodEnhancements::test_error_response_enhancements",
]
outcome = "fail"
reason = "The A2A proxy serves message/send only and answers every other A2A method with MethodNotFound (-32601); the suite expects TaskNotFoundError (-32001) for a task that does not exist."

