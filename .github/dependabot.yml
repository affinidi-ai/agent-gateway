version: 2

# A group's `applies-to` defaults to version updates, so no group below touches
# security updates: those keep arriving as separate PRs. The cargo and npm groups
# take minor and patch only, so their majors arrive as individual PRs; the
# github-actions group at the bottom is the exception and batches majors with the
# rest. An `ignore` entry needs an `update-types:` line on it, because a bare
# `dependency-name:` is documented as ignoring the dependency for security
# updates as well. The PyYAML pin the changelog tooling uses is maintained by
# hand in the Makefile and in the three workflows that install it, and no
# ecosystem here covers it.
updates:
  # Minor and patch bumps ride in one weekly PR: one Cargo.lock, one CI run, one
  # review. Majors stay ungrouped, but that holds only for crates past 1.0:
  # Dependabot classifies by literal version segments, so for a 0.x crate a
  # breaking bump counts as minor and rides in the group with everything else.
  # Much of this tree is 0.x (rustls 0.23, axum 0.8 and reqwest 0.13 among them),
  # so most breaking bumps land inside the weekly group.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Above Dependabot's default of 5: majors are ungrouped, so a backlog of open
    # major PRs can exhaust the limit and leave no room for the weekly grouped
    # PR. Security PRs have their own limit and are unaffected.
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Same grouping as cargo: one weekly PR for minor and patch, majors on their own.
  - package-ecosystem: npm
    directory: /www/default
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      npm-default-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: npm
    directory: /ui-tests
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      npm-ui-tests-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Keep the digest-pinned runtime base image in the Dockerfile current.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  # Keep the SHA-pinned actions in .github/workflows/* current. Dependabot bumps
  # each pin and rewrites the trailing `# vX.Y.Z` comment, so pins stay both
  # immutable (SHA) and readable. Grouped into a single weekly PR rather than one
  # per action.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
