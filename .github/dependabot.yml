version: 2

# A group's `applies-to` defaults to version updates, so no group below touches
# security updates: those keep arriving as separate PRs. Majors are not grouped
# anywhere here, so each arrives as its own PR. There are deliberately no
# `ignore` entries; if one is ever added, keep an `update-types:` line on it,
# because a bare `dependency-name:` is documented as ignoring the dependency for
# security updates as well.
updates:
  # Minor and patch bumps ride in one weekly PR: one Cargo.lock, one CI run, one
  # review. Majors stay ungrouped, but that holds only for crates past 1.0:
  # Dependabot classifies by literal version segments, so for a 0.x crate a
  # breaking bump counts as minor and rides in the group with everything else.
  # The RustCrypto crates are all 0.x here (p256 0.13, hkdf 0.12, hmac 0.12,
  # sha2 0.10), so their breaking bumps arrive inside the weekly group.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Same grouping as cargo: one weekly PR for minor and patch, majors on their own.
  - package-ecosystem: npm
    directory: /www/default
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-default-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: npm
    directory: /ui-tests
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-ui-tests-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Keep the digest-pinned runtime base image in the Dockerfile current.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  # Keep the SHA-pinned actions in .github/workflows/* current. Dependabot bumps
  # each pin and rewrites the trailing `# vX.Y.Z` comment, so pins stay both
  # immutable (SHA) and readable. Grouped into a single weekly PR rather than one
  # per action.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
