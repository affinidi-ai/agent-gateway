name: release-guards
# Cheap, build-free PR guard that protects the release pipeline:
#
#   toolchain-sync — every `toolchain:` pin under .github/workflows/* must match
#   the crate MSRV (`rust-version` in Cargo.toml). Kills the multi-file edit trap
#   where a toolchain bump misses a workflow and CI silently builds on a
#   different compiler than the one the crate declares.
#
# Deliberately standalone and self-contained (pure bash — no Rust build, no
# shared workflow). It carries no hardcoded `toolchain:` pin of its own, so it
# adds nothing new for the sync check to police.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  guards:
    name: release guards
    runs-on: ubuntu-latest
    steps:
      # Monitor egress and detect tampering. Audit (not block) because a block
      # allow-list is only safe once Insights confirms the endpoint set.
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain version sync
        run: bash scripts/check-toolchain-sync.sh
