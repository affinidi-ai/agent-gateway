name: Prepare release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version increment to apply
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare ${{ inputs.release_type }} release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Install changelog dependencies
        run: python3 -m pip install PyYAML

      - name: Require no open release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          open="$(gh pr list --state open --base main --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("release/"))] | .[0].number // empty')"
          if [[ -n "${open}" ]]; then
            echo "::error::Release PR #${open} is already open; merge or close it first."
            exit 1
          fi

      - name: Validate changelog fragments
        run: python3 .github/scripts/changelog.py check

      - name: Calculate next version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          current="$(sed -n '/^\[package\]/,/^\[/{s/^version = "\(.*\)"/\1/p;}' Cargo.toml)"
          # If the version already in Cargo.toml has never been tagged (e.g. the first
          # release, or a previous prepare run that bumped it but was never merged),
          # release it as-is instead of always bumping past it: the reviewed flow
          # would otherwise never be able to produce that exact version.
          if git rev-parse --verify "refs/tags/v${current}" >/dev/null 2>&1; then
            read -r bump version <<< "$(python3 .github/scripts/changelog.py next-version "${current}" --bump "${RELEASE_TYPE}")"
          else
            bump="none (v${current} is not yet tagged)"
            version="${current}"
          fi
          tag="v${version}"
          if git rev-parse --verify "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Tag ${tag} already exists."
            exit 1
          fi
          echo "Preparing ${current} -> ${version} (${bump})"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Bump Cargo version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ['VERSION']
          cargo_toml = Path('Cargo.toml')
          text = cargo_toml.read_text()
          pattern = re.compile(r'(?m)^version = "\d+\.\d+\.\d+"$')
          updated, count = pattern.subn(f'version = "{version}"', text, count=1)
          if count != 1:
              raise SystemExit('Could not update the package version in Cargo.toml')
          cargo_toml.write_text(updated)
          PY
          cargo update -p agent-gateway --precise "${VERSION}"

      - name: Build reviewed changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 .github/scripts/changelog.py release "${VERSION}"

      - name: Open release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          branch="release/${TAG}"
          base="$(git rev-parse HEAD)"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" \
              -f sha="${base}" -F force=true >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/${branch}" -f sha="${base}" >/dev/null
          fi

          git add Cargo.toml Cargo.lock CHANGELOG.md .changelog
          git diff --cached --name-status --no-renames -z HEAD > "${RUNNER_TEMP}/changes"
          BRANCH="${branch}" BASE="${base}" python3 - "${RUNNER_TEMP}/changes" > "${RUNNER_TEMP}/commit.json" <<'PY'
          import base64
          import json
          import os
          import sys
          from pathlib import Path

          fields = Path(sys.argv[1]).read_bytes().decode().split('\0')
          additions, deletions = [], []
          for status, path in zip(fields[0::2], fields[1::2]):
              if status == 'D':
                  deletions.append({'path': path})
              else:
                  contents = base64.b64encode(Path(path).read_bytes()).decode()
                  additions.append({'path': path, 'contents': contents})

          query = '''mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) { commit { oid } }
          }'''
          tag = os.environ['TAG']
          json.dump({'query': query, 'variables': {'input': {
              'branch': {
                  'repositoryNameWithOwner': os.environ['GITHUB_REPOSITORY'],
                  'branchName': os.environ['BRANCH'],
              },
              'message': {'headline': f'chore(release): prepare {tag}'},
              'expectedHeadOid': os.environ['BASE'],
              'fileChanges': {'additions': additions, 'deletions': deletions},
          }}}, sys.stdout)
          PY
          # Committing through the GraphQL API lets GitHub sign the commit as the release App;
          # a commit made on the runner and pushed would be unsigned.
          gh api graphql --input "${RUNNER_TEMP}/commit.json" \
            --jq '.data.createCommitOnBranch.commit.oid'

          fragment_count="$(find ".changelog/history/${VERSION}" -maxdepth 1 -name '*.yaml' | wc -l | tr -d ' ')"
          {
            echo "## Release ${TAG}"
            echo
            echo "This PR consolidates ${fragment_count} changelog fragments and bumps the package to ${VERSION}."
            echo
            echo "### Review checklist"
            echo
            echo "- [ ] Review the new ${TAG} section in \`CHANGELOG.md\`."
            echo "- [ ] Edit release wording in this PR if needed."
            echo "- [ ] Confirm \`Cargo.toml\` and \`Cargo.lock\` both use ${VERSION}."
            echo
            echo "Squash-merging this PR tags the reviewed commit, builds the release binary, and creates the GitHub Release."
            echo
          } > "${RUNNER_TEMP}/body.md"

          url="$(gh pr create --base main --head "${branch}" --title "chore(release): prepare ${TAG}" --body-file "${RUNNER_TEMP}/body.md")"
          echo "Release PR: ${url}" >> "${GITHUB_STEP_SUMMARY}"
