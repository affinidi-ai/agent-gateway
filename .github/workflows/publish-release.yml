name: Publish release

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - CHANGELOG.md

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    name: Detect release PR merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.pr.outputs.release }}
    steps:
      - name: Require a merged release PR opened by the release app
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BOT_LOGIN: affinidi-semantic-release[bot]
        run: |
          match="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            | jq --arg repo "${GITHUB_REPOSITORY}" --arg bot "${RELEASE_BOT_LOGIN}" '[.[] | select(
                .merged_at != null
                and .base.ref == "main"
                and (.head.ref | startswith("release/v"))
                and .head.repo.full_name == $repo
                and .user.login == $bot
              )] | length')"
          if [[ "${match}" -ge 1 ]]; then
            echo "release=true" >> "${GITHUB_OUTPUT}"
          else
            echo "${GITHUB_SHA} is not the merge of a release/v* PR opened by ${RELEASE_BOT_LOGIN}; nothing to publish."
            echo "release=false" >> "${GITHUB_OUTPUT}"
          fi

  publish:
    name: Publish reviewed release
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      # Pinned to the exact commit that triggered this run, not the (possibly moved-on)
      # main tip, so the binary built below always matches the commit tagged later.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Install changelog dependencies
        run: python3 -m pip install PyYAML

      - name: Detect reviewed release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n '/^\[package\]/,/^\[/{s/^version = "\(.*\)"/\1/p;}' Cargo.toml)"
          tag="v${version}"
          if ! python3 .github/scripts/changelog.py github-notes "${version}" > "${RUNNER_TEMP}/release-body.md"; then
            echo "CHANGELOG.md has no reviewed ${version} section; nothing to publish."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
          else
            asset_name="agent-gateway-linux-x86_64"
            if gh release view "${tag}" --json assets --jq ".assets[].name" 2>/dev/null | grep -Fxq "${asset_name}"; then
              echo "${tag} already has a release asset; nothing to do."
              echo "publish=false" >> "${GITHUB_OUTPUT}"
            else
              echo "publish=true" >> "${GITHUB_OUTPUT}"
            fi
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Install Rust toolchain
        if: steps.release.outputs.publish == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1

      - name: Install system build dependencies
        if: steps.release.outputs.publish == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libdbus-1-dev libssl-dev \
            libsasl2-dev libsasl2-modules cmake libcurl4-openssl-dev \
            libxml2-dev libxmlsec1-dev xmlsec1 libclang-dev pkg-config \
            protobuf-compiler

      - if: steps.release.outputs.publish == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build release binary
        if: steps.release.outputs.publish == 'true'
        run: cargo build --release --locked --bin agent-gateway

      - name: Prepare release assets
        if: steps.release.outputs.publish == 'true'
        run: |
          cp target/release/agent-gateway target/release/agent-gateway-linux-x86_64
          sha256sum target/release/agent-gateway-linux-x86_64 > target/release/agent-gateway-linux-x86_64.sha256

      - name: Attest release binary
        if: steps.release.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/release/agent-gateway-linux-x86_64

      # Minted after the build so no build script or proc-macro can read it.
      - name: Create release app token
        if: steps.release.outputs.publish == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      # Idempotent so a re-run after a partial failure (e.g. the release step below
      # failed after the tag was already pushed) does not fail on "tag already exists".
      - name: Tag reviewed merge commit
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          echo "::add-mask::${auth}"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}"
          existing_sha="$(git ls-remote "${remote}" "refs/tags/${TAG}" "refs/tags/${TAG}^{}" | tail -1 | awk '{print $1}')"
          if [[ -n "${existing_sha}" ]]; then
            if [[ "${existing_sha}" != "${GITHUB_SHA}" ]]; then
              echo "::error::Tag ${TAG} already exists on a different commit (${existing_sha})."
              exit 1
            fi
            echo "Tag ${TAG} already points at ${GITHUB_SHA}; skipping re-tag."
          else
            git tag --annotate "${TAG}" --message "Release ${TAG}" "${GITHUB_SHA}"
            git push "${remote}" "refs/tags/${TAG}"
          fi

      - name: Create GitHub Release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag_name: ${{ steps.release.outputs.tag }}
          body_path: ${{ runner.temp }}/release-body.md
          generate_release_notes: false
          files: |
            target/release/agent-gateway-linux-x86_64
            target/release/agent-gateway-linux-x86_64.sha256
