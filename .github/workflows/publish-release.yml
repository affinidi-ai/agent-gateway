name: Publish release

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - CHANGELOG.md

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish reviewed release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read

      # Pinned to the exact commit that triggered this run, not the (possibly moved-on)
      # main tip, so the binary built below always matches the commit tagged later.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Install changelog dependencies
        run: python3 -m pip install PyYAML

      - name: Detect reviewed release
        id: release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          release_branch="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '.[] | select(.base.ref == "main" and (.head.ref | startswith("release/"))) | .head.ref' \
            | head -1)"
          if [[ -z "${release_branch}" ]]; then
            echo "This commit is not associated with a release PR merge; nothing to publish."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          version="$(sed -n '/^\[package\]/,/^\[/{s/^version = "\(.*\)"/\1/p;}' Cargo.toml)"
          tag="v${version}"
          if ! python3 .github/scripts/changelog.py github-notes "${version}" > "${RUNNER_TEMP}/release-body.md"; then
            echo "CHANGELOG.md has no reviewed ${version} section; nothing to publish."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
          else
            asset_name="agent-gateway-linux-x86_64"
            if gh release view "${tag}" --json assets --jq ".assets[].name" 2>/dev/null | grep -Fxq "${asset_name}"; then
              echo "${tag} already has a release asset; nothing to do."
              echo "publish=false" >> "${GITHUB_OUTPUT}"
            else
              echo "publish=true" >> "${GITHUB_OUTPUT}"
            fi
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Install Rust toolchain
        if: steps.release.outputs.publish == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.95.0

      - name: Install system build dependencies
        if: steps.release.outputs.publish == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libdbus-1-dev libssl-dev \
            libsasl2-dev libsasl2-modules cmake libcurl4-openssl-dev \
            libxml2-dev libxmlsec1-dev xmlsec1 libclang-dev pkg-config \
            protobuf-compiler

      - if: steps.release.outputs.publish == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build release binary
        if: steps.release.outputs.publish == 'true'
        run: cargo build --release --locked --bin agent-gateway

      - name: Prepare release assets
        if: steps.release.outputs.publish == 'true'
        run: |
          cp target/release/agent-gateway target/release/agent-gateway-linux-x86_64
          sha256sum target/release/agent-gateway-linux-x86_64 > target/release/agent-gateway-linux-x86_64.sha256

      - name: Attest release binary
        if: steps.release.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/release/agent-gateway-linux-x86_64

      # Idempotent so a re-run after a partial failure (e.g. the release step below
      # failed after the tag was already pushed) does not fail on "tag already exists".
      - name: Tag reviewed merge commit
        if: steps.release.outputs.publish == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${{ steps.app-token.outputs.token }}" | base64 -w0)"
          existing_sha="$(git -c "http.extraheader=${auth_header}" ls-remote origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" | tail -1 | awk '{print $1}')"
          if [[ -n "${existing_sha}" ]]; then
            if [[ "${existing_sha}" != "${GITHUB_SHA}" ]]; then
              echo "::error::Tag ${TAG} already exists on a different commit (${existing_sha})."
              exit 1
            fi
            echo "Tag ${TAG} already points at ${GITHUB_SHA}; skipping re-tag."
          else
            git tag --annotate "${TAG}" --message "Release ${TAG}" "${GITHUB_SHA}"
            git -c "http.extraheader=${auth_header}" push origin "${TAG}"
          fi

      - name: Create GitHub Release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag_name: ${{ steps.release.outputs.tag }}
          body_path: ${{ runner.temp }}/release-body.md
          generate_release_notes: false
          files: |
            target/release/agent-gateway-linux-x86_64
            target/release/agent-gateway-linux-x86_64.sha256
