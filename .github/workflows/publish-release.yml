name: Publish release

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - CHANGELOG.md

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    name: Detect release PR merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.pr.outputs.release }}
    steps:
      - name: Require a merged release PR opened by a bot
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          match="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            | jq --arg repo "${GITHUB_REPOSITORY}" '[.[] | select(
                .merged_at != null
                and .base.ref == "main"
                and (.head.ref | startswith("release/v"))
                and .head.repo.full_name == $repo
                and .user.type == "Bot"
              )] | length')"
          if [[ "${match}" -ge 1 ]]; then
            echo "release=true" >> "${GITHUB_OUTPUT}"
          else
            echo "${GITHUB_SHA} is not the merge of a bot-opened release/v* PR; nothing to publish."
            echo "release=false" >> "${GITHUB_OUTPUT}"
          fi

  publish:
    name: Publish reviewed release
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # Pinned to the exact commit that triggered this run, not the (possibly moved-on)
      # main tip, so the binary built below always matches the commit tagged later.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Install changelog dependencies
        run: python3 -m pip install PyYAML

      - name: Detect reviewed release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n '/^\[package\]/,/^\[/{s/^version = "\(.*\)"/\1/p;}' Cargo.toml)"
          tag="v${version}"
          if ! python3 .github/scripts/changelog.py github-notes "${version}" > "${RUNNER_TEMP}/release-body.md"; then
            echo "CHANGELOG.md has no reviewed ${version} section; nothing to publish."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
          else
            asset_name="agent-gateway-linux-x86_64"
            if gh release view "${tag}" --json assets --jq ".assets[].name" 2>/dev/null | grep -Fxq "${asset_name}"; then
              echo "${tag} already has a release asset; nothing to do."
              echo "publish=false" >> "${GITHUB_OUTPUT}"
            else
              echo "publish=true" >> "${GITHUB_OUTPUT}"
            fi
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Install Rust toolchain
        if: steps.release.outputs.publish == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.95.0

      - name: Install system build dependencies
        if: steps.release.outputs.publish == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libdbus-1-dev libssl-dev \
            libsasl2-dev libsasl2-modules cmake libcurl4-openssl-dev \
            libxml2-dev libxmlsec1-dev xmlsec1 libclang-dev pkg-config \
            protobuf-compiler

      - if: steps.release.outputs.publish == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build release binary
        if: steps.release.outputs.publish == 'true'
        run: cargo build --release --locked --bin agent-gateway

      - name: Prepare release assets
        if: steps.release.outputs.publish == 'true'
        run: |
          cp target/release/agent-gateway target/release/agent-gateway-linux-x86_64
          sha256sum target/release/agent-gateway-linux-x86_64 > target/release/agent-gateway-linux-x86_64.sha256

      - name: Attest release binary
        if: steps.release.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/release/agent-gateway-linux-x86_64

      # Minted after the build so no build script or proc-macro can read it.
      - name: Create release app token
        if: steps.release.outputs.publish == 'true'
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      # Idempotent so a re-run after a partial failure (e.g. the release step below
      # failed after the tag was already pushed) does not fail on "tag already exists".
      - name: Tag reviewed merge commit
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          existing_sha="$(git ls-remote "${remote}" "refs/tags/${TAG}" "refs/tags/${TAG}^{}" | tail -1 | awk '{print $1}')"
          if [[ -n "${existing_sha}" ]]; then
            if [[ "${existing_sha}" != "${GITHUB_SHA}" ]]; then
              echo "::error::Tag ${TAG} already exists on a different commit (${existing_sha})."
              exit 1
            fi
            echo "Tag ${TAG} already points at ${GITHUB_SHA}; skipping re-tag."
          else
            git tag --annotate "${TAG}" --message "Release ${TAG}" "${GITHUB_SHA}"
            git push "${remote}" "refs/tags/${TAG}"
          fi

      - name: Create GitHub Release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag_name: ${{ steps.release.outputs.tag }}
          body_path: ${{ runner.temp }}/release-body.md
          generate_release_notes: false
          files: |
            target/release/agent-gateway-linux-x86_64
            target/release/agent-gateway-linux-x86_64.sha256
