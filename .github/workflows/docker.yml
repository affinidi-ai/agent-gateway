name: Container image

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - src/**
      - www/default/**
      - scripts/certs/generate-cert.sh
      - scripts/ci/**
      - .github/workflows/docker.yml
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  TRIVY_ENFORCE: ${{ vars.TRIVY_ENFORCE }}

jobs:
  verify:
    name: Build ${{ matrix.platform }}
    if: github.event_name != 'push'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"platform":"linux/amd64","runner":"ubuntu-latest","pair":"amd64"}]'
          || '[{"platform":"linux/amd64","runner":"ubuntu-latest","pair":"amd64"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm","pair":"arm64","build_args":"CARGO_BUILD_FLAGS=-j2\nCARGO_PROFILE_RELEASE_CODEGEN_UNITS=1"}]') }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Scan Dockerfile
        if: matrix.pair == 'amd64'
        run: bash scripts/ci/trivy-scan.sh config

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: ${{ matrix.build_args }}
          load: true
          tags: agent-gateway:verify
          provenance: false

      - name: Boot-probe image
        env:
          IMAGE: agent-gateway:verify
        run: bash scripts/ci/boot-probe.sh

      - name: Scan image
        run: bash scripts/ci/trivy-scan.sh image agent-gateway:verify


  build:
    name: Build and push ${{ matrix.platform }}
    if: github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            pair: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            pair: arm64
            build_args: |-
              CARGO_BUILD_FLAGS=-j2
              CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Scan Dockerfile
        if: matrix.pair == 'amd64'
        run: bash scripts/ci/trivy-scan.sh config

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: ${{ matrix.build_args }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: false

      - name: Boot-probe pushed image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker pull "${IMAGE_NAME}@${DIGEST}"
          IMAGE="${IMAGE_NAME}@${DIGEST}" bash scripts/ci/boot-probe.sh

      - name: Scan pushed image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: bash scripts/ci/trivy-scan.sh image "${IMAGE_NAME}@${DIGEST}"

      - name: Record digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-arch image
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=${{ github.ref_type == 'tag' && 'auto' || 'false' }}
          tags: |
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.ref_type == 'tag' }}

      - name: Create multi-arch manifest
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          META_JSON: ${{ steps.meta.outputs.json }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: bash "${GITHUB_WORKSPACE}/scripts/ci/publish-manifest.sh"

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
