name: pr-title

# Squash merges use the PR title as the commit message on `main`, so the title
# must follow Conventional Commits. `edited` re-runs the check when only the
# title changes; `synchronize` gives every new head commit its own result, as
# required checks are tied to the head SHA.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  check_title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Same minimum as the org semantic-release-commits ruleset.
          subjectPattern: ^.{5,}$
          subjectPatternError: The description after "type:" must be at least 5 characters.
